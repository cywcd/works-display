<body class="select-none">

<!-- 3D 场景容器 -->
<div id="three-root"></div>
<div class="vignette"></div>

<!-- 顶部栏 -->
<header class="fixed top-0 left-0 right-0 z-30 flex items-center justify-between px-6 py-3"
      style="background:linear-gradient(180deg,rgba(10,9,7,.92),transparent);">
  <div class="flex items-center gap-3">
    <div class="seal w-11 h-11 flex items-center justify-center text-xl font-bold leading-tight text-center">天工<br>巧卯</div>
    <div>
      <h1 class="font-kai text-2xl text-gold2 tracking-[.35em]">天工巧卯</h1>
      <p class="text-[12px] text-gold/70 tracking-[0]">3D 数 字 馆 · 不 用 一 钉 一 铁 的 中 国 智 慧</p>
    </div>
  </div>
  <nav id="zone-tabs" class="flex gap-1 text-sm"></nav>
  <div class="text-[12px] text-gold/50 tracking-widest hidden lg:block">拖拽旋转 · 滚轮缩放 · 点击交互</div>
</header>

<!-- 左：展品目录 -->

  <div class="px-4 pt-3 pb-2">
    <div id="zone-name" class="panel-title pl-3 font-kai text-lg text-gold2"></div>
    <div id="zone-sub" class="pl-3 text-[12px] text-gold/60 tracking-widest mt-1"></div>
  </div>
  <div class="gold-line mx-3"></div>
  <div id="exhibit-list" class="flex-1 overflow-y-auto scroll-thin py-2"></div>
</aside>

<!-- 右：展品说明与专属控制 -->
<aside id="right-panel" class="fixed right-4 top-24 w-80 z-20 glass rounded-md flex flex-col max-h-[calc(100%-9.5rem)]">
  <div class="p-4 overflow-y-auto scroll-thin">
    <div id="info-cat" class="tag inline-block px-2 py-0.5 rounded-sm"></div>
    <h2 id="info-title" class="font-kai text-2xl text-gold2 mt-2 tracking-widest"></h2>
    <div id="info-sub" class="text-xs text-gold/60 tracking-widest mt-1"></div>
    <div class="gold-line my-3"></div>
    <p id="info-desc" class="text-[14px] leading-7 text-[#d9cbb0]"></p>
    <div id="info-mech" class="mt-3 space-y-2"></div>
    <div class="gold-line my-3"></div>
    <div id="zone-controls" class="space-y-3"></div>
  </div>
</aside>

<!-- 底部控制条 -->
<div id="control-bar" class="fixed bottom-4 z-30 glass rounded-full px-6 py-2.5 flex items-center justify-center gap-4 whitespace-nowrap"
     style="left:50%;transform:translateX(-50%);width:max-content;max-width:97vw;overflow:visible;">
  <button id="btn-explode" class="ctrl-btn rounded-full px-5 py-1.5 text-xs tracking-widest whitespace-nowrap">一键拆解</button>
  <button id="btn-assemble" class="ctrl-btn rounded-full px-5 py-1.5 text-xs tracking-widest whitespace-nowrap">逆向拼装</button>
  <div class="flex items-center gap-2 text-xs text-gold/80 whitespace-nowrap">
    <span class="tracking-widest">拆解度</span>
    <input id="explode-slider" type="range" min="0" max="100" value="0" class="w-36">
  </div>
  <div class="w-px h-5 bg-gold/25"></div>
  <button id="btn-rotate" class="ctrl-btn on rounded-full w-9 h-9 text-xs whitespace-nowrap" title="自动旋转">转</button>
  <button id="btn-stress" class="ctrl-btn rounded-full px-6 h-9 text-xs tracking-widest whitespace-nowrap" title="应力分析视图">应力</button>
  <button id="btn-quake" class="ctrl-btn rounded-full px-6 h-9 text-xs tracking-widest whitespace-nowrap" title="模拟地震剪切波">地震</button>
  <button id="btn-label" class="ctrl-btn on rounded-full w-9 h-9 text-xs whitespace-nowrap" title="构件标注">注</button>
  <button id="btn-reset" class="ctrl-btn rounded-full w-9 h-9 text-xs whitespace-nowrap" title="复位视角">位</button>

</div>

<!-- 游戏内提示（托盘） -->
<div id="tray-hint" class="hidden z-10">工 件 托 盘</div>

<!-- 游戏中央浮层（九连环节等 HTML 玩法） -->
<div id="game-overlay" class="hidden fixed z-30 inset-0 flex items-center justify-center"
     style="background:rgba(8,7,5,.55);backdrop-filter:blur(2px);"></div>

<!-- Toast -->
<div id="toast-box" class="fixed top-20 left-1/2 -translate-x-1/2 z-40 space-y-2 pointer-events-none"></div>

<!-- 加载页 -->
<div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-ink lattice">
  <div class="seal w-16 h-16 flex items-center justify-center text-2xl font-bold leading-tight text-center">天工<br>巧卯</div>
  <div class="mt-5 font-kai text-gold2 text-xl tracking-[.5em]">天 工 巧 卯</div>
  <div class="mt-2 text-xs text-gold/60 tracking-[.3em]">榫卯之间，承载千年</div>
  <div class="mt-6 w-56 h-[2px] bg-wood/40 overflow-hidden"><div id="load-bar" class="h-full bg-gold w-0 transition-all duration-300"></div></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

/* ============ 全局 ============ */
const $ = s => document.querySelector(s);
const root = $('#three-root');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14110d);
scene.fog = new THREE.FogExp2(0x14110d, 0.0085);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, .1, 200);
camera.position.set(6, 4.2, 7.5);

const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.28;
root.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style,{position:'absolute',top:'0',left:'0',pointerEvents:'none'});
root.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.target.set(0,1.6,0); controls.minDistance=2.5; controls.maxDistance=26;
controls.maxPolarAngle = Math.PI*.52;

/* 灯光：明亮的博物馆展厅 */
scene.add(new THREE.AmbientLight(0xfff0dc, .65));
const hemi = new THREE.HemisphereLight(0xfff4e2, 0x241a10, .95);
scene.add(hemi);
const keyLight = new THREE.SpotLight(0xffe9c4, 6.5, 70, .62, .45, 1.1);
keyLight.position.set(7, 13, 7); keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048,2048);
keyLight.shadow.bias=-0.0004; scene.add(keyLight);
const keyTarget=new THREE.Object3D();keyTarget.position.set(0,1.2,0);scene.add(keyTarget);keyLight.target=keyTarget;
const fillL = new THREE.DirectionalLight(0xffe0b4, 1.15); fillL.position.set(-6,5,3); scene.add(fillL);
const rimLight = new THREE.DirectionalLight(0xbfd2ff, .9); rimLight.position.set(-6,7,-7); scene.add(rimLight);
const warmFill = new THREE.PointLight(0xe3c98f, 1.5, 26); warmFill.position.set(-3,4,5); scene.add(warmFill);
const warmFill2 = new THREE.PointLight(0xd9b37a, 1.1, 24); warmFill2.position.set(4,3.5,-4); scene.add(warmFill2);

/* 地面 */
const floor = new THREE.Mesh(new THREE.CircleGeometry(30,64),
  new THREE.MeshStandardMaterial({color:0x241d16,roughness:.9,metalness:0}));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
const ring = new THREE.Mesh(new THREE.RingGeometry(2.7,2.74,80),
  new THREE.MeshBasicMaterial({color:0x8a6d3b,transparent:true,opacity:.5,side:THREE.DoubleSide}));
ring.rotation.x=-Math.PI/2; ring.position.y=.01; scene.add(ring);
const ring2 = ring.clone(); ring2.geometry = new THREE.RingGeometry(4.4,4.42,96); ring2.material=ring.material.clone(); ring2.material.opacity=.25; scene.add(ring2);
const grid = new THREE.GridHelper(30,30,0x3a2c1c,0x241b12); grid.material.transparent=true; grid.material.opacity=.35; grid.position.y=.005; scene.add(grid);

/* ============ 木纹程序化纹理 ============ */
function makeWoodTexture(base='#7a5536', dark='#4d3420', light='#a87f52'){
  const c=document.createElement('canvas'); c.width=c.height=512; const g=c.getContext('2d');
  g.fillStyle=base; g.fillRect(0,0,512,512);
  for(let i=0;i<260;i++){
    const y=Math.random()*512, amp=3+Math.random()*10, f=.008+Math.random()*.02, ph=Math.random()*9;
    g.strokeStyle=`rgba(${Math.random()<.5?dark:light},${.05+Math.random()*.16})`;
    g.lineWidth=.5+Math.random()*2; g.beginPath();
    for(let x=0;x<=512;x+=8){const yy=y+Math.sin(x*f+ph)*amp+Math.sin(x*.05+ph)*1.2; x===0?g.moveTo(x,yy):g.lineTo(x,yy);}
    g.stroke();
  }
  for(let k=0;k<7;k++){ // 木节
    const x=Math.random()*512,y=Math.random()*512,r=8+Math.random()*22;
    for(let j=0;j<5;j++){g.strokeStyle=`rgba(77,52,32,${.18-j*.03})`;g.lineWidth=1.4;
      g.beginPath();g.ellipse(x,y,r*(1+j*.5),r*.45*(1+j*.5),Math.random()*.6,0,7);g.stroke();}
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1.6,1.6);
  t.colorSpace=THREE.SRGBColorSpace; return t;
}
const TEX = {
  huali: makeWoodTexture('#855b38','#4e331c','#b98d5c'),   // 花梨木
  nanmu: makeWoodTexture('#9a7d4f','#5e4a28','#c7ad74'),   // 金丝楠
  zitan: makeWoodTexture('#4a2f22','#2a1910','#6e4a33'),   // 紫檀
  zhu:   makeWoodTexture('#c2a878','#8a7246','#e0ca96'),   // 竹
};
/* 共享材质注册表：进入此集合的材质为跨展品长期复用资源，clearModel/_dispose 时不释放，
   避免每次切换都触发 GPU program/uniform/纹理重新编译上传（消除切换抖动）。 */
const SHARED_MATERIALS = new WeakSet();
function shareMaterial(m){ SHARED_MATERIALS.add(m); return m; }
/* 木纹材质按 (kind,tint) 池化：全站 woodMat 调用 80+ 处且大量在循环内重复同参创建，
   池化后零视觉变化（同参数完全等价），大幅减少材质实例与切换时的 GPU 重编译。
   关键前提：池化材质创建后只被整体替换（应力模式），从无任何字段被就地修改（已全量核对）。 */
const _woodMatCache = new Map();
function woodMat(kind='huali', tint=1){
  const tt=Math.min(1.28,tint*1.12);
  const key=kind+':'+tt.toFixed(4);
  let m=_woodMatCache.get(key);
  if(!m){
    m=new THREE.MeshStandardMaterial({map:TEX[kind],color:new THREE.Color(tt,tt,tt),
      roughness:.42,metalness:.05,envMapIntensity:.8});
    shareMaterial(m); _woodMatCache.set(key,m);
  }
  return m;
}
const MAT = {
  bronze: shareMaterial(new THREE.MeshStandardMaterial({color:0xb08d4f,metalness:.9,roughness:.32})),
  bronzeDark: shareMaterial(new THREE.MeshStandardMaterial({color:0x6e552c,metalness:.85,roughness:.4})),
  iron: shareMaterial(new THREE.MeshStandardMaterial({color:0x555a60,metalness:.9,roughness:.3})),

/* ============ 建模工具 ============ */
function box(w,h,d,r=.02){return new RoundedBoxGeometry(w,h,d,2,r);}
/* 由若干子盒合并为一个构件，o: {size:[w,h,d], pos:[x,y,z], rot?:[x,y,z]} */
function mergedPiece(parts, mat){
  const geos = parts.map(p=>{
    const g = box(...p.size, p.r??.018);
    if(p.rot){const e=new THREE.Euler(...p.rot);g.rotateX(e.x);g.rotateY(e.y);g.rotateZ(e.z);}
    g.translate(...p.pos); return g;
  });
  const m = new THREE.Mesh(BufferGeometryUtils.mergeGeometries(geos, false), mat);
  m.castShadow=m.receiveShadow=true; return m;
}
function simplePiece(w,h,d,mat,pos=[0,0,0],r=.02){
  const m=new THREE.Mesh(box(w,h,d,r),mat); m.position.set(...pos);
  m.castShadow=m.receiveShadow=true; return m;
}
function cyl(rt,rb,h,seg=20){return new THREE.CylinderGeometry(rt,rb,h,seg);}

/* ============ 构件元数据注册 ============ */
/* piece.userData { label, stress:0..1 基础应力权重 } */
function tagPiece(obj, label, stress=.3){ obj.userData.label=label; obj.userData.baseStress=stress; return obj; }

/* ============ 音效系统（Web Audio 程序化合成，无需音频文件） ============ */
const SFX = (()=>{
  let ctx=null, master=null, muted=false, unlocked=false;
  function ac(){
    if(!unlocked)return null;
    if(!ctx){
      try{
        const AC=window.AudioContext||window.webkitAudioContext; ctx=new AC();
        master=ctx.createGain(); master.gain.value=.5; master.connect(ctx.destination);
      }catch(e){ unlocked=false; return null; }
    }
    if(ctx.state==='suspended'){ const p=ctx.resume(); if(p&&p.catch)p.catch(()=>{}); }
    return ctx;
  }
  function env(g,t0,a,d,peak=.4){
    const g2=ctx.createGain();g2.connect(master);
    g2.gain.setValueAtTime(0,t0);
    g2.gain.linearRampToValueAtTime(peak,t0+a);
    g2.gain.exponentialRampToValueAtTime(.0001,t0+a+d);
    g.connect(g2);return g2;
  }
  /* 木鱼/木块敲击 */
  function wood(freq=320,peak=.45,decay=.18){
    const c=ac();if(muted||!c)return;const t=c.currentTime;
    const o=c.createOscillator(),o2=c.createOscillator();
    o.type='triangle';o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*.6,t+decay);
    o2.type='square';o2.frequency.setValueAtTime(freq*1.7,t);
    const g=env(c.createGain(),t,.004,decay,peak),gf=c.createGain();gf.gain.value=.25;
    o.connect(g);o2.connect(gf);gf.connect(g);
    o.start(t);o2.start(t);o.stop(t+decay+.05);o2.stop(t+decay+.05);
  }
  /* 木质滑动摩擦（白噪+带通） */
  function slide(dur=.35,peak=.12){
    const c=ac();if(muted||!c)return;const t=c.currentTime,n=Math.floor(c.sampleRate*dur);
    const buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const src=c.createBufferSource();src.buffer=buf;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=.8;
    const g=c.createGain();g.gain.value=peak;src.connect(f);f.connect(g);g.connect(master);src.start(t);
  }
  /* 钟声/锣（高频正弦簇） */
  function bell(){
    const c=ac();if(muted||!c)return;const t=c.currentTime;
    [523,784,1046,1568].forEach((f,i)=>{
      const o=c.createOscillator();o.type='sine';o.frequency.value=f;
      const g=c.createGain();g.connect(master);
      g.gain.setValueAtTime(.28/(i+1),t);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);
      o.connect(g);o.start(t);o.stop(t+1.7);
    });
  }
  function drum(){wood(150,.55,.28);}
  /* 弓弦击发：高频下滑的筋弦声 */
  function twang(){
    const c=ac();if(muted||!c)return;const t=c.currentTime;
    const o=c.createOscillator();o.type='sawtooth';
    o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(180,t+.18);
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=2400;
    const g=c.createGain();g.gain.setValueAtTime(.32,t);g.gain.exponentialRampToValueAtTime(.0001,t+.22);
    o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+.25);
  }
  return {
    unlock(){unlocked=true;ac();},
    load(){ const c=ac();if(muted||!c)return;const t=c.currentTime;
      [262,330,392,523].forEach((f,i)=>setTimeout(()=>{if(muted||!unlocked)return;
        const o=c.createOscillator();o.type='sine';o.frequency.value=f;
        const g=c.createGain();g.connect(master);g.gain.setValueAtTime(0,t+i*.09);
        g.gain.linearRampToValueAtTime(.3,t+i*.09+.03);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.5);
        o.connect(g);o.start();o.stop(t+.6);},i*110));
    },
    explode(){slide(.3,.1);setTimeout(()=>wood(180,.3,.25),120);},
    assemble(){wood(420,.4,.15);setTimeout(()=>wood(620,.45,.2),90);},
    pick(){wood(520,.25,.08);},
    place(){wood(300,.5,.16);setTimeout(()=>wood(440,.4,.18),70);},
    reject(){wood(140,.45,.3);},
    win(){[392,523,659,784,1046].forEach((f,i)=>setTimeout(()=>wood(f,.4,.25),i*120));},
    step(){wood(280,.18,.07);},
    drum,bell,slide,twang,
    toggle(){muted=!muted;return muted;},
    get muted(){return muted;}
  };
})();
/* 全局首次手势解锁音频：http 来源下浏览器自动播放策略要求用户手势后才能启动 AudioContext，
   点击按钮/面板（而非仅 canvas）也必须能解锁，故在捕获阶段监听整个文档，触发一次即移除。 */
(function(){
  const EVENTS=['pointerdown','keydown','touchstart','click'];
  const unlock=()=>{ SFX.unlock();
    EVENTS.forEach(ev=>document.removeEventListener(ev,unlock,true)); };
  EVENTS.forEach(ev=>
    document.addEventListener(ev,unlock,{capture:true,passive:true}));
})();
const STRESS_COLORS = [
  [.25,.45,.95],[.3,.8,.85],[.42,.85,.5],[.95,.86,.3],[.95,.5,.22],[.85,.16,.12]
].map(c=>new THREE.Color(...c));
function stressColor(v){ // 0..1 冷->暖
  v=THREE.MathUtils.clamp(v,0,1); const i=v*(STRESS_COLORS.length-1);
  const a=Math.floor(i), b=Math.min(a+1,STRESS_COLORS.length-1), f=i-a;
  return STRESS_COLORS[a].clone().lerp(STRESS_COLORS[b],f);
}
/* 零分配版本：把插值结果写入已存在的 target Color，供逐帧高频路径复用，避免 GC 抖动 */
function stressColorTo(target,v){
  v=THREE.MathUtils.clamp(v,0,1); const i=v*(STRESS_COLORS.length-1);
  const a=Math.floor(i), b=Math.min(a+1,STRESS_COLORS.length-1);
  return target.copy(STRESS_COLORS[a]).lerp(STRESS_COLORS[b],i-a);
}

class Viewer {
  constructor(){
    this.model=null; this.pieces=[]; this.labels=[];
    this.explode=0; this.targetExplode=0; this.autoRotate=true; this.speed=1;
    this.stress=false; this.quake=false; this.quakeT=0; this.labelsOn=true;
    this.customUpdate=null; this.customDestroy=null; this.game=null;
    this.raycaster=new THREE.Raycaster(); this.pointer=new THREE.Vector2();
    this.tweens=[]; this._lastT=performance.now();
    this._bindUI();
    const loop=()=>{requestAnimationFrame(loop);
      /* 标签页切到后台时暂停更新与双渲染，省电省 GPU；回到前台重置时钟，避免 dt 跳变 */
      if(document.hidden){ this._lastT=performance.now(); return; }
      const now=performance.now();
      const dt=Math.min(.05,Math.max(.001,(now-this._lastT)/1000));
      this._lastT=now;this.update(dt);
      renderer.render(scene,camera);
      /* 标签层：开启时每帧渲染；关闭时不逐帧渲染以省开销，
         但切换当帧必须再渲染一次，CSS2DRenderer 才会据 visible=false 隐藏 DOM */
      if(this.labels.length&&(this.labelsOn||this._labelsDirty)){
        labelRenderer.render(scene,camera); this._labelsDirty=false;
      }};
    loop();
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);});
  }
  _bindUI(){
    $('#btn-explode').onclick=()=>{SFX.explode();this.setExplode(1);};
    $('#btn-assemble').onclick=()=>{SFX.assemble();this.setExplode(0);};
    $('#btn-mute').onclick=e=>{const m=SFX.toggle();e.target.classList.toggle('on',!m);
      if(!m)SFX.unlock();};
    $('#explode-slider').oninput=e=>this.setExplode(e.target.value/100,true);
    renderer.domElement.addEventListener('pointerdown',()=>SFX.unlock());
    $('#btn-rotate').onclick=e=>{this.autoRotate=!this.autoRotate;e.target.classList.toggle('on',this.autoRotate);};
    $('#btn-stress').onclick=e=>{this.stress=!this.stress;e.target.classList.toggle('on',this.stress);this.applyStressMode();};
    $('#btn-quake').onclick=e=>{this.triggerQuake();};
    $('#btn-label').onclick=e=>{this.labelsOn=!this.labelsOn;e.target.classList.toggle('on',this.labelsOn);
      this._labelsDirty=true; this.labels.forEach(l=>l.visible=this.labelsOn);};
    $('#btn-reset').onclick=()=>this.frameView();
  }
  clearModel(){
    this.tweens.length=0;
    /* 先退出应力模式：恢复每构件原始材质并释放应力专用材质，避免材质泄漏 */
    if(this.stress){this.stress=false;this.applyStressMode();}
    if(this.customDestroy){try{this.customDestroy();}catch(e){} this.customDestroy=null;}
    if(this.game){this.game=null;}
    if(this.model){scene.remove(this.model);this._dispose(this.model);this.model=null;}
    this.pieces=[];this.labels=[];
    this.setExplode(0,true); $('#explode-slider').value=0;
    this.quake=false;this.quakeT=0;
    this._wallObj=null;
    if(this._wallObjInScene){scene.remove(this._wallObjInScene);this._dispose(this._wallObjInScene);this._wallObjInScene=null;}
    this.stress=false;$('#btn-stress').classList.remove('on');$('#stress-legend')?.remove();
  }
  _dispose(o){o.traverse?.(n=>{if(n.geometry)n.geometry.dispose();
    if(n.material){(Array.isArray(n.material)?n.material:[n.material]).forEach(m=>{
      if(m&&m.dispose&&!SHARED_MATERIALS.has(m))m.dispose();});}
    if(n.isCSS2DObject&&n.element&&n.element.remove)n.element.remove();});}
  register(group, {frame=true}={}){
    this.model=group; scene.add(group);
    group.updateWorldMatrix(true,true);
    const origin=new THREE.Vector3();group.getWorldPosition(origin);
    group.traverse(o=>{ if(o.isMesh&&o.userData.label!==undefined){
      this.pieces.push(o);
      const c=new THREE.Vector3();o.getWorldPosition(c);
      const box3=new THREE.Box3().setFromObject(o);
      o.userData.homePos=o.position.clone();
      o.userData.explodeDir=(o.userData.dir?new THREE.Vector3(...o.userData.dir):
        c.clone().sub(origin).setY((box3.max.y-box3.min.y)*.3+.35)).normalize();
      o.userData.homeMat=o.material;   // 材质已池化/共享，直接引用，无需克隆
      if(o.userData.label){
        const div=document.createElement('div');div.className='label3d';div.textContent=o.userData.label;
        const lb=new CSS2DObject(div);
        const off=o.userData.labelOff;
        lb.position.set(off?off[0]:0,(box3.max.y-box3.min.y)/2+(off?off[1]:.12),off?off[2]:0);
        o.add(lb);this.labels.push(lb);
        lb.visible=this.labelsOn;
      }
    }});
    this._labelsDirty=true;   // 新模型标签首次需经 CSS2DRenderer 应用一次显隐
    group.updateWorldMatrix(true,true);
    if(frame) this.frameView();
    return group;
  }
  frameView(pad=1.0){
    if(!this.model)return;
    const {center,radius}=this._modelBounds(1.15*pad);
    const fov=camera.fov*Math.PI/180;
    let dist=radius/Math.sin(fov/2)*1.06;
    dist=Math.max(4.5,dist);
    this.tweenCam(new THREE.Vector3(center.x+dist*.62,center.y+dist*.42,center.z+dist*.78),
      new THREE.Vector3(center.x,center.y,center.z));
  }
  /* 计算模型（含爆炸余量）的球心与半径，保证拆解全程不出画面 */
  _modelBounds(explodePad=1){
    const b0=new THREE.Box3().setFromObject(this.model);
    const center=b0.getCenter(new THREE.Vector3());
    let radius=b0.getSize(new THREE.Vector3()).length()/2;
    const scale=this.model.userData.explodeScale||1;
    if(explodePad>0&&this.pieces.length){
      this.pieces.forEach(p=>{
        if(p.userData.noExplode)return;
        const c=new THREE.Vector3();p.getWorldPosition(c);
        const d=(p.userData.explodeDir||new THREE.Vector3(0,1,0)).clone();
        const far=c.clone().addScaledVector(d,1.5*scale*explodePad);
        radius=Math.max(radius,far.distanceTo(center)+.6);
      });
    }
    return {center,radius};
  }
  /* 进馆自动演示：默认拆解状态 → 停留 → 拼装合拢 */
  playIntro(){
    if(!this.model||this.model.userData.noIntro)return;
    this.setExplode(1,true);
    this.intro={t:0,phase:0}; // 0:拆解停留 1:拼装
  }
  tweenCam(pos,tgt){
    this.tweens.push({t:0,dur:1,from:camera.position.clone(),to:pos.clone(),
      ft:controls.target.clone(),tt:tgt.clone(),
      up(k){camera.position.lerpVectors(this.from,this.to,k);controls.target.lerpVectors(this.ft,this.tt,k);}});
  }
  setExplode(v,immediate){
    if(this.intro&&!immediate)this.intro=null; // 手动操作打断自动演示
    this.targetExplode=v; if(immediate){this.explode=v;}
    const s=$('#explode-slider'); if(document.activeElement!==s)s.value=Math.round(v*100);
  }
  triggerQuake(){
    if(!this.model)return;
    this.quake=true;this.quakeT=0;
    toast('地震剪切波来袭 · 观察榫卯节点的微位移耗能','ok');
    if(!this.stress){this.stress=true;$('#btn-stress').classList.add('on');this.applyStressMode();}
  }
  applyStressMode(){
    this.pieces.forEach(p=>{
      const prev=p.material;
      p.material=this.stress?new THREE.MeshStandardMaterial({vertexColors:false,
        roughness:.55,metalness:.05,emissiveIntensity:.5}):p.userData.homeMat;
      /* 换下的若是一次性应力材质（非共享池材质）则释放，避免每开关一次泄漏 N 个材质 */
      if(prev&&prev!==p.material&&!SHARED_MATERIALS.has(prev))prev.dispose();
    });
    let legend=$('#stress-legend');
    if(this.stress){
      if(!legend){
        legend=document.createElement('div');legend.id='stress-legend';
        legend.className='fixed z-20 glass rounded-md px-3 py-2 text-[12px] tracking-widest';
        legend.style.cssText='left:19rem;bottom:6.5rem;';
        legend.innerHTML=`<div class="text-gold2 mb-1">应力分布（低 → 高）</div>
          <div style="width:170px;height:10px;border-radius:3px;background:linear-gradient(90deg,
          rgb(64,115,242),rgb(77,204,217),rgb(107,217,128),rgb(242,219,77),rgb(242,128,56),rgb(217,41,31));"></div>
          <div class="flex justify-between text-gold/60 mt-1"><span>低应力</span><span>高应力</span></div>`;
        document.body.appendChild(legend);
      }
      legend.classList.remove('hidden');
    }else if(legend)legend.classList.add('hidden');
  }
  setStressLegend(on){$('#stress-legend')?.classList.toggle('hidden',!on);}
  addCollapseWall(pos=[3.4,0,1.2]){ // 墙倒屋不塌演示：可倒塌山墙
    const g=new THREE.Group();
    const mat=new THREE.MeshStandardMaterial({color:0x8d8478,roughness:.9});
    const w=simplePiece(2.4,2.8,.2,mat,[0,1.4,0],.01); g.add(w);
    for(let i=0;i<7;i++){
      const line=new THREE.Mesh(new THREE.BoxGeometry(2.42,.014,.012),
        new THREE.MeshBasicMaterial({color:0x5d564d}));
      line.position.set(0,-1.2+i*.4,.107); g.add(line);
    }
    for(let i=0;i<4;i++){
      const line=new THREE.Mesh(new THREE.BoxGeometry(.014,2.82,.012),
        new THREE.MeshBasicMaterial({color:0x5d564d}));
      line.position.set(-.9+i*.6,0,.108); g.add(line);
    }
    g.position.set(...pos); g.visible=false; scene.add(g);
    this._wallObj=g; this._wallObjInScene=g;
  }
  update(dt=1/60){
    // 进馆自动演示状态机：拆解停留 → 拼装合拢
    if(this.intro&&this.model){
      const it=this.intro;it.t+=dt;
      const H=1.2,A=1.7;
      if(it.phase===0){this.setExplode(1,true);
        if(it.t>=H){it.phase=1;it.t=0;SFX.assemble();}}
      else{this.setExplode(Math.max(0,1-it.t/A),true);
        if(it.t>=A){this.setExplode(0,true);this.intro=null;}}
    }
    // 拆解动画
    this.explode += (this.targetExplode-this.explode)*Math.min(1,dt*6);
    if(Math.abs(this.explode-this.targetExplode)<.001)this.explode=this.targetExplode;
    const k=this.easeInOut(this.explode);
    const distScale=this.model?.userData.explodeScale||1;
    /* 静止合拢、无地震、无游戏位移（机关盒）时跳过逐构件位置拷贝：
       大件（如木塔 ~250 构件）静态浏览时每帧省去整段遍历；有位移需求时逻辑与原来完全一致。 */
    const collapsed=(k===0);
    const gameOffsetActive=!!(this.model&&this.model.userData.gameOffsetActive);
    if(!collapsed||this.quake||gameOffsetActive){
      const n=this.pieces.length;
      this.pieces.forEach((p,i)=>{
        if(p.userData.noExplode)return;
        const d=p.userData.explodeDir; const delay=(i%n)/n*.15;
        const kk=THREE.MathUtils.clamp((k-delay)/(1-delay),0,1);
        p.position.copy(p.userData.homePos);
        if(p.userData.gameOffset)p.position.add(p.userData.gameOffset);
        p.position.addScaledVector(d,kk*1.5*distScale);
      });
    }
    // 相机补间
    this.tweens=this.tweens.filter(tw=>{tw.t+=dt/tw.dur;const k2=THREE.MathUtils.clamp(tw.t,0,1);
      const e=k2<.5?2*k2*k2:1-Math.pow(-2*k2+2,2)/2;tw.up(e);return k2<1;});
    // 地震
    if(this.quake&&this.model){
      this.quakeT+=dt; const t=this.quakeT;
      const env=Math.exp(-t*1.15)*Math.min(1,t*4);
      const amp=.22*env;
      this.model.position.set(Math.sin(t*23)*amp, Math.abs(Math.sin(t*31))*amp*.35, Math.cos(t*19)*amp);
      this.model.rotation.z=Math.sin(t*17)*.02*env;
      this.pieces.forEach((p,i)=>{ // 节点微位移
        const micro=Math.sin(t*27+i*1.7)*env*(.02+p.userData.baseStress*.05);
        p.position.addScaledVector(p.userData.explodeDir, micro*0.05);
      });
      if(this._wallObj){this._wallObj.visible=true;
        const wk=THREE.MathUtils.clamp((t-1.2)/1.6,0,1);
        this._wallObj.rotation.x=-wk*1.45; this._wallObj.position.y=wk*1.1;
      }
      if(this.stress)this.updateStress(env);
      if(t>6){this.quake=false;this.model.position.set(0,0,0);this.model.rotation.z=0;
        if(this._wallObj)this._wallObj.visible=false;}
    }else if(this.stress){ this.updateStress(.12+Math.sin(performance.now()*.001)*.05); }
    if(this.customUpdate)this.customUpdate(dt,performance.now()/1000);
    if(this.autoRotate&&this.model&&!this.quake)this.model.rotation.y+=dt*.22;
    controls.update();
  }
  updateStress(env){
    const t=performance.now()*.001;
    const colA=new THREE.Color(); // 复用，避免逐帧逐构件分配 Color
    this.pieces.forEach((p,i)=>{
      const wave=(Math.sin(t*6+i*1.3)+1)/2;
      const v=THREE.MathUtils.clamp(wave*(.25+p.userData.baseStress)*Math.max(.12,env)*1.5,.02,.98);
      stressColorTo(colA,v);
      p.material.color.copy(colA);

/* 约定：每个 builder 返回 Group，子构件带 userData.label，便于爆炸/标注/应力 */

function G(){ const g=new THREE.Group();return g; }
function TP(o,label,stress=.3,dir){ tagPiece(o,label,stress); if(dir)o.userData.dir=dir; return o; }
/* 梯形断面（燕尾）构件：沿 x 方向，front 宽 back 窄 */
function taper(len,wf,wb,depth,mat){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(wf/2,wb/2,len,4),mat);
  m.geometry.rotateZ(Math.PI/2); m.scale.z=depth/Math.max(wf,wb);
  m.castShadow=m.receiveShadow=true; return m;
}
/* 45 度斜切面框料（用于格角）：len 沿 x，右端斜切 */
function miterBar(len,sq,mat,left=true){
  const sh=new THREE.Shape();
  if(left){ sh.moveTo(0,-sq/2); sh.lineTo(len,0); sh.lineTo(0,sq/2); }
  else { sh.moveTo(0,0); sh.lineTo(len,-sq/2); sh.lineTo(len,sq/2); }
  sh.closePath();
  const geo=new THREE.ExtrudeGeometry(sh,{depth:sq,bevelEnabled:false});
  geo.translate(0,0,-sq/2);
  const m=new THREE.Mesh(geo,mat); m.castShadow=m.receiveShadow=true; return m;
}

/* ================= 应用框架 ================= */
const ZONES = [ZONE1];
let currentZone=null, currentItem=null;
const TABS = [
  ['z1','物之基'],['z2','势之弘'],['z3','工之巧'],['z4','机之变'],['z5','思之邃']
];
function renderTabs(){
  $('#zone-tabs').innerHTML = TABS.map(([id,n])=>
    `<button data-z="${id}" class="tab-btn px-3 lg:px-4 py-2 text-gold/75 text-sm">${n}</button>`).join('');
  $('#zone-tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const item=ZONES.find(z=>z.id===b.dataset.z).items[0][0];
    syncHash(b.dataset.z,item);
  });
}
function loadZone(id, itemId, fromRouter=false){
  const zone = ZONES.find(z=>z.id===id);
  if(!zone){toast('该展区正在布展中…','err');return;}
  currentZone = zone;
  $('#zone-tabs').querySelectorAll('[data-z]').forEach(b=>b.classList.toggle('active',b.dataset.z===id));
  $('#zone-name').textContent = currentZone.name;
  $('#zone-sub').textContent = currentZone.sub;
  renderList();
  const first = itemId && currentZone.items.find(i=>i[0]===itemId);
  loadItem(first||currentZone.items[0],fromRouter);
}
/* ---- 独立路由（hash：#/z4/muniu；刷新/前进后退保持当前展品） ---- */
function parseHash(){
  const m=(location.hash||'').match(/^#\/(z[1-5])(?:\/([\w-]+))?/);
  if(!m)return null;
  return {zone:m[1],item:m[2]||null};
}
function routeFromHash(){
  const r=parseHash();
  if(!r){loadZone('z1');return;}
  const zone=ZONES.find(z=>z.id===r.zone);
  if(!zone){loadZone('z1');return;}
  if(r.item && !zone.items.some(i=>i[0]===r.item)){ // 非法展品：回退该展区首项
    loadZone(r.zone);return;
  }
  loadZone(r.zone,r.item||undefined);
}
function syncHash(zoneId,itemId){
  const h=`#/${zoneId}/${itemId}`;
  if(location.hash===h)return;
  location.hash=h; // 触发 hashchange → routeFromHash 统一加载
}

  let model;

  catch(e){ console.error(e); toast('模型构建失败：'+e.message,'err'); return; }
  if(model&&model.isObject3D){
    if(opts.centerY)model.position.y=opts.centerY;

    if(noIntro)model.userData.noIntro=true;

    if(model.userData.explodeScale)viewer.model.userData.explodeScale=model.userData.explodeScale;
    viewer.customUpdate=model.userData.update||null;
    viewer.customDestroy=model.userData.destroy||null;
    if(opts.wall)viewer.addCollapseWall();
    if(opts.onLoad)opts.onLoad(model);
    viewer.autoRotate = opts.autoRotate!==false;
    if(!model.userData.noIntro){
      /* 进入即以拆解状态呈现，随后播放 拆解→拼装 合拢动画；合拢后切到展品专用视角 */
      viewer.setExplode(1,true);
      setTimeout(()=>{
        if(viewer.model===model&&!model.userData.noIntro)viewer.playIntro();
        if(opts.postIntroCam)setTimeout(()=>{
          if(viewer.model===model)opts.postIntroCam(model);

  }

/* 弓形栱（两端翘起 + 斗座） */
function gongPiece(len, depth, mat, label, stress=.55){
  const sh=new THREE.Shape();
  sh.moveTo(-len/2,0); sh.quadraticCurveTo(0,depth*.55,len/2,0);
  sh.lineTo(len/2,-depth*.28); sh.quadraticCurveTo(0,-depth*.1,-len/2,-depth*.28); sh.closePath();
  const geo=new THREE.ExtrudeGeometry(sh,{depth:depth*.8,bevelEnabled:true,bevelSize:.02,bevelThickness:.02,bevelSegments:1});
  geo.translate(0,0,-depth*.4);
  const m=new THREE.Mesh(geo,mat); m.castShadow=m.receiveShadow=true;
  return tagPiece(m,label,stress,[0,.5,0]);
}
/* 斗（底承座）：上大下小梯形块 */
function douPiece(sz,mat,label='斗',stress=.6){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(sz*.62,sz*.42,sz*.55,4),mat);
  m.rotation.y=Math.PI/4; m.castShadow=m.receiveShadow=true;

}

function angPiece(len,mat,label='昂'){

  const b=simplePiece(len,.14,.22,mat,[len*.18,0,0],.02); grp.add(b);

  tip.rotation.z=-Math.PI/2; tip.position.set(len*.5+.18,0,0); tip.castShadow=true; grp.add(tip);

/* 斗栱铺作层：layers 控制出跳层数；各层斗、栱、昂、枋逐件接触叠压，拼合后无悬空缝隙 */
function buildDougong(layers=3){
  const g=G();
  const GH=.26;                       // 栱/昂高度
  // 立柱：柱头直达栌斗底面
  const colTop=1.34;
  const col=simplePiece(.55,colTop,.55,M.b,[0,colTop/2,0],.03);
  g.add(tagPiece(col,'立柱（栌斗下）',.45,[0,-.3,0]));
  // 栌斗（大斗）：底面落于柱头
  let topY=colTop;
  const ludou=douPiece(.7,M.c,'栌斗（大斗）',.7);
  const LDY=.7*.55;
  ludou.position.set(0,topY+LDY/2,0); g.add(ludou);
  topY+=LDY;
  for(let L=0;L<layers;L++){
    const span=1.0+L*.62;
    const gy=topY+GH/2;               // 栱中心线：底沿正好压在下层斗顶面
    // 横栱（泥道栱 / 横华栱）
    const gx=gongPiece(span,.3,M.a,L===0?'泥道栱（横向弓形木）':(L===layers-1?'最上层横栱':''));
    gx.scale.y=GH/.3; gx.position.set(0,gy,0); g.add(gx);
    const gz=gongPiece(span*.9,.3,woodMat('huali',.92),L===0?'华栱（纵向出跳）':(L===layers-1?'最上层纵栱':''));
    gz.scale.y=GH/.3; gz.rotation.y=Math.PI/2; gz.position.set(0,gy,0); g.add(gz);
    if(L>=1){
      const out=(span/2)*.92;
      [1,-1].forEach(s=>{
        const ang=simplePiece(span*.5,GH*.8,.2,woodMat('nanmu',.95),[s*out*.5,gy,s*.02],.02);
        g.add(tagPiece(ang,L===1&&s>0?'昂（斜向挑梁）':'',.7,[s*.2,.3,0]));
      });
    }
    topY=gy+GH/2;
    const sDou=.3, sDY=sDou*.55;
    [-span/2,span/2].forEach(x=>{
      const s=douPiece(sDou,M.c,L===layers-1?'升（两端托垫）':'',.6);
      s.position.set(x,topY+sDY/2,0); g.add(s);
    });
    [-span*.42,span*.42].forEach(z=>{
      const s=douPiece(sDou*.92,woodMat('zitan',1.05),'',.6);
      s.position.set(0,topY+sDY/2,z); g.add(s);
    });
    topY+=sDY;
  }
  // 挑檐枋：底面直接压在最上层散斗/交互斗顶面
  const beam=simplePiece(2.4+layers*.62,.3,.5,M.b,[0,topY+.15,0],.02);
  g.add(tagPiece(beam,'挑檐枋（屋面荷载）',.6,[0,.5,0]));
  g.userData.explodeScale=1.15;
  return g;
}

/* 藻井 */
function buildCaisson(){
  const g=G();
  const sqMat=woodMat('zitan',1.05);
  const square=new THREE.Group();
  const s=4.4;
  [[0,-s/2],[0,s/2],[-s/2,0],[s/2,0]].forEach(([x,z],i)=>{
    const b=simplePiece(i<2?s:.34,.28,i<2?.34:s,M.b,[x,0,z],.02);
    square.add(tagPiece(b,'下层方井（四方）',.5,[x*.2,-.3,z*.2]));
  });
  square.position.y=0; g.add(square);
  const oct=new THREE.Group();
  const R=2.7;
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    const b=simplePiece(1.55,.24,.26,woodMat('nanmu',.95),[Math.sin(a)*R,-.85,Math.cos(a)*R],.02);
    b.rotation.y=a; oct.add(tagPiece(b,'八角井（八方过渡）',.55,[Math.sin(a)*.3,-.3,Math.cos(a)*.3]));
  }
  g.add(oct);
  const circ=new THREE.Mesh(new THREE.TorusGeometry(1.7,.14,10,40),M.c);
  circ.rotation.x=Math.PI/2; circ.position.y=-1.7; circ.castShadow=true;
  g.add(tagPiece(circ,'圆井（天圆）',.6,[0,-.5,0]));
  // 蜂巢微缩斗栱
  for(let ring_i=0;ring_i<3;ring_i++){
    const n=16-ring_i*3; const rr=2.35-ring_i*.62; const yy=-.55-ring_i*.55;
    for(let i=0;i<n;i++){
      const a=i/n*Math.PI*2;
      const d=douPiece(.16,woodMat('huali',.9+ring_i*.05),ring_i===2?'向心斗栱':'微缩斗栱',.6);
      d.position.set(Math.sin(a)*rr,yy,Math.cos(a)*rr); d.userData.dir=[Math.sin(a)*.5,-.4,Math.cos(a)*.5];
      g.add(d);
    }
  }
  // 龙首
  const dragon=new THREE.Group();
  const head=simplePiece(.5,.35,.4,MAT.bronzeDark,[0,0,0],.08); dragon.add(head);
  const snout=simplePiece(.35,.2,.25,MAT.bronze,[.32,-.05,0],.06); dragon.add(snout);
  for(let i=0;i<2;i++){const h=new THREE.Mesh(new THREE.ConeGeometry(.03,.3,6),MAT.bronze);
    h.position.set(-.05+i*.12,.28,0);h.castShadow=true;dragon.add(h);}
  dragon.position.y=-2.6; g.add(tagPiece(dragon,'悬空龙首（向心挤压承重）',.7,[0,-.6,0]));
  g.userData.explodeScale=1.5;
  g.userData.update=(dt)=>{g.rotation.y+=dt*.08;};
  return g;
}

const ROOF_MAT=shareMaterial(new THREE.MeshStandardMaterial({color:0x3b352e,metalness:.08,roughness:.82}));
function hipRoof(w, y, thick, label){
  const roof=new THREE.Group();
  const half=w, top=w*.42, rise=thick;
  const geo=new THREE.CylinderGeometry(top*Math.SQRT2, half*Math.SQRT2, rise, 4, 1);
  const r=new THREE.Mesh(geo,ROOF_MAT);r.rotation.y=Math.PI/4;
  r.position.y=rise/2;r.castShadow=r.receiveShadow=true;
  if(label)tagPiece(r,label,.5,[0,.5,0]); roof.add(r);
  /* 檐口加厚枋 */
  const eave=simplePiece(half*2+.3,.12,half*2+.3,woodMat('zitan',1.02),[0,-.02,0],.04);
  roof.add(eave);
  /* 四角飞檐翘角 */
  [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([sx,sz])=>{
    const tip=new THREE.Mesh(new THREE.ConeGeometry(.1,.42,6),ROOF_MAT);
    tip.position.set(sx*half*.98,.08,sz*half*.98);
    tip.rotation.z=-sx*.7;tip.rotation.x=sz*.7;
    tip.castShadow=true;roof.add(tip);
  });
  roof.position.y=y;
  return roof;
}
function buildPagoda(){

  g.add(tagPiece(base1,'双层台基（夯土包砖）',.4,[0,.2,0]));
  const base2=new THREE.Mesh(new THREE.CylinderGeometry(3.0,3.2,.4,8),woodMat('zitan',1.0));
  base2.position.y=.7;base2.rotation.y=Math.PI/8;base2.castShadow=true;g.add(base2);
  for(let L=0;L<levels;L++){
    const w=4.6-L*.52, y=.95+L*floorH;
    const colN=8; // 八角每面柱
    /* 平座（外挑回廊底板） */
    const plat=new THREE.Mesh(new THREE.CylinderGeometry(w*.62,w*.72,.18,8),woodMat('zitan',.98));
    plat.rotation.y=Math.PI/8;plat.position.y=y-.12;plat.castShadow=plat.receiveShadow=true;
    g.add(tagPiece(plat,L===0?'平座（外挑回廊）':'',.5,[0,.3,0]));
    /* 回廊栏杆 */

/* 木质齿轮：teeth 齿，r 节圆半径 */
function gear(r, teeth, thick, mat, label){
  const g=new THREE.Group();
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.92,thick,teeth),mat);
  wheel.rotation.x=Math.PI/2; wheel.castShadow=wheel.receiveShadow=true; g.add(wheel);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(r*.18,r*.18,thick*1.3,10),MAT.bronzeDark);
  hub.rotation.x=Math.PI/2; hub.castShadow=true; g.add(hub);
  for(let i=0;i<teeth;i++){
    const a=i/teeth*Math.PI*2;
    const t=simplePiece(r*.16,thick*1.15,r*.22,mat,
      [Math.cos(a)*(r+thick*.12),0,Math.sin(a)*(r+thick*.12)],.01);
    t.rotation.y=-a+Math.PI/2; g.add(t);
  }
  if(label) tagPiece(g,label,.7);
  return g;
}
function wheelMesh(r,thick,mat,label){

  // 报时木阁（木偶）
  for(let i=0;i<5;i++){

  }

  const sphere=new THREE.Mesh(new THREE.SphereGeometry(.45,20,14),

  sphere.position.set(0,3.5,0);sphere.castShadow=true;
  g.add(tagPiece(sphere,'浑象（天体运行演示）',.5,[0,.6,0]));
  const ringA=new THREE.Mesh(new THREE.TorusGeometry(.55,.02,6,32),MAT.bronze);ringA.position.copy(sphere.position);g.add(ringA);
  const ringB=ringA.clone();ringB.rotation.x=Math.PI/2.4;g.add(ringB);
  // 水流
  const water=new THREE.Mesh(new THREE.BoxGeometry(.08,1.2,.08),

  const setRod=(m,a,b)=>{tmpA.copy(a);tmpB.copy(b);const v=new THREE.Vector3().subVectors(tmpB,tmpA);

  [[.5,1],[-.55,-1]].forEach(([cx,frontSign])=>{

  let t=0,walking=false,locked=false,lidOpen=false,walkT=0,boltX=.72,lidA=0,tongueA=0,rumpPulse=0,rumpShake=0;
  const ease=(cur,target,k,dt)=>cur+(target-cur)*(1-Math.pow(1-k,dt*60));
  const TAU=Math.PI*2;
  const gaitPose=p=>{
    const u=((p%TAU)+TAU)%TAU/TAU;
    let hip,knee,lift,v;
    if(u<.65){

  };
  const toggleLock=()=>{
    locked=!locked;
    if(locked){walking=false;SFX.reject();toast('咔哒！牛舌转动，锁舌销咬死曲柄，木牛锁死','ok');}
    else{SFX.place();toast('牛舌旋回原位，锁已开——再拍屁股即可行走','ok');}
    return locked;
  };
  const toggleLid=()=>{lidOpen=!lidOpen;SFX.pick();return lidOpen;};

  g.userData.update=(dt)=>{
    t+=dt*viewer.speed;
    if(viewer.explode>.05)return;
    let ang=0;
    if(walking&&!locked){
      walkT+=dt;if(walkT>6)walking=false;
      const w=t*3.4;ang=w;
      g.position.y=.012+Math.abs(Math.sin(w*2))*.024;
      g.rotation.z=Math.sin(w*2)*.012;
      headG.rotation.z=Math.sin(w)*.09;
      tailG.rotation.z=Math.sin(w*.8)*.18;
      rumpRing.scale.setScalar(1+Math.sin(t*6)*.06);
    }else{
      g.position.y=ease(g.position.y,0,.2,dt);
      g.rotation.z=ease(g.rotation.z,0,.15,dt);
      headG.rotation.z=ease(headG.rotation.z,0,.15,dt);
      tailG.rotation.z=ease(tailG.rotation.z,0,.15,dt);
      rumpRing.scale.setScalar(1);
    }
    /* 曲柄转角：行走时转动，停/锁时回正 */
    cranks.forEach(c=>{c.disc.rotation.z=ease(c.disc.rotation.z,walking?ang+c.phase:0,.25,dt);});
    /* 四足：对角腿同相（右前+左后、左前+右后），前膝与后跗关节反向弯曲 */
    legs.forEach(L=>{
      if(walking){
        const pose=gaitPose(ang+L.phase);
        L.hip.rotation.z=ease(L.hip.rotation.z,pose.hip,.45,dt);
        L.hip.position.y=L.baseY+pose.lift*.14;
        L.knee.rotation.z=ease(L.knee.rotation.z,pose.knee*(L.isFront?-.9:.9),.45,dt);
      }else{
        L.hip.rotation.z=ease(L.hip.rotation.z,0,.2,dt);
        L.hip.position.y=ease(L.hip.position.y,L.baseY,.2,dt);
        L.knee.rotation.z=ease(L.knee.rotation.z,0,.2,dt);
      }
    });
    rods.forEach(r=>{r.pin.getWorldPosition(tmpA);r.lever.getWorldPosition(tmpB);setRod(r.rod,tmpA,tmpB);});
    /* 牛舌 / 锁舌销 / 后盖联动 */
    tongueA=ease(tongueA,locked?-1.05:0,.18,dt);tongueG.rotation.z=tongueA;
    boltX=ease(boltX,locked?.36:.72,.18,dt);bolt.position.x=boltX;
    lidA=ease(lidA,lidOpen?1.32:0,.16,dt);lidG.rotation.z=lidA;
    if(rumpPulse>0){rumpPulse-=dt*1.8;rumpPad.scale.setScalar(1+Math.max(0,rumpPulse)*.35);}
    else rumpPad.scale.setScalar(1);
    if(rumpShake>0){rumpShake-=dt*2.4;rumpPad.position.z=Math.sin(t*40)*.05*Math.max(0,rumpShake);}
    else rumpPad.position.z=0;
  };
  g.userData.patRump=patRump;
  g.userData.toggleLock=toggleLock;
  g.userData.toggleLid=toggleLid;

  /* 3D 点选牛臀（点击，不影响轨道拖拽） */
  const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
  let downXY=null;
  const toNDC=ev=>{const r=renderer.domElement.getBoundingClientRect();
    mv.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);};
  const onDown=ev=>{downXY=[ev.clientX,ev.clientY];};
  const onUp=ev=>{
    if(!downXY)return;const moved=Math.hypot(ev.clientX-downXY[0],ev.clientY-downXY[1]);downXY=null;
    if(moved>7)return;
    toNDC(ev);ray.setFromCamera(mv,camera);
    if(ray.intersectObject(rumpPad,false).length){patRump();return;}
    if(ray.intersectObject(lidBtn,true).length){
      const open=toggleLid();
      const btn=$('#mn-lid');if(btn)btn.textContent=open?'合上后盖':'打开后盖：查看空腔粮草';
    }
  };
  renderer.domElement.addEventListener('pointerdown',onDown);
  renderer.domElement.addEventListener('pointerup',onUp);
  g.userData.destroy=()=>{
    renderer.domElement.removeEventListener('pointerdown',onDown);
    renderer.domElement.removeEventListener('pointerup',onUp);
  };

  g.userData.explodeScale=1.05;
  g.scale.setScalar(1.08);
  return g;
}

/* ---- 诸葛连弩（按实物重构：卧式弓 + 箭匣 + X形拉杆 + 曲形托，前向射击） ---- */
function buildLiannu(){
  const g=G();
  const wood=woodMat('huali',1.05), dark=woodMat('zitan',1.05), bamboo=woodMat('zhu',1.06);
  const STRING_COL=0x2a241c;
  /* 弩身主梁（弦槽长木） */
  const beam=mergedPiece([
    {size:[3.0,.22,.3],pos:[-.1,.85,0]},
    {size:[.5,.34,.42],pos:[-1.55,.85,0],r:.03},   /* 前端弓托木块 */
  ],wood);
  tagPiece(beam,'弩身主梁（弦槽长木）',.5);
  beam.userData.labelOff=[-.3,-.35,0];g.add(beam);
  /* 槽内弦轨暗线 */
  const rail=simplePiece(2.4,.03,.05,dark,[-.1,.98,0],.01);
  g.add(rail);
  /* 复合弓：水平横装于前端 x=-1.8，弓面在 XZ 平面，向 -x 外凸，沿 z 张开 */
  const bowPts=[];
  for(let i=0;i<=20;i++){
    const a=Math.PI*(i/20);
    bowPts.push(new THREE.Vector3(-1.8-Math.sin(a)*.34,.85,Math.cos(a)*.95));
  }
  const bowUp=tube(bowPts,.05,dark,24);
  const bowDn=tube(bowPts.map(p=>p.clone().setZ(-p.z)),.05,dark,24);
  tagPiece(bowUp,'复合弓臂（筋角木三层缠绳）',.8);
  bowUp.userData.labelOff=[0,.25,.5];g.add(bowUp);
  g.add(bowDn);
  /* 弓梢挂弦头 + 缠绳箍（环面垂直于弓臂切线） */
  const ropeMat=new THREE.MeshStandardMaterial({color:0x6b5132,roughness:.9});
  [.95,-.95].forEach(z=>{
    const tip=new THREE.Mesh(new THREE.SphereGeometry(.075,12,10),dark);
    tip.position.set(-2.14,.85,z);tip.castShadow=true;g.add(tip);
    for(let k=0;k<3;k++){
      const a=z>0?(0.12+k*.28):(Math.PI-.12-k*.28);
      const px=-1.8-Math.sin(a)*.34, pz=Math.cos(a)*.95;
      const tg=new THREE.Vector3(-Math.cos(a)*.34,0,-Math.sin(a)*.95).normalize();

      band.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),tg);

  /* 弩弦（V 形双线，汇于弦扣），x 越小越靠前 */
  const strMat=new THREE.LineBasicMaterial({color:STRING_COL});
  const strA=new THREE.Line(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-2.14,.85,.95),new THREE.Vector3(-.6,.86,0)]),strMat);
  const strB=new THREE.Line(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-2.14,.85,-.95),new THREE.Vector3(-.6,.86,0)]),strMat);
  g.add(strA,strB);
  const nock=simplePiece(.12,.1,.12,dark,[-.6,.86,0],.02);
  g.add(tagPiece(nock,'弦扣（牙钩住）',.8));
  /* 箭匣：竖置木匣，下半实体、上半开盖式透明，内部叠装短矢 */
  const magG=new THREE.Group();magG.position.set(.1,1.18,0);
  const magLower=simplePiece(.72,.22,.34,wood,[0,0,0],.03);
  magG.add(tagPiece(magLower,'箭匣匣体（重力落矢）',.7));
  const magMat=new THREE.MeshStandardMaterial({color:0x8a5a32,roughness:.6,
    transparent:true,opacity:.42});
  const magBack=simplePiece(.72,.5,.04,magMat,[0,.36,-.16],.02);
  const magSide1=simplePiece(.04,.5,.34,magMat,[-.36,.36,0],.02);
  const magSide2=simplePiece(.04,.5,.34,magMat,[.36,.36,0],.02);
  magG.add(tagPiece(magBack,'透明匣盖（可见叠矢）',.6),magSide1,magSide2);
  /* 匣内叠装短矢：竖向堆叠，矢尖朝下对准弦槽（容量 10 支，初始满匣） */
  const stackBolts=[];
  for(let i=0;i<10;i++){
    const b=magBolt();
    b.position.set(0,.06+i*.052,0);
    magG.add(b);stackBolts.push(b);
  }
  g.add(magG);
  function magBolt(){
    const gr=new THREE.Group();
    const shaft=new THREE.Mesh(cyl(.016,.016,.2,8),bamboo);
    shaft.castShadow=true;gr.add(shaft);
    const head=new THREE.Mesh(new THREE.ConeGeometry(.03,.07,10),MAT.iron);

  }
  /* 机槽待发箭（槽上一支） */
  function trackBolt(){
    const gr=new THREE.Group();
    const shaft=simplePiece(.85,.03,.03,bamboo,[0,0,0],.006);
    gr.add(tagPiece(shaft,'待发短矢',.5));
    const head=new THREE.Mesh(new THREE.ConeGeometry(.035,.12,12),MAT.iron);
    head.rotation.z=Math.PI/2;head.position.x=-.48;head.castShadow=true;gr.add(head);
    const fletch=simplePiece(.1,.05,.02,MAT.string,[.42,0,0],.005);gr.add(fletch);

  let loadedBolt=trackBolt();loadedBolt.visible=false;g.add(loadedBolt);
  let flying=[];

  const leverG=new THREE.Group();leverG.position.set(-.55,1.12,0);
  const armA=mergedPiece([
    {size:[2.05,.1,.1],pos:[.85,.32,.06],rot:[0,0,-.32]},
  ],wood);
  const armB=mergedPiece([
    {size:[2.05,.1,.1],pos:[.85,.32,-.06],rot:[0,0,-.32]},
  ],wood);
  leverG.add(tagPiece(armA,'X形压弦拉杆（一推一拉）',.8),armB);
  /* 枢轴铆钉 */
  const pin=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.3,12),MAT.iron);

  leverG.add(tagPiece(handle,'T形推柄',.7));
  g.add(leverG);
  /* 曲形后托（上翘钩状） */
  const stock=tube([
    new THREE.Vector3(1.35,.85,0),new THREE.Vector3(1.75,.92,0),
    new THREE.Vector3(2.05,1.02,0),new THREE.Vector3(2.35,1.08,0),
    new THREE.Vector3(2.45,1.0,.05)],.075,dark,20);
  tagPiece(stock,'曲形抵肩托',.5);stock.userData.labelOff=[.45,.25,0];g.add(stock);
  /* 悬刀扳机（机匣下方） */
  const xuan=new THREE.Group();xuan.position.set(.45,.74,0);
  const trig=simplePiece(.08,.3,.08,MAT.bronzeDark,[0,-.12,0],.01);trig.rotation.x=.4;
  xuan.add(tagPiece(trig,'悬刀扳机',.8));g.add(xuan);
  /* 补矢架：弩身后侧底部的架座 + 平放 10 支备用短矢（金属簇朝向前 -x）；
     箭尽点击后，架上的箭矢逐支飞入箭匣，架上随之减少；装填完毕后架上恢复满 10 支展示 */
  const spareG=new THREE.Group();
  spareG.add(simplePiece(.2,.1,1.05,wood,[1.4,.42,-.18],.02));
  const spareBolts=[];
  for(let i=0;i<10;i++){
    const gr=new THREE.Group();
    const sh=new THREE.Mesh(cyl(.013,.013,.82,8),bamboo);
    sh.rotation.z=Math.PI/2;sh.castShadow=true;gr.add(sh);
    const hd=new THREE.Mesh(new THREE.ConeGeometry(.03,.11,10),MAT.iron);
    hd.rotation.z=Math.PI/2;hd.position.x=-.46;hd.castShadow=true;gr.add(hd);
    const fl=simplePiece(.09,.04,.015,MAT.string,[.38,0,0],.004);gr.add(fl);
    gr.position.set(1.4,.52+(i%2)*.05,-.38+Math.floor(i/2)*.075);
    spareG.add(gr); spareBolts.push(gr);
  }
  g.add(tagPiece(spareG,'补矢架（箭尽点击，自动装填10支）',.4));
  /* 缺矢提示标签：挂在补矢架旁，仅在箭尽时显示，点击补矢架即装填后消失 */
  const refillDiv=document.createElement('div');

  refillDiv.style.color='#f0b07a';refillDiv.style.borderColor='rgba(224,138,90,.8)';
  refillDiv.style.fontSize='13px';refillDiv.style.padding='3px 10px';
  const refillLabel=new CSS2DObject(refillDiv);
  refillLabel.position.set(1.4,1.0,-.95);refillLabel.visible=false;
  g.add(refillLabel);

  const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
  function setString(x){
    strA.geometry.setFromPoints([new THREE.Vector3(-2.14,.85,.95),new THREE.Vector3(x,.86,0)]);

  let ammo=10;                 // 当前匣内可射短矢数（容量10）

  const refillFlights=[];      // 正在从补矢架飞向箭匣的箭矢动画
  const _v={from:new THREE.Vector3()};
  stackBolts.forEach((b,i)=>b.visible=true);

  function fire(){
    if(refilling||kickT!==null)return;   // 回弹/装填期间锁定

  function launchSpareBolt(index){

    gr.getWorldPosition(_v.from);
    g.attach(gr);                    // 移入根组，保持世界位姿（底部该支随即从架上消失）
    const anim={gr, slot:index, t:0, dur:.55,
      from:_v.from.clone(),
      to:new THREE.Vector3(.1,1.24+index*.052,0),
      rotFrom:gr.quaternion.clone(),
      rotTo:new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),Math.PI/2)};
    refillFlights.push(anim);
  }
  function startRefill(){
    if(refilling||ammo>0)return;

  }

  /* 3D 点击交互：点 T 形推柄/拉杆击发；缺矢后点补矢架装填 */
  const raycaster=new THREE.Raycaster();
  function raycast(ev){
    const r=renderer.domElement.getBoundingClientRect();
    const ndc=new THREE.Vector2(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);
    raycaster.setFromCamera(ndc,camera);
    return raycaster;
  }
  const onDown=(ev)=>{
    if(viewer.model!==g)return;
    const hits=raycast(ev).intersectObjects([leverG,spareG],true);
    if(!hits.length)return;
    let o=hits[0].object;
    if(o===spareG||o.parent===spareG||o.parent?.parent===spareG){
      if(ammo<=0)startRefill(); else toast('箭匣尚有余矢（'+ammo+' 支），继续点击 T 形推柄发射','ok',1600);
      return;
    }
    fire();
  };
  renderer.domElement.addEventListener('pointerdown',onDown);

  g.userData.update=(dt,tAbs)=>{
    /* 击发回弹动画：推柄先后拉 0.12s 再回位，弦由拉满位(.45)快速回弹至前位(-2.0)再静息(-.6) */
    if(kickT!==null){
      kickT+=dt;
      if(kickT<.12){ const k=ease(kickT/.12);
        leverG.rotation.z=THREE.MathUtils.lerp(0,-.32,k);
        setString(THREE.MathUtils.lerp(-.6,.45,k));
      }else if(kickT<.26){ const k=ease((kickT-.12)/.14);
        leverG.rotation.z=THREE.MathUtils.lerp(-.32,0,k);
        setString(THREE.MathUtils.lerp(.45,-2.0,Math.min(1,k*1.4)));
      }else{ setString(-.6);leverG.rotation.z=0;kickT=null; }
    }
    /* 补矢装填动画：备用矢自补矢架逐支起飞入匣（架上随之减少），全部到位后架上还原满 10 支 */
    if(refilling){
      refillT+=dt;
      while(refillNext<10&&refillT>=refillNext*.1){
        launchSpareBolt(refillNext); refillNext++;
      }
      for(let i=refillFlights.length-1;i>=0;i--){
        const a=refillFlights[i]; a.t+=dt;
        const k=ease(Math.min(1,a.t/a.dur));
        a.gr.position.lerpVectors(a.from,a.to,k);
        a.gr.position.y+=Math.sin(k*Math.PI)*.18;   // 抛物线起弧
        a.gr.quaternion.slerpQuaternions(a.rotFrom,a.rotTo,k); // 水平束矢姿态 → 匣内竖直
        if(k>=1){
          a.gr.visible=false;                       // 入匣：隐藏飞行矢，显示该层匣内矢
          stackBolts[a.slot].visible=true; SFX.pick();
          g.remove(a.gr);
          refillFlights.splice(i,1);
        }
      }

/* ---- 鲁班锁（六根，标准 6 单位方木条，拼装后严丝合缝） ---- */
/* 木条沿自身长轴 = 3 个单位方块：-1、0、+1。cut 集表示在中央单位挖去的横截面象限
   (象限以截面两轴的 ± 标记)。不挖则保留，构成 1×1×1 的实心榫/缺口。 */
const LOCK_S=.26;
function lockBar(kind, mat){
  const S=LOCK_S, L=S*3;
  // 每个 kind 给出三段（左 L / 中 M / 右 R）保留的截面方块，象限用 [横,竖] 符号
  // 截面：u=垂直于长轴的水平方向，v=竖直方向；每段占 {[+1,+1],[+1,-1],[-1,+1],[-1,-1]} 中若干
  const Q=[[1,1],[1,-1],[-1,1],[-1,-1]];
  const ALL=Q, NONE=[];
  let mid;
  if(kind==='A')mid=ALL;                   // 中央完整（整根实条）
  else if(kind==='B')mid=[[-1,-1],[-1,1]]; // 中央仅留一侧（u=-1 两块）
  else if(kind==='C')mid=[[-1,-1]];        // 仅留对角一块
  else if(kind==='D')mid=[[1,-1]];         // 仅留对角一块（另一侧）
  else mid=NONE;                           // key：中央整段挖空，仅两端实块
  const seg=(cells,x)=>(cells||ALL).map(([u,v])=>({size:[S,S,S],pos:[x,v*S/2,u*S/2]}));
  const parts=[...seg(ALL,-S),...seg(mid,0),...seg(ALL,S)];
  return mergedPiece(parts,mat);
}
/* 装配目标：三对方木条分别占据 ±S 格线，中心在原点；键值 kind 决定中央缺口朝向，

 {id:'p2',kind:'B',axis:'y',home:new THREE.Vector3(-LOCK_S,LOCK_AY,-LOCK_S),label:'立木条·乙',mat:'nanmu'},
 {id:'p4',kind:'B',axis:'z',home:new THREE.Vector3(-LOCK_S,LOCK_AY-LOCK_S,0),label:'纵木条·丁',mat:'zitan'},
 {id:'p3',kind:'D',axis:'y',home:new THREE.Vector3(LOCK_S,LOCK_AY,LOCK_S),label:'立木条·丙',mat:'nanmu'},
 {id:'p5',kind:'A',axis:'z',home:new THREE.Vector3(LOCK_S,LOCK_AY+LOCK_S,0),label:'纵木条·戊',mat:'zitan'},
 {id:'p6',kind:'key',axis:'x',home:new THREE.Vector3(0,LOCK_AY+LOCK_S,LOCK_S),label:'钥匙柱（唯一完整滑道）',mat:'zhu'},

const LOCK_ORDER=[

 {id:'p2',tip:'立木条乙靠甲就位，缺口彼此避让'},

function buildLuban(){
  const g=G(); g.name='luban';
  g.userData.pieces={};
  LOCK_DEFS.forEach((d,i)=>{
    const bar=lockBar(d.kind, woodMat(d.mat, d.kind==='key'?1.15:1));
    if(d.axis==='x')bar.rotation.z=0;
    if(d.axis==='y')bar.rotation.z=Math.PI/2;

function startLubanGame(g){

  const progressEl=()=>document.getElementById('lb-progress');

  const ray=new THREE.Raycaster();const v2=new THREE.Vector2();

    const r=renderer.domElement.getBoundingClientRect();

    g.userData.locked=true; SFX.win();

      <div class="seal w-14 h-14 mx-auto flex items-center justify-center text-2xl font-bold">匠</div>
      <div class="font-kai text-2xl text-gold2 mt-4 tracking-[.3em]">大 巧 不 工</div>
      <p class="text-sm text-[#cdbf9f] mt-3 leading-7">六根木条正交咬合，唯钥匙柱可解锁全局。<br>你已掌握“先榫后卯、错位入扣”的骨骼避让逻辑。</p>
      <div class="flex gap-3 justify-center mt-5">
        <button id="lb-close" class="ctrl-btn rounded-full px-6 py-2 text-sm tracking-widest">关闭查看</button>
        <button id="lb-again" class="ctrl-btn rounded-full px-6 py-2 text-sm tracking-widest">再拼一次</button>
      </div>

    ov.classList.remove('hidden');

    $('#lb-close').onclick=()=>{ov.classList.add('hidden');ov.innerHTML='';};
  }
  function restart(){

    updateUI();setHint('从右侧托盘拖起第一根木条，嵌入中央框架。');

/* ---- 九连环 3D 场景 ---- */
function buildNineRings3D(){
  const g=G();
  const bronze=MAT.bronze, wood=woodMat('zitan',1.05);

  /* 九个圆环，通过细立柱穿接在一排底座横木上 */
  const rings=[];

  g.add(tagPiece(baseRail,'穿环立柱底座',.5,[0,.2,0]));
  for(let i=0;i<9;i++){

    const post=simplePiece(.05,.5,.05,wood,[x,.82,0],.01);
    g.add(tagPiece(post,i===0?'铜木立柱（穿接各环）':'',.5,[0,.2,0]));
    /* 圆环：竖直面（YZ 平面），环面朝向 x */
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.21,.035,10,28),bronze);
    ring.position.set(x,1.35,0);ring.rotation.y=Math.PI/2;
    ring.castShadow=true;
    g.add(tagPiece(ring,`第${9-i}环`,.7,[0,.5,0]));
    /* 环顶连杆到长柄（可活动的穿接关系，用小横杆表示） */
    const link=simplePiece(.04,.12,.04,bronze,[x,1.14,0],.01);
    g.add(link);
    rings.push(ring);
  }
  /* 支架（展示架） */
  [1,-1].forEach(s=>{
    const stand=simplePiece(.12,1.1,.12,wood,[1.85*s,.55,0],.02);
    g.add(tagPiece(stand,s>0?'展示支架':'',.4,[s*.3,0,0]));
  });

/* ---- 九连环 ---- */
/* 生成标准最优解（341 步）。规则：环 n 可动当且仅当环 n-1 在架且其前全部解下。
   rem(n)=把前 n 环全解下；put(n)=把前 n 环全装上（起始前 n 环全解下）。 */
function solveNineRings(){
  const steps=[];
  const rem=n=>{
    if(n<=0)return;
    if(n===1){steps.push({n:1,on:false});return;}
    rem(n-2);
    steps.push({n,on:false});
    put(n-2);
    rem(n-1);
  };
  const put=n=>{
    if(n<=0)return;
    if(n===1){steps.push({n:1,on:true});return;}
    put(n-1);
    rem(n-2);
    steps.push({n,on:true});
    put(n-2);
  };
  rem(9);
  return steps;
}
function openJiuLianhuan(){

        规则：第 n 环可动，当且仅当第 n-1 环在架上、而前 n-2 环全部解下（第 1、2 环除外）。目标：九环全部解下。</p>
      <div class="flex gap-2 mt-3">

        <button id="jl-reset" class="ctrl-btn rounded px-4 py-1.5 text-xs">复位（全上）</button>
        <button id="jl-close" class="ctrl-btn rounded px-4 py-1.5 text-xs ml-auto">返回展馆</button>
      </div>
    </div>`;
    ov.classList.remove('hidden');
    ov.querySelectorAll('.ring').forEach(r=>r.onclick=()=>{
      const n=+r.dataset.n;

        $('#jl-msg').innerHTML=`<span class="text-[#d98a6a]">第 ${n} 环被锁住——需先让第 ${n-1} 环在架、前 ${n-2} 环全部解下。</span>`;
        toast('该环当前无法移动：递归约束未满足','err');return;
      }
      state[n-1]=state[n-1]?0:1;moves++;render();
      if(state.every(v=>v===0)){
        $('#jl-msg').innerHTML='<span class="text-jade">九环尽解！341 步的格雷码递归，正是二进制的古老化身。</span>';
        toast('九连环解开！','ok');
      }else{
        $('#jl-msg').textContent=(state[n-1]?'上':'下')+`第 ${n} 环。当前还剩 ${state.reduce((a,b)=>a+b,0)} 环。`;
      }
    });
    $('#jl-auto').onclick=()=>{
      const sol=solveNineRings();let i=0;state=new Array(9).fill(1);moves=0;render();
      $('#jl-msg').textContent='自动演示中：严格按递归合法顺序上下环，共 '+sol.length+' 步…';
      let acc=0,last=performance.now();
      const tick=(now)=>{
        if(!$('#jl-moves'))return;  // 浮层内容已被切换展品清空：终止演示，避免空引用报错
        acc+=now-last;last=now;
        while(acc>=20&&i<sol.length){
          acc-=20;
          const s=sol[i];state[s.n-1]=s.on?1:0;moves=i+1;
          $('#jl-moves').textContent=moves;
          ov.querySelectorAll('.ring').forEach((r,idx)=>{

            r.querySelector('circle:last-child').setAttribute('stroke',ok?'#ffe9b8':'none');
          });

        if(state.every(v=>v===0)){
          $('#jl-auto').disabled=false;
          $('#jl-msg').innerHTML='<span class="text-jade">演示完成：恰好 341 步，九环尽解。</span>';
          return;
        }
        $('#jl-auto').disabled=true;
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    };
    $('#jl-reset').onclick=()=>{state=new Array(9).fill(1);moves=0;render();};
    $('#jl-close').onclick=()=>{ov.classList.add('hidden');ov.innerHTML='';};
  };
  render();
}

/* ---- 微缩机关盒（可拆解看内部） ---- */
function buildBox(){
  const g=G();
  const W=2.2,H=1.4,D=1.6, t=.1;
  /* 底板 + 四块壁板（独立可拆，方便看内部暗销结构） */
  const bottom=simplePiece(W,t,D,woodMat('zitan',1.05),[0,t/2,0],.03);
  g.add(tagPiece(bottom,'底板（下滑开启）',.6,[0,-.4,0]));
  const wallF=simplePiece(W,H,t,woodMat('zitan',1.02),[0,H/2,D/2],.03);
  const wallB=simplePiece(W,H,t,woodMat('zitan',1.02),[0,H/2,-D/2],.03);
  const wallL=simplePiece(t,H,D,woodMat('zitan',1.02),[-W/2,H/2,0],.03);
  const wallR=simplePiece(t,H,D,woodMat('huali',1.05),[W/2,H/2,0],.03);
  g.add(tagPiece(wallF,'前壁板',.45,[0,.2,.4]),tagPiece(wallB,'后壁板',.45,[0,.2,-.4]),
    tagPiece(wallL,'左壁板（暗按舌）',.5,[-.4,.2,0]),tagPiece(wallR,'顺移侧板',.6,[.5,.1,0]));
  const panel=simplePiece(W-.1,t,D-.1,woodMat('huali',1.12),[0,H+t/2,0],.03);
  g.add(tagPiece(panel,'可抽顶板',.65,[0,.7,0]));
  /* 内部：藏宝暗屉 + 多道走马销 + 子母弹簧暗舌 */
  const drawerG=new THREE.Group();
  const drawer=simplePiece(.9,.34,1.1,woodMat('zhu',1.05),[0,.35,0],.03);
  drawer.userData.noExplode=true;
  drawerG.add(tagPiece(drawer,'藏宝暗屉',.8,[0,0,.7]));
  /* 屉内宝物（小金锭/卷轴） */
  const gem=new THREE.Mesh(new THREE.SphereGeometry(.12,14,12),MAT.bronze);
  gem.position.set(0,.55,0);gem.castShadow=true;gem.userData.noExplode=true;
  drawerG.add(tagPiece(gem,'屉中秘宝',.6));
  g.add(drawerG);
  /* 暗销：抽屉口的横向锁舌（弹簧） */
  const bolts=[];
  [1,-1].forEach(s=>{
    const bolt=simplePiece(.2,.12,.12,MAT.bronzeDark,[s*.55,.35,D/2-.12],.02);
    g.add(tagPiece(bolt,'子母弹簧暗舌',.85,[s*.3,.2,.3]));bolts.push(bolt);
  });
  /* 走马销（顶板下方的燕尾活销） */
  const zama=simplePiece(.4,.1,.16,woodMat('huali',1),[0,H-.05,D/2-.12],.02);
  g.add(tagPiece(zama,'走马销（推入即锁）',.8,[0,.5,.3]));
  /* 外部暗按舌（左壁三连按） */
  const btns=[];
  [1,2,3].forEach(i=>{
    const b=simplePiece(.1,.12,.16,MAT.bronzeDark,[-W/2-.02,H-.25-i*.22,D/2+.01],.03);
    g.add(tagPiece(b,`暗按舌 ${i}`,.8,[-.3,.3,.3]));btns.push(b);
  });
  /* 拆解时各板移开，露出内部 */
  g.userData.explodeScale=1.0;
  wallF.userData.dir=[0,.1,1];wallB.userData.dir=[0,.1,-1];
  wallL.userData.dir=[-1,.1,0];wallR.userData.dir=[1,.1,0];
  bottom.userData.dir=[0,-.5,0];panel.userData.dir=[0,1,0];
  drawerG.userData.dir&&0;
  g.userData.state={press:0,moved:false,bottom:false,open:false};
  g.userData.parts={panel,btns,side:wallR,drawer:drawerG,bottom,bolts,zama};
  /* 让暗屉也参与爆炸（Group 需标签） */
  tagPiece(drawerG,'暗屉总成',.7,[0,.2,.5]);
  return g;
}

/* ---- 鲁班神鸟（木鹊） ---- */
function buildMuque(){
  const g=G();
  const bamboo=woodMat('zhu',1.08),dark=woodMat('zitan',1);
  /* 鸟身：流线纺锤形（长轴沿 z，朝 +z 为前） */
  const body=new THREE.Mesh(new THREE.SphereGeometry(.3,18,14),bamboo);
  body.scale.set(.85,.85,1.9);body.position.set(0,1.5,0);body.castShadow=true;
  g.add(tagPiece(body,'竹篾鸟身（轻木胎）',.5,[0,.3,0]));
  /* 头颈上扬、喙尖 */
  const neck=new THREE.Group();neck.position.set(0,1.62,.4);
  const neckTube=tube([new THREE.Vector3(0,0,0),new THREE.Vector3(0,.18,.3)],.09,bamboo,12);
  neck.add(neckTube);
  g.add(tagPiece(neck,'曲颈（微缩销榫）',.5,[0,.3,.3]));
  const head=new THREE.Mesh(new THREE.SphereGeometry(.13,14,12),bamboo);
  head.position.set(0,1.83,.74);head.castShadow=true;g.add(head);
  const beak=new THREE.Mesh(new THREE.ConeGeometry(.05,.3,8),MAT.bronzeDark);
  beak.rotation.x=Math.PI/2;beak.position.set(0,1.8,.92);beak.castShadow=true;
  g.add(tagPiece(beak,'尖喙',.4,[0,.2,.4]));
  /* 尾羽（沿 -z 后掠分叉） */
  [0,1,2].forEach(i=>{
    const f=simplePiece(.1,.02,.62,bamboo,[(i-1)*.06,1.5,-.6],.005);
    f.rotation.y=(i-1)*.28;
    g.add(tagPiece(f,i===1?'后掠尾羽':'',.4,[-.2,.1,0]));
  });
  /* 翅膀：沿身体左右（±x）展开，翼肋从翼根呈扇形辐射；翼膜轻薄半透明 */
  function makeWing(side){
    const wg=new THREE.Group();wg.position.set(0,1.55,.05);
    const span=1.7,chord=.85,n=8;
    /* 翼膜：前缘宽、后缘略窄的扇形（自定义 ShapeGeometry），左镜像 */
    const sh=new THREE.Shape();
    sh.moveTo(0,0);
    sh.quadraticCurveTo(span*.5,chord*.55,span,chord*.18);
    sh.quadraticCurveTo(span*.6,-chord*.12,0,0);
    const mem=new THREE.Mesh(new THREE.ShapeGeometry(sh,12),
      new THREE.MeshStandardMaterial({color:0xe3d3a4,side:THREE.DoubleSide,
        transparent:true,opacity:.68,roughness:.95}));
    mem.rotation.x=Math.PI/2;
    if(side<0)mem.scale.x=-1;
    wg.add(mem);
    /* 前缘主羽杆（左右同在前缘 z+ 侧） */
    const lead=tube([new THREE.Vector3(0,0,0),
      new THREE.Vector3(side*span*.5,.04,chord*.32),
      new THREE.Vector3(side*span,.08,chord*.16)],.025,dark,12);
    /* 扇形翼肋（水平面内从根向外辐射，带后掠角） */
    for(let k=0;k<=n;k++){
      const a=k/n;
      const tx=side*span*(.25+a*.75);
      const tz=chord*(.42-a*.5);
      const rib=tube([new THREE.Vector3(0,0,0),
        new THREE.Vector3(tx*.5,.02,tz*.55),new THREE.Vector3(tx,.05,tz)],.012,bamboo,8);
      wg.add(tagPiece(rib,(k===0&&side>0)?'仿生翼肋（微缩销榫）':'',.45));
    }
    if(side>0)wg.add(tagPiece(lead,'前缘主梁（销榫穿接翼根）',.6));
    else wg.add(lead);
    return wg;
  }
  const wingR=makeWing(1),wingL=makeWing(-1);
  g.add(wingR,wingL);
  /* 翼根转轴 + 筋腱扭力弦 */
  [1,-1].forEach(s=>{
    const joint=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.2,10),MAT.string);
    joint.rotation.z=Math.PI/2;joint.position.set(s*.12,1.55,.05);joint.castShadow=true;
    g.add(tagPiece(joint,s>0?'翼根扭力轴（筋腱弦储能）':'',.85,[s*.3,0,0]));
  });
  /* 双腿（飞行时向后收起） */
  [.08,-.08].forEach(z=>{
    const leg=tube([new THREE.Vector3(0,1.32,-.2),new THREE.Vector3(0,1.2,-.55)],.025,dark,8);
    g.add(leg);
  });
  let t0=Math.random()*5;
  g.userData.update=(dt,t)=>{
    const tt=t+t0;
    const flap=Math.sin(tt*5)*.65;
    wingR.rotation.z=flap;wingL.rotation.z=-flap;     // 上下扑翼（绕身体前后轴 z）
    wingR.rotation.x=.06;wingL.rotation.x=-.06;
    g.position.y=-.18+Math.sin(tt*2.5)*.05;           // 原地小幅悬浮，避免飞出取景
    g.rotation.z=Math.sin(tt*2.5)*.04;
  };
  g.userData.explodeScale=1.0;
  g.userData.wings=[wingL,wingR];
  return g;
}
