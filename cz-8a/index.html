<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>长征八号甲 · 千帆极轨15组卫星发射 | Three.js 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #02030a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: #e8f1ff; -webkit-font-smoothing: antialiased;
  }
  #scene { position: fixed; inset: 0; display: block; }
  .panel {
    position: fixed;
    background: linear-gradient(135deg, rgba(8,16,34,0.72), rgba(4,8,20,0.55));
    border: 1px solid rgba(90,170,255,0.25);
    box-shadow: 0 0 24px rgba(40,120,255,0.12), inset 0 0 30px rgba(20,60,140,0.12);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 10px; color: #cfe2ff;
    text-shadow: 0 0 8px rgba(80,160,255,0.4); pointer-events: none;
  }
  #title-box { position: fixed; top: 18px; left: 18px; padding: 14px 18px; max-width: 46%; pointer-events: none; z-index: 10; }
  #title-box .sub { font-size: 12px; letter-spacing: 3px; color: #6fb0ff;
    text-transform: uppercase; margin-bottom: 4px; }
  #title-box h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; color: #fff; }
  #stage-box { position: fixed; top: 18px; right: 18px; padding: 14px 18px; max-width: 40%; text-align: right; pointer-events: none; z-index: 10; }
  #stage-tag {
    display: inline-block; font-size: 12px; letter-spacing: 2px;
    color: #0b1326; background: linear-gradient(90deg,#7fd2ff,#4a9bff);
    padding: 3px 10px; border-radius: 20px; font-weight: 700;
    text-shadow: none; margin-bottom: 6px;
  }
  #stage-name { font-size: 17px; font-weight: 700; color: #fff; }
  #stage-meta { font-size: 12px; color: #8fb6e8; margin-top: 4px; line-height: 1.5; }
  #narration {
    position: fixed; left: 18px; bottom: 180px; width: min(560px, 46%);
    padding: 14px 18px; font-size: 14px; line-height: 1.7; color: #d7e7ff;
    letter-spacing: 0.5px; z-index: 10;
  }
  #narration .ts { display: block; font-size: 12px; color: #6fb0ff;
    letter-spacing: 2px; margin-bottom: 6px; }
  #controls {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    width: min(1180px, 94%); padding: 14px 18px 12px; pointer-events: auto;
  }
  #progress-wrap {
    position: relative; height: 4px; border-radius: 4px;
    background: rgba(90,150,230,0.18); margin-bottom: 14px;
  }
  #progress-fill {
    position: absolute; left: 0; top: 0; height: 100%; width: 0%;
    background: linear-gradient(90deg,#4a9bff,#7fe0ff);
    box-shadow: 0 0 10px #4a9bff; border-radius: 4px; transition: width 0.15s linear;
  }
  #progress-ticks { position: absolute; inset: 0; }
  .tick { position: absolute; top: -3px; width: 2px; height: 10px;
    background: rgba(150,200,255,0.4); }
  .tick-label { position: absolute; top: 12px; transform: translateX(-50%);
    font-size: 10px; color: #6f93c8; white-space: nowrap; }
  .stage-btn-row { display: grid; grid-template-columns: repeat(8, 1fr);
    gap: 8px; margin-bottom: 12px; }
  .stage-btn {
    appearance: none; border: 1px solid rgba(90,160,255,0.3);
    background: linear-gradient(180deg, rgba(20,40,80,0.6), rgba(10,20,45,0.6));
    color: #b9d4ff; padding: 8px 6px; border-radius: 7px;
    font-size: 12px; cursor: pointer; transition: all 0.2s;
    text-align: center; line-height: 1.3; font-family: inherit;
  }
  .stage-btn .n { display: block; font-size: 10px; color: #6f9fd8; letter-spacing: 1px; }
  .stage-btn:hover { border-color: #6fb0ff; color: #fff;
    box-shadow: 0 0 14px rgba(80,160,255,0.35); }
  .stage-btn.active {
    background: linear-gradient(180deg, rgba(60,130,240,0.55), rgba(30,80,180,0.55));
    border-color: #8fd0ff; color: #fff; box-shadow: 0 0 18px rgba(90,170,255,0.55);
  }
  .action-row { display: flex; gap: 10px; justify-content: center; }
  .action-btn {
    appearance: none; cursor: pointer;
    border: 1px solid rgba(110,190,255,0.4);
    background: linear-gradient(180deg, rgba(30,70,140,0.55), rgba(15,35,80,0.55));
    color: #eaf4ff; padding: 8px 22px; border-radius: 20px;
    font-size: 13px; letter-spacing: 2px; font-family: inherit; transition: all 0.2s;
  }
  .action-btn:hover { box-shadow: 0 0 16px rgba(90,180,255,0.5); border-color: #9fd6ff; }
  .action-btn.primary {
    background: linear-gradient(180deg,#ff8a3c,#e8520a);
    border-color: #ffb070; color: #fff; box-shadow: 0 0 16px rgba(255,120,40,0.4);
  }
  .action-btn.primary.playing {
    background: linear-gradient(180deg,#4a9bff,#1f5fc4);
    border-color: #9fd6ff; box-shadow: 0 0 16px rgba(90,170,255,0.5);
  }
  #hint { position: fixed; right: 18px; bottom: 180px; font-size: 11px;
    color: #5d83b8; letter-spacing: 1px; pointer-events: none; text-align: right; line-height: 1.7; z-index: 10; }

  #inset {
    position: fixed; right: 18px; top: 110px;
    width: 380px; height: 460px;
    border-radius: 10px; overflow: hidden;
    border: 1px solid rgba(110,190,255,0.5);
    box-shadow: 0 0 30px rgba(60,140,255,0.35), inset 0 0 24px rgba(10,30,70,0.6);
    z-index: 9; pointer-events: none;
  }
  #inset canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
  #inset-label {
    position: absolute; left: 10px; top: 8px; z-index: 2;
    font-size: 11px; letter-spacing: 2px; color: #9fd6ff;
    background: rgba(5,12,28,0.6); padding: 3px 10px; border-radius: 12px;
    border: 1px solid rgba(110,190,255,0.3);
  }
  #inset-title {
    position: absolute; left: 10px; bottom: 8px; z-index: 2;
    font-size: 13px; font-weight: 700; color: #fff;
    text-shadow: 0 0 10px rgba(0,0,0,0.9);
    background: linear-gradient(90deg, rgba(5,12,28,0.75), rgba(5,12,28,0));
    padding: 4px 12px 4px 8px; border-radius: 6px;
  }
  #inset-corner {
    position: absolute; right: 8px; top: 8px; z-index: 2;
    width: 18px; height: 18px;
    border-top: 2px solid #7fd2ff; border-right: 2px solid #7fd2ff;
  }
  #big-countdown {
    position: fixed; left: 50%; top: 38%; transform: translate(-50%,-50%);
    font-size: 120px; font-weight: 800; letter-spacing: 4px;
    color: #fff; text-shadow: 0 0 40px rgba(255,120,40,0.9), 0 0 80px rgba(255,80,20,0.6);
    font-variant-numeric: tabular-nums; z-index: 20; pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
  }
  #big-countdown.go { color: #ffce4a; text-shadow: 0 0 50px #ff8a20, 0 0 100px #ff4a10; font-size: 90px; }
  #mission-clock {
    position: fixed; left: 50%; top: 22px; transform: translateX(-50%);
    background: rgba(5,12,28,0.6); border: 1px solid rgba(110,190,255,0.3);
    border-radius: 20px; padding: 6px 22px; z-index: 11; pointer-events: none;
    font-size: 14px; letter-spacing: 3px; color: #bfe0ff;
    font-variant-numeric: tabular-nums;
  }
  #mission-clock .v { color: #ffd76b; font-weight: 700; margin-left: 8px; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #02030a; z-index: 50; flex-direction: column; gap: 18px; transition: opacity 0.8s; }
  #loading .ring { width: 54px; height: 54px; border-radius: 50%;
    border: 3px solid rgba(90,160,255,0.2); border-top-color: #6fb0ff; animation: spin 1s linear infinite; }
  #loading .txt { color: #7fb0ee; letter-spacing: 4px; font-size: 13px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="loading"><div class="ring"></div><div class="txt">长征八号甲 · 场景装载中</div></div>
<div class="flash" id="flash"></div>

<div class="panel" id="title-box">
  <div class="sub">CZ-8A · QIANFAN POLAR CONSTELLATION</div>
  <h1>长征八号甲遥九 · 千帆极轨15组卫星发射</h1>
</div>

<div class="panel" id="stage-box">
  <span id="stage-tag">STAGE 0</span>
  <div id="stage-name">塔架待命</div>
  <div id="stage-meta">海南商业航天发射场 · 待命倒计时</div>
</div>

<div id="mission-clock">MISSION TIME<span class="v" id="mission-time">T-00:05</span></div>

<div id="big-countdown"></div>

<div id="inset">
  <div id="inset-label">LIVE · 特写</div>
  <div id="inset-corner"></div>
  <div id="inset-title">火箭待命</div>
</div>

<div class="panel" id="narration">
  <span class="ts" id="nar-ts">T-00:05</span>
  <span id="nar-text">长征八号甲遥九火箭·海南商业航天发射场·待命倒计时</span>
</div>

<div id="hint">鼠标左键 旋转视角 · 右键 平移 · 滚轮 缩放<br/>点击底部阶段按钮可手动跳转</div>

<div class="panel" id="controls">
  <div id="progress-wrap"><div id="progress-fill"></div><div id="progress-ticks"></div></div>
  <div class="stage-btn-row" id="stage-btns"></div>
  <div class="action-row">
    <button class="action-btn primary" id="btn-play">自动播放</button>
    <button class="action-btn" id="btn-reset">重置</button>
    <button class="action-btn" id="btn-mute">配音 开</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
