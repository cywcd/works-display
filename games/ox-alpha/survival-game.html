<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>荒野猎杀 · WILDERNESS HUNT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Black+Ops+One&display=swap');
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0d08;font-family:'Rajdhani',sans-serif;color:#cfe3b8}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.bar{position:absolute;left:24px;width:220px;height:14px;border:1px solid #6a7a4a;background:rgba(10,15,5,.55);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.bar i{display:block;height:100%;transition:width .25s}
#hpBar{bottom:96px}#hpBar i{background:linear-gradient(90deg,#7a1f1f,#e04b3a)}
#fdBar{bottom:70px}#fdBar i{background:linear-gradient(90deg,#7a5a1f,#e0a83a)}
#wtBar{bottom:44px}#wtBar i{background:linear-gradient(90deg,#1f4a7a,#3aa0e0)}
.blab{position:absolute;left:252px;font-size:13px;font-weight:700;letter-spacing:2px;text-shadow:0 1px 2px #000}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:26px;height:26px}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#d8ffc277}
#crosshair::before{left:12px;top:0;width:2px;height:26px}
#crosshair::after{top:12px;left:0;height:2px;width:26px}
#hitmark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(45deg);font-size:30px;color:#ff5544;opacity:0;font-family:'Black Ops One'}
#ammo{position:absolute;right:32px;bottom:40px;font-family:'Black Ops One';font-size:42px;text-shadow:0 2px 6px #000}
#ammo small{font-size:18px;color:#9ab07f}
#kills{position:absolute;top:20px;right:32px;font-size:20px;font-weight:700;letter-spacing:2px}
#wave{position:absolute;top:52px;right:32px;font-size:15px;letter-spacing:3px;color:#9ab07f}
#clock{position:absolute;top:20px;left:24px;font-size:17px;font-weight:700;letter-spacing:2px}
#msg{position:absolute;top:38%;width:100%;text-align:center;font-size:22px;font-weight:700;letter-spacing:3px;color:#ffe9a0;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .4s}
#vig{position:absolute;inset:0;box-shadow:inset 0 0 180px rgba(120,0,0,0);pointer-events:none;transition:box-shadow .3s}
#screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:
 radial-gradient(ellipse at 50% 120%,rgba(60,90,30,.35),transparent 60%),
 repeating-linear-gradient(45deg,#0c100a 0 14px,#0e130b 14px 28px)}
#screen h1{font-family:'Black Ops One';font-size:min(9vw,84px);color:#e8f5cf;letter-spacing:4px;text-shadow:0 0 30px rgba(140,190,80,.35),0 4px 0 #23301a;margin-bottom:6px}
#screen h2{letter-spacing:6px;font-size:16px;color:#8fa76f;margin-bottom:36px}
.btn{pointer-events:auto;cursor:pointer;font-family:'Black Ops One';font-size:24px;letter-spacing:4px;color:#101608;background:linear-gradient(#b8d877,#7ba33f);border:none;padding:14px 58px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);transition:.15s}
.btn:hover{filter:brightness(1.15);transform:scale(1.04)}
#tips{margin-top:34px;font-size:15px;line-height:2;color:#93a87c;text-align:center;letter-spacing:1px}
#tips b{color:#d8efae}
#dead{display:none}#dead h1{color:#ff6a55}
#stats{font-size:19px;margin-bottom:28px;letter-spacing:2px;color:#cfe3b8}
.hidden{display:none!important}
#pickupHint{position:absolute;bottom:150px;width:100%;text-align:center;font-size:17px;font-weight:700;letter-spacing:2px;color:#fff;text-shadow:0 1px 4px #000;opacity:0}
</style>
</head>
<body>
<div id="hud">
  <div id="vig"></div><div id="crosshair"></div><div id="hitmark">+</div>
  <div class="bar" id="hpBar"><i></i></div><div class="blab" style="bottom:94px">HP</div>
  <div class="bar" id="fdBar"><i></i></div><div class="blab" style="bottom:68px">FOOD</div>
  <div class="bar" id="wtBar"><i></i></div><div class="blab" style="bottom:42px">WATER</div>
  <div id="clock">DAY 1 · 06:00</div>
  <div id="kills">击杀 0</div><div id="wave">第 1 波</div>
  <div id="ammo">30<small> / ∞</small></div>
  <div id="msg"></div><div id="pickupHint">按 [E] 拾取</div>
</div>
<div id="screen">
  <div id="menu">
    <h1>荒野猎杀</h1><h2>WILDERNESS HUNT · 单机生存射击</h2>
    <button class="btn" onclick="startGame()">进入荒野</button>
    <div id="tips">
      <b>WASD</b> 移动 · <b>Shift</b> 疾跑 · <b>空格</b> 跳跃 · <b>鼠标</b> 瞄准射击<br>
      <b>V</b> 切换 第一人称 / 第三人称 · <b>R</b> 装弹 · <b>E</b> 拾取补给<br>
      击杀机器人撑过一波波围剿，留意饥饿与口渴，找到补给箱才能活下去

  </div>
</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,900);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

scene.fog=new THREE.FogExp2(0xaec6a0,.0055);

const sun=new THREE.DirectionalLight(0xfff0d0,2.2);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1;sun.shadow.camera.far=260;
Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60});
sun.shadow.bias=-0.0006;
scene.add(sun,sun.target);
scene.add(new THREE.AmbientLight(0x9db4c8,.45));
const hemi=new THREE.HemisphereLight(0xbdd8f0,0x44522c,.65);
scene.add(hemi);

function n2(x,z){const s=Math.sin(x*127.1+z*311.7)*43758.5453;return s-Math.floor(s)}
function sm(t){return t*t*(3-2*t)}
function vnoise(x,z){
  const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  const a=n2(xi,zi),b=n2(xi+1,zi),c=n2(xi,zi+1),d=n2(xi+1,zi+1);
  const u=sm(xf),v=sm(zf);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
const WATER_Y=-1.6;
function terrainH(x,z){
  let h=vnoise(x*.008+31,z*.008+7)*13-6.5;
  h+=vnoise(x*.03,z*.03)*2.4-1.2;
  h+=vnoise(x*.12,z*.12)*.6-.3;
  const d=Math.hypot(x,z);
  if(d>240)h+=(d-240)*.06;
  return h;
}

const seg=160,size=520;
const tg=new THREE.PlaneGeometry(size,size,seg,seg);
tg.rotateX(-Math.PI/2);
const p=tg.attributes.position,col=[];
for(let i=0;i<p.count;i++){
  const x=p.getX(i),z=p.getZ(i);
  const h=terrainH(x,z);
  p.setY(i,h);
  let c=new THREE.Color();
  if(h<WATER_Y+.5)c.setHex(0xb5a26e);
  else{
    const g=vnoise(x*.15,z*.15);
    c.setRGB(.28+g*.1,.42+g*.12,.16+g*.06);
    if(vnoise(x*.02,z*.02)>.62)c.lerp(new THREE.Color(0x6e6a50),.5);
  }
  col.push(c.r,c.g,c.b);
}
tg.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
tg.computeVertexNormals();
const ground=new THREE.Mesh(tg,new THREE.MeshLambertMaterial({vertexColors:true}));
ground.receiveShadow=true;
ground.userData.env=true;
scene.add(ground);

const waterMat=new THREE.MeshPhongMaterial({color:0x2a5d78,transparent:true,opacity:.82,shininess:120,specular:0x88bbcc});
const water=new THREE.Mesh(new THREE.PlaneGeometry(size,size),waterMat);
water.rotation.x=-Math.PI/2;water.position.y=WATER_Y;
water.userData.env=true;
scene.add(water);

const skyGeo=new THREE.SphereGeometry(700,16,12);
const skyMat=new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,
  uniforms:{top:{value:new THREE.Color(0x77aadd)},bot:{value:new THREE.Color(0xd8e6c8)}},
  vertexShader:'varying vec3 vp;void main(){vp=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top,bot;varying vec3 vp;void main(){float f=clamp(normalize(vp).y*.5+.5,0.,1.);gl_FragColor=vec4(mix(bot,top,pow(f,.8)),1.);}'
});
const sky=new THREE.Mesh(skyGeo,skyMat);
scene.add(sky);

const cloudMat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.85});
const clouds=[];
for(let i=0;i<14;i++){
  const g=new THREE.Group();
  for(let j=0;j<4;j++){
    const s=8+Math.random()*14;
    const m=new THREE.Mesh(new THREE.SphereGeometry(s,7,5),cloudMat);
    m.position.set((Math.random()-.5)*30,(Math.random()-.5)*5,(Math.random()-.5)*22);
    m.scale.y=.4;g.add(m);
  }
  g.position.set((Math.random()-.5)*600,110+Math.random()*50,(Math.random()-.5)*600);
  scene.add(g);clouds.push(g);
}

const shootTargets=[ground];
const obstacles=[];
const M={trunk:new THREE.MeshLambertMaterial({color:0x6b4f30}),trunk2:new THREE.MeshLambertMaterial({color:0x8a8578}),
  pine:new THREE.MeshLambertMaterial({color:0x2c5220}),leaf:new THREE.MeshLambertMaterial({color:0x4a7030}),
  leaf2:new THREE.MeshLambertMaterial({color:0x5d8038}),rock:new THREE.MeshLambertMaterial({color:0x84837a}),
  bush:new THREE.MeshLambertMaterial({color:0x3d6428})};
function addPine(x,z,h){
  const g=new THREE.Group();const th=h*.42;
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(th*.12,th*.18,th,7),M.trunk);
  trunk.position.y=th/2;trunk.castShadow=true;g.add(trunk);
  for(let i=0;i<3;i++){
    const r=(h*.30)*(1-i*.22),hh=h*.34*(1-i*.12);
    const cone=new THREE.Mesh(new THREE.ConeGeometry(r,hh,8),M.pine);
    cone.position.y=th+h*.16+i*h*.2;cone.castShadow=true;g.add(cone);
  }
  g.position.set(x,terrainH(x,z)-.2,z);
  g.userData.env=true;g.traverse(o=>o.userData.env=true);
  scene.add(g);shootTargets.push(g);
  obstacles.push({x,z,r:th*.5+.4});
}
function addBroadleaf(x,z,h){
  const g=new THREE.Group();const th=h*.45;
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(th*.09,th*.16,th,7),M.trunk2);
  trunk.position.y=th/2;trunk.castShadow=true;g.add(trunk);
  const lm=Math.random()<.5?M.leaf:M.leaf2;
  for(let i=0;i<4;i++){
    const r=h*(.17+Math.random()*.1);
    const blob=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),lm);
    blob.position.set((Math.random()-.5)*h*.4,th+h*.18+(Math.random()-.5)*h*.2,(Math.random()-.5)*h*.4);
    blob.castShadow=true;g.add(blob);
  }
  g.position.set(x,terrainH(x,z)-.2,z);
  g.userData.env=true;
  scene.add(g);shootTargets.push(g);
  obstacles.push({x,z,r:th*.4+.4});
}
function addRock(x,z,s){
  const m=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),M.rock);
  m.position.set(x,terrainH(x,z)+s*.3,z);
  m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
  m.scale.y=.7;m.castShadow=true;m.receiveShadow=true;
  m.userData.env=true;scene.add(m);shootTargets.push(m);
  obstacles.push({x,z,r:s*.9});
}
function addBush(x,z){
  const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.6+Math.random()*.5,1),M.bush);
  m.position.set(x,terrainH(x,z)+.35,z);m.scale.y=.75;
  m.userData.env=true;scene.add(m);
}
for(let i=0;i<170;i++){
  const x=(Math.random()-.5)*480,z=(Math.random()-.5)*480;
  const h=terrainH(x,z);
  if(Math.hypot(x,z)<20||h<WATER_Y+.6||h>7)continue;
  const r=Math.random();
  if(r<.45)addPine(x,z,7+Math.random()*7);
  else if(r<.8)addBroadleaf(x,z,6+Math.random()*6);
  else if(r<.92)addRock(x,z,1.2+Math.random()*1.8);
  else addBush(x,z);
}
for(let i=0;i<220;i++){
  const x=(Math.random()-.5)*460,z=(Math.random()-.5)*460;
  if(Math.hypot(x,z)<15||terrainH(x,z)<WATER_Y+.4)continue;
  addBush(x,z);
}

const bladeGeo=new THREE.PlaneGeometry(.14,.55);
bladeGeo.translate(0,.27,0);
const bladeMat=new THREE.MeshLambertMaterial({color:0xffffff,side:THREE.DoubleSide});
const grassCount=3500;
const grass=new THREE.InstancedMesh(bladeGeo,bladeMat,grassCount);
const dummy=new THREE.Object3D(),gc=new THREE.Color();
let gi=0;
while(gi<grassCount){
  const x=(Math.random()-.5)*460,z=(Math.random()-.5)*460;
  const h=terrainH(x,z);
  if(h<WATER_Y+.5)continue;
  dummy.position.set(x,h,z);
  dummy.rotation.set((Math.random()-.5)*.4,Math.random()*Math.PI,(Math.random()-.5)*.4);
  const s=.6+Math.random()*.9;
  dummy.scale.set(s,s*(.8+Math.random()*.7),s);
  dummy.updateMatrix();
  grass.setMatrixAt(gi,dummy.matrix);
  gc.setRGB(.25+Math.random()*.15,.4+Math.random()*.2,.12+Math.random()*.08);
  grass.setColorAt(gi,gc);
  gi++;
}
grass.instanceColor.needsUpdate=true;
scene.add(grass);

const crateGeo=new THREE.BoxGeometry(1.3,1.3,1.3);
const crateTypes={
  health:{c:0xa03030,label:'+35 HP'},food:{c:0xb06028},water:{c:0x3060b0},ammo:{c:0xb09a30}
};
const pickups=[];
function addCrate(x,z,type){
  const y=Math.max(terrainH(x,z),WATER_Y)+.7;
  const c=new THREE.Mesh(crateGeo,new THREE.MeshStandardMaterial({color:crateTypes[type].c,roughness:.6,metalness:.2}));
  c.position.set(x,y,z);c.rotation.y=Math.random()*3;c.castShadow=true;
  scene.add(c);pickups.push({mesh:c,type,x,z});
}
for(let i=0;i<30;i++){
  const x=(Math.random()-.5)*420,z=(Math.random()-.5)*420;
  if(Math.hypot(x,z)<15||terrainH(x,z)<WATER_Y)continue;
  addCrate(x,z,['health','food','water','ammo'][Math.floor(Math.random()*4)]);
}

const player={
  pos:new THREE.Vector3(0,0,0),vel:new THREE.Vector3(),
  hp:100,food:100,water:100,onGround:true,
  ammo:30,mag:30,kills:0,wave:1,yaw:0,pitch:0,recoil:0,bobT:0,moving:false
};
player.pos.set(0,terrainH(0,0)+1.7,0);
let thirdPerson=false;

const CAMO=[0x55603c,0x6b5d43,0x4a4a52,0x726a50,0x3d4c33,0x6e4438,0x50584a,0x2e3338];
function buildHumanoid(cfg){
  const g=new THREE.Group();
  const uni=new THREE.MeshStandardMaterial({color:cfg.cloth,roughness:.88});
  const uni2=new THREE.MeshStandardMaterial({color:new THREE.Color(cfg.cloth).multiplyScalar(.72),roughness:.88});
  const gear=new THREE.MeshStandardMaterial({color:cfg.gear,roughness:.8});
  const dark=new THREE.MeshStandardMaterial({color:0x23231f,roughness:.65});
  const skin=new THREE.MeshStandardMaterial({color:cfg.skin,roughness:.75});
  const boot=new THREE.MeshStandardMaterial({color:cfg.boot,roughness:.95});
  const B=(w,h,d,m)=>{const x=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);x.castShadow=true;return x};

  const hips=new THREE.Group();hips.position.y=1.02;
  const pelvis=B(.42,.24,.28,gear);pelvis.position.y=-.04;
  const belt=B(.44,.06,.3,dark);belt.position.y=.08;
  hips.add(pelvis,belt);

  const torsoG=new THREE.Group();torsoG.position.y=.1;
  const abdomen=B(.38,.18,.25,uni2);abdomen.position.y=.1;
  const chest=B(.48,.42,.3,uni);chest.position.y=.4;
  const chestTaper=B(.36,.16,.26,uni2);chestTaper.position.y=.66;
  const rig=B(.5,.32,.35,gear);rig.position.y=.42;
  for(let i=-1;i<=1;i++){
    const p=B(.11,.13,.05,dark);p.position.set(i*.15,.42,.19);
    if(i===0)p.position.y=.28;torsoG.add(p);
  }
  const collar=B(.3,.07,.24,uni2);collar.position.y=.72;
  torsoG.add(abdomen,chest,chestTaper,rig,collar);
  if(cfg.pack){
    const pack=B(.36,.46,.2,gear);pack.position.set(0,.46,-.29);
    const roll=B(.34,.12,.16,new THREE.MeshStandardMaterial({color:cfg.cloth2||cfg.gear,roughness:.9}));roll.position.set(0,.72,-.3);
    torsoG.add(pack,roll);
  }
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(.065,.075,.12,8),skin);neck.position.y=-.06;neck.castShadow=true;

  const headG=new THREE.Group();headG.position.y=.86;
  const skull=new THREE.Mesh(new THREE.SphereGeometry(.165,14,12),skin);
  skull.scale.set(1,1.15,1.02);skull.position.y=.1;skull.castShadow=true;
  const nose=B(.05,.09,.06,skin);nose.position.set(0,.07,.155);
  const goggles=B(.3,.06,.03,cfg.helmType===2?dark:new THREE.MeshStandardMaterial({color:0x1a1d20,roughness:.3,metalness:.4}));
  goggles.position.set(0,.17,.13);
  headG.add(skull,nose,goggles);
  if(cfg.helmType===0){
    const helm=new THREE.Mesh(new THREE.SphereGeometry(.21,14,10,0,Math.PI*2,0,Math.PI*.58),gear);
    helm.scale.set(1.05,1,1.1);helm.position.y=.13;helm.castShadow=true;
    const brim=B(.34,.04,.1,gear);brim.position.set(0,.12,.16);
    headG.add(helm,brim);
  }else if(cfg.helmType===1){
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(.175,.185,.12,12),gear);
    cap.position.y=.22;cap.castShadow=true;
    const brim=B(.3,.03,.16,gear);brim.position.set(0,.16,.2);
    headG.add(cap,brim);
  }else{
    const mask=B(.27,.24,.26,dark);mask.position.set(0,.08,.01);
    skull.material=dark;headG.add(mask);
  }
  headG.add(neck);

  const mkArm=(s,flip)=>{
    const sh=new THREE.Group();sh.position.set(s,.62,.02);
    const shoulder=new THREE.Mesh(new THREE.SphereGeometry(.105,10,8),uni);shoulder.castShadow=true;
    const upper=B(.13,.32,.145,uni);upper.position.y=-.18;
    const elbow=new THREE.Mesh(new THREE.SphereGeometry(.075,8,7),uni2);elbow.position.y=-.36;
    const fore=new THREE.Group();fore.position.y=-.38;
    const lower=B(.115,.3,.125,uni2);lower.position.y=-.15;
    const glove=B(.1,.13,.13,dark);glove.position.set(0,-.34,.01);
    fore.add(lower,glove);
    sh.add(shoulder,upper,elbow,fore);
    return{sh,fore};
  };
  const aL=mkArm(-.315),aR=mkArm(.315);
  aL.sh.rotation.set(-1.25,0,-.25);
  aL.fore.rotation.x=-.45;
  aR.sh.rotation.set(-1.05,0,.18);
  aR.fore.rotation.x=-.5;

  const rifle=new THREE.Group();
  const rcv=B(.055,.09,.42,dark);
  const low=B(.058,.08,.26,new THREE.MeshStandardMaterial({color:0x3a3831,roughness:.5,metalness:.45}));
  low.position.set(0,-.07,-.02);
  const brl=new THREE.Mesh(new THREE.CylinderGeometry(.016,.019,.34,8),dark);brl.rotation.x=Math.PI/2;brl.position.set(0,.03,.36);
  const gas=new THREE.Mesh(new THREE.CylinderGeometry(.022,.022,.06,8),dark);gas.rotation.x=Math.PI/2;gas.position.set(0,.005,.28);
  const fh=new THREE.Mesh(new THREE.CylinderGeometry(.024,.021,.07,8),dark);fh.rotation.x=Math.PI/2;fh.position.set(0,.03,.55);
  const hnd=new THREE.Mesh(new THREE.CylinderGeometry(.042,.042,.26,8),uni2);hnd.rotation.x=Math.PI/2;hnd.position.z=.22;
  const railT=B(.03,.014,.6,dark);railT.position.set(0,.075,-.05);
  const mg1=B(.045,.13,.085,dark);mg1.position.set(0,-.15,.02);mg1.rotation.x=.18;
  const mg2=B(.043,.11,.075,dark);mg2.position.set(0,-.25,.075);mg2.rotation.x=.5;
  const grip=B(.042,.11,.06,uni2);grip.position.set(0,-.15,-.15);grip.rotation.x=-.35;
  const stck=B(.05,.085,.2,uni2);stck.position.set(0,-.01,-.31);

const raycaster=new THREE.Raycaster();
const tracerMat=new THREE.LineBasicMaterial({color:0xffdd88,transparent:true,opacity:.9});

function shoot(){
  if(!playing||reloading||player.ammo<=0){if(player.ammo<=0&&!reloading)sfx('empty');return}
  player.ammo--;updateAmmo();sfx('shot');
  player.recoil=Math.min(player.recoil+.022,.06);
  flashT=.06;
  const mzWorld=vmMuzzle.getWorldPosition(new THREE.Vector3());
  flashLight.position.copy(mzWorld);
  flashMesh.position.copy(mzWorld);
  flashMesh.visible=true;
  const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  raycaster.set(camera.position.clone(),dir);
  raycaster.far=250;
  const hits=raycaster.intersectObjects(shootTargets,true).filter(h=>{
    let o=h.object;while(o){if(o.userData.bot!==undefined&&o.userData.bot!==null)return true;o=o.parent}
    return false;
  });
  const end=camera.position.clone().add(dir.clone().multiplyScalar(hits[0]?hits[0].distance:250));
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([mzWorld,end]),tracerMat.clone());
  scene.add(line);tracers.push({line,t:.07});
  if(hits[0]){
    let o=hits[0].object;while(o&&!(o.userData.bot&&o.userData.bot!==null))o=o.parent;
    if(o){
      const b=o.userData.bot;
      b.hp-=34;if(b.state!=='chase'){b.state='chase'}
      hitFlash();
      if(b.hp<=0)killBot(b);
    }
  }
}
function reload(){
  if(reloading||player.ammo===30||player.mag<=0)return;
  reloading=true;player.reloading=true;reloadEnd=Date.now()+1400;showMsg('装弹中...');
  sfx('reload');
  setTimeout(()=>{
    const take=Math.min(30,player.mag);
    player.mag-=take-player.ammo;
    player.ammo=take;
    reloading=false;player.reloading=false;
    updateAmmo();hideMsg();
  },1400);
}
function killBot(b){
  scene.remove(b.g);
  bots.splice(bots.indexOf(b),1);
  const ti=shootTargets.indexOf(b.g);if(ti>=0)shootTargets.splice(ti,1);
  player.kills++;document.getElementById('kills').textContent='击杀 '+player.kills;
  sfx('kill');showMsg('已击杀 '+b.name+'  +100');
  setTimeout(hideMsg,900);
  if(bots.length===0&&botsToSpawn===0){
    player.wave++;
    document.getElementById('wave').textContent='第 '+player.wave+' 波';
    const cnt=Math.min(6+player.wave*3,26);
    showMsg('第 '+player.wave+' 波来袭！敌人数 '+cnt);
    sfx('wave');
    botsToSpawn=cnt;
    for(let i=0;i<3;i++){
      const x=(Math.random()-.5)*420,z=(Math.random()-.5)*420;
      if(terrainH(x,z)>WATER_Y)addCrate(x,z,['health','food','water','ammo'][Math.floor(Math.random()*4)]);
    }
    player.hp=Math.min(100,player.hp+20);
  }
}

let AC=null;
function sfx(type){
  AC=AC||new AudioContext();
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  const t=AC.currentTime;
  const P={
    shot:[200,35,.13,'square',.22],empty:[120,80,.08,'sawtooth',.1],
    hurt:[180,90,.25,'sawtooth',.2],kill:[520,880,.18,'square',.15],
    pickup:[440,660,.15,'triangle',.18],reload:[300,200,.3,'triangle',.12],
    wave:[200,400,.5,'sine',.2],die:[300,50,.9,'sawtooth',.3],bs:[800,300,.06,'square',.05]
  }[type];
  if(!P)return;
  o.type=P[3];o.frequency.setValueAtTime(P[0],t);o.frequency.exponentialRampToValueAtTime(P[1],t+P[2]);
  g.gain.setValueAtTime(P[4],t);g.gain.exponentialRampToValueAtTime(.001,t+P[2]);
  o.start(t);o.stop(t+P[2]);
}

function collide(nx,nz){
  for(const o of obstacles)
    if(Math.hypot(nx-o.x,nz-o.z)<o.r+.45)return true;
  return false;
}

function animate(t){
  requestAnimationFrame(animate);
  const dt=Math.min((t-lastT)/1000,.05)||.016;lastT=t;

  water.material.opacity=.78+Math.sin(t*.0012)*.05;
  water.position.y=WATER_Y+Math.sin(t*.0015)*.06;
  for(const c of clouds){c.position.x+=dt*1.2;if(c.position.x>320)c.position.x=-320}

  const dayPhase=((gameTime%(1440))+1440)%1440/1440;
  const sunA=Math.sin(dayPhase*Math.PI*2-Math.PI/2);
  const night=Math.max(0,-sunA+.05);
  skyMat.uniforms.top.value.setRGB(.47-night*.42,.67-night*.5,.87-night*.55);
  skyMat.uniforms.bot.value.setRGB(.85-night*.6,.9-night*.62,.78-night*.5);
  scene.fog.color.copy(skyMat.uniforms.bot.value);
  sun.intensity=Math.max(0,sunA)*2.4+.15;
  hemi.intensity=.25+Math.max(0,sunA)*.5;
  sun.color.setHSL(.11,.5,Math.max(.55,sunA));

  if(playing)gameTime+=dt;
  const hrs=Math.floor(gameTime/60)%24,min=Math.floor(gameTime%60);
  document.getElementById('clock').textContent=`DAY ${Math.floor(gameTime/1440)+1} · ${String(hrs).padStart(2,'0')}:${String(min).padStart(2,'0')}`;

  const sunDir=new THREE.Vector3(Math.cos(dayPhase*Math.PI*2-Math.PI/2)*.8,Math.max(.15,sunA),.4).normalize();
  sun.position.copy(camera.position).addScaledVector(sunDir,120);
  sun.target.position.copy(camera.position);

  if(playing){
    player.food=Math.max(0,player.food-dt*.5);
    player.water=Math.max(0,player.water-dt*.75);
    if(player.food<=0||player.water<=0)damagePlayer(dt*4);

    const sp=(keys.ShiftLeft?10.5:5.5)*(keys.KeyC?.4:1);
    const f=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
    const r=new THREE.Vector3(f.z,0,-f.x);
    const mv=new THREE.Vector3();
    if(keys.KeyW)mv.add(f);if(keys.KeyS)mv.sub(f);
    if(keys.KeyA)mv.add(r);if(keys.KeyD)mv.sub(r);
    player.moving=mv.lengthSq()>0;
    if(player.moving){
      mv.normalize().multiplyScalar(sp*dt);
      const nx=player.pos.x+mv.x,nz=player.pos.z+mv.z;
      if(!collide(nx,player.pos.z))player.pos.x=nx;
      if(!collide(player.pos.x,nz))player.pos.z=nz;
      player.bobT+=dt*sp*1.1;
    }
    player.pos.x=THREE.MathUtils.clamp(player.pos.x,-255,255);
    player.pos.z=THREE.MathUtils.clamp(player.pos.z,-255,255);

    const gh=terrainH(player.pos.x,player.pos.z);
    const floorY=Math.max(gh,WATER_Y-1)+1.7;
    if(keys.Space&&player.onGround){player.vel.y=7;player.onGround=false}
    player.vel.y-=20*dt;player.pos.y+=player.vel.y*dt;
    if(player.pos.y<=floorY){player.pos.y=floorY;player.vel.y=0;player.onGround=true}
    if(Math.max(gh,WATER_Y)<WATER_Y-.5&&player.pos.y-floorY>.01)player.vel.y-=dt*6;

    player.recoil*=Math.pow(.001,dt);
    const bobX=Math.sin(player.bobT)*.02*(player.moving?1:0);
    const bobY=Math.abs(Math.cos(player.bobT))*.025*(player.moving?1:0);

    const eye=player.pos.clone();eye.y+=bobY*.6;
    if(thirdPerson){
      const back=new THREE.Vector3(0,0,1).applyEuler(new THREE.Euler(player.pitch,player.yaw,0,'YXZ'));
      const cp=eye.clone().addScaledVector(back,4.5).add(new THREE.Vector3(0,.6,0));
      cp.y=Math.max(cp.y,terrainH(cp.x,cp.z)+.5);
      camera.position.copy(cp);
      camera.lookAt(eye.clone().add(new THREE.Vector3(-Math.sin(player.yaw),Math.tan(player.pitch)*3,-Math.cos(player.yaw)).multiplyScalar(4)));
      soldier.position.set(player.pos.x,Math.max(gh,WATER_Y-1),player.pos.z);
      soldier.rotation.y=player.yaw+Math.PI;
      const A=soldier.userData.anim;
      const sw=player.moving?Math.sin(player.bobT)*.7:0;
      A.legL.rotation.x=sw;A.legR.rotation.x=-sw;
      A.shinL.rotation.x=Math.max(0,-sw)*.9;
      A.shinR.rotation.x=Math.max(0,sw)*.9;
      A.hips.position.y=1.02+(player.moving?Math.abs(Math.cos(player.bobT))*.05:0);
      A.headG.rotation.x=-player.pitch*.6;
    }else{
      camera.position.copy(eye);
      camera.rotation.set(player.pitch+player.recoil,player.yaw+bobX*.15,0,'YXZ');
    }

    vm.position.set(.26+bobX,-.26+bobY,-.42+player.recoil*2.2);
    vm.rotation.x=player.recoil*2.5;
    if(reloading){
      const prog=1-(reloadEnd-Date.now())/1400;
      vm.rotation.x-=Math.sin(prog*Math.PI)*.8;
      vm.position.y-=Math.sin(prog*Math.PI)*.15;
    }

    nearPickup=null;
    for(const p of pickups){
      p.mesh.rotation.y+=dt*.8;
      p.mesh.position.y=Math.max(terrainH(p.mesh.position.x,p.mesh.position.z),WATER_Y)+.7+Math.sin(t*.002+p.x)*.08;
      if(p.mesh.position.distanceTo(player.pos)<2.6)nearPickup=p;
    }
    document.getElementById('pickupHint').style.opacity=nearPickup?1:0;

    if(flashT>0){flashT-=dt;flashLight.intensity=flashT/.06*30;flashMesh.material.opacity=flashT/.06}
    else{flashLight.intensity=0;flashMesh.visible=false}

    if(botsToSpawn>0){spawnTimer-=dt;if(spawnTimer<=0&&bots.length<14){spawnBot();botsToSpawn--;spawnTimer=.55}}

    for(const b of bots){
      const bp=b.g.position,d=bp.distanceTo(player.pos);
      b.t-=dt;
      if(d<45)b.state='chase';
      else if(b.t<=0){b.state='wander';b.dir=Math.random()*Math.PI*2;b.t=2+Math.random()*3}
      const moveDir=b.state==='chase'?Math.atan2(bp.x-player.pos.x,bp.z-player.pos.z):b.dir;
      const bs=b.state==='chase'?b.speed*1.9:b.speed*.55;
      b.phase+=dt*bs*2.1;
      const sw=Math.sin(b.phase)*(d>2?.75:0);
      b.anim.legL.rotation.x=sw;b.anim.legR.rotation.x=-sw;
      b.anim.shinL.rotation.x=Math.max(0,-sw)*.9;
      b.anim.shinR.rotation.x=Math.max(0,sw)*.9;
      b.anim.hips.position.y=1.02+Math.abs(Math.cos(b.phase))*.05;
      b.g.rotation.y=moveDir;
      let nx=bp.x-Math.sin(moveDir)*bs*dt,nz=bp.z-Math.cos(moveDir)*bs*dt;
      if(collide(nx,nz)){b.dir=Math.random()*Math.PI*2;nx=bp.x;nz=bp.z}
      bp.x=THREE.MathUtils.clamp(nx,-255,255);
      bp.z=THREE.MathUtils.clamp(nz,-255,255);
      bp.y=Math.max(terrainH(bp.x,bp.z),WATER_Y-.3);
      b.g.rotation.y=moveDir;
      if(b.state==='chase'){
        b.cool-=dt;
        if(b.cool<=0&&d<50){
          b.cool=.95+Math.random()*1.2;sfx('bs');
          const from=bp.clone().add(new THREE.Vector3(0,1.5,0));
          const to=player.pos.clone().add(new THREE.Vector3((Math.random()-.5)*2.4,(Math.random()-.5),(Math.random()-.5)*2.4));
          const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([from,to]),tracerMat.clone());
          scene.add(l);tracers.push({line:l,t:.08});
          if(Math.random()<.42)damagePlayer(6+Math.random()*6);
        }
      }
    }

    for(let i=tracers.length-1;i>=0;i--){
      tracers[i].t-=dt;
      tracers[i].line.material.opacity=Math.max(0,tracers[i].t/.07*.9);
      if(tracers[i].t<=0){scene.remove(tracers[i].line);tracers.splice(i,1)}
    }

    const hp=document.getElementById('hpBar'),fd=document.getElementById('fdBar'),wt=document.getElementById('wtBar');
    hp.querySelector('i').style.width=Math.max(0,player.hp)+'%';
    fd.querySelector('i').style.width=player.food+'%';
    wt.querySelector('i').style.width=player.water+'%';
  }else{
    camera.position.set(Math.sin(t*.0001)*60,terrainH(0,0)+14,Math.cos(t*.0001)*60);
    camera.lookAt(0,terrainH(0,0)+3,0);
    vm.visible=false;soldier.visible=false;
  }

  renderer.render(scene,camera);
}
requestAnimationFrame(animate);
</script>
<script>
(function(){
  const st=document.createElement('style');
  st.textContent='@keyframes blink{from{opacity:1}to{opacity:.4}}';
  document.head.appendChild(st);
})();
</script>
