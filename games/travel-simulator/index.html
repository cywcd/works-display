<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<title>国庆旅行模拟器 3D · 今年国庆你准备花多少钱</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g transform='translate(0 3)'><circle cx='26' cy='63' r='15' fill='%231f2a44'/><circle cx='74' cy='63' r='15' fill='%231f2a44'/><rect x='12' y='27' width='76' height='39' rx='19.5' fill='%231f2a44'/><rect x='22' y='40.5' width='8' height='18' rx='2' fill='%232dd4bf'/><rect x='17' y='45.5' width='18' height='8' rx='2' fill='%232dd4bf'/><circle cx='69' cy='40.5' r='4.6' fill='%23ef4444'/><circle cx='60.5' cy='46.5' r='4.6' fill='%23fbbf24'/><circle cx='77.5' cy='46.5' r='4.6' fill='%2322c55e'/><circle cx='69' cy='52.5' r='4.6' fill='%23ea580c'/><circle cx='40' cy='56' r='5' fill='%2364748a'/><circle cx='54' cy='56' r='5' fill='%2364748a'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" media="print" onload="this.media='all'" onerror="this.remove()">
<style>
:root{
  --orange:#f97316; --orange-deep:#ea580c; --orange-soft:#ffedd5;
  --cream:#fff8ef; --card:#fffdf8; --ink:#1f2a44; --ink2:#475569;
  --teal:#0d9488; --teal-deep:#0f766e; --gold:#f59e0b; --red:#dc2626;
  --blue:#2563eb; --green:#16a34a; --purple:#7c3aed;
  --shadow:0 10px 30px rgba(31,42,68,.12), 0 2px 8px rgba(31,42,68,.08);
  --shadow-sm:0 3px 10px rgba(31,42,68,.10);
  --radius:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--ink);color:var(--ink);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  user-select:none;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
.hidden{display:none!important}
.font-fun{font-family:"ZCOOL KuaiLe","Noto Sans SC",sans-serif;font-weight:400}

/* ============ 屏幕容器 ============ */
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}

/* ============ 通用组件 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 26px;border-radius:999px;font-size:17px;font-weight:900;
  transition:transform .12s ease, box-shadow .12s ease, filter .12s;
  box-shadow:var(--shadow-sm);
}
.btn:active{transform:scale(.95)}
.btn-primary{background:linear-gradient(135deg,#fb923c,#ea580c);color:#fff;box-shadow:0 8px 20px rgba(234,88,12,.35)}
.btn-teal{background:linear-gradient(135deg,#2dd4bf,#0d9488);color:#fff;box-shadow:0 8px 20px rgba(13,148,136,.35)}
.btn-ghost{background:#fff;color:var(--ink);border:2px solid #e2e8f0}
.btn-dark{background:var(--ink);color:#fff}
.btn:disabled{filter:grayscale(.7) opacity .45;cursor:not-allowed;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#f1f5f9;color:var(--ink2)}
.chip.money{background:#dcfce7;color:#15803d}
.chip.time{background:#e0f2fe;color:#0369a1}
.chip.bad{background:#fee2e2;color:#b91c1c}
.chip.good{background:#ccfbf1;color:#0f766e}

/* ============ 首页 ============ */
#home{background:linear-gradient(180deg,#1f2a44 0%,#2b3a63 55%,#ea580c 130%);align-items:center}
#home3d{position:absolute;inset:0}
#home3d canvas{display:block;width:100%;height:100%}
.home-veil{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,transparent 40%,rgba(31,42,68,.55) 100%);pointer-events:none}
.home-inner{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(14px + var(--safe-b));width:100%;max-width:560px;margin:0 auto}
.home-title{text-align:center;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.18)}
.home-title h1{font-size:clamp(34px,8.5vw,52px);line-height:1.1;letter-spacing:2px}
.home-title .sub{margin-top:6px;font-size:15px;color:#ffd9a8;font-weight:700;letter-spacing:6px}
.home-badge3d{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 14px;border-radius:999px;background:linear-gradient(135deg,#2dd4bf,#0d9488);color:#fff;font-size:13px;font-weight:900;box-shadow:0 6px 16px rgba(13,148,136,.5);animation:badgePulse 2s ease-in-out infinite}
@keyframes badgePulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.home-modes{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:clamp(24px,10vh,108px)}
.mode-card{background:rgba(255,253,248,.96);border-radius:var(--radius);padding:13px 14px;text-align:left;box-shadow:var(--shadow);border:3px solid transparent;transition:transform .12s,border-color .15s}
.mode-card:active{transform:scale(.97)}
.mode-card.sel{border-color:var(--orange);background:#fff7ed}
.mode-card .mc-top{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900}
.mode-card .mc-emoji{font-size:24px}
.mode-card .mc-desc{margin-top:4px;font-size:12px;color:var(--ink2);line-height:1.4}
.mode-card .mc-money{margin-top:6px;font-size:12px;font-weight:700;color:var(--orange-deep)}
.home-actions{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.home-actions .btn{width:100%;padding:16px;font-size:18px}
.home-row{display:flex;gap:10px}
.home-row .btn{flex:1;padding:13px;font-size:15px}
.home-foot{margin-top:10px;font-size:11px;color:rgba(255,255,255,.75);text-align:center;line-height:1.6}

/* 右上角小图标钮 */
.icon-btn{position:absolute;z-index:5;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.icon-btn:active{transform:scale(.9)}
#soundBtn{top:calc(12px + env(safe-area-inset-top,0px));right:14px}

/* ============ 通用选择屏（同行/目的地） ============ */
.pick-screen{background:linear-gradient(180deg,#fff8ef,#ffe9d2);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + var(--safe-b));overflow-y:auto}
.pick-head{text-align:center;margin-bottom:14px}
.pick-head h2{font-size:28px;color:var(--ink)}
.pick-head p{font-size:13px;color:var(--ink2);margin-top:4px}
.pick-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:560px;margin:0 auto}
.pick-card{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow-sm);border:3px solid transparent;transition:transform .12s,border-color .15s;text-align:left;width:100%}
.pick-card:active{transform:scale(.98)}
.pick-card.sel{border-color:var(--orange);background:#fff7ed}
.pick-card .pc-emoji{font-size:38px;flex:0 0 52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--orange-soft);border-radius:14px}
.pick-card .pc-main{flex:1;min-width:0}
.pick-card .pc-name{font-size:18px;font-weight:900}
.pick-card .pc-desc{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.4}
.pick-card .pc-tags{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
.pick-card .pc-go{flex:0 0 auto;background:var(--orange);color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center}
.pick-foot{width:100%;max-width:560px;margin:16px auto 0}
.pick-foot .btn{width:100%}
.city-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:560px;margin:0 auto}
.city-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);border:3px solid transparent;text-align:left;position:relative;overflow:hidden;min-height:128px;display:flex;flex-direction:column}
.city-card:active{transform:scale(.97)}
.city-card.sel{border-color:var(--orange);background:#fff7ed}
.city-card .cc-emoji{font-size:34px}
.city-card .cc-name{font-size:19px;font-weight:900;margin-top:2px}
.city-card .cc-tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:5px;padding-top:8px}
.city-card .cc-crowd{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#fee2e2;color:#b91c1c}

/* ============ 游戏屏布局 ============ */
#game{background:var(--cream)}
.stage-wrap{position:relative;flex:0 0 42vh;width:100%;overflow:hidden;background:#1f2a44}
#stage3d{position:absolute;inset:0}
#stage3d canvas{display:block;width:100%;height:100%}
/* emoji 降级舞台 */
#stageEmoji{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#7dd3fc 0%,bae6fd 55%,#fde68a 100%);overflow:hidden}
#stageEmoji.on{display:flex}
.se-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:84px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.2));animation:sePop 3.4s ease both}
.se-prop{position:absolute;font-size:44px;animation:seFloat 3.4s ease-in-out both}
@keyframes sePop{0%{transform:scale(.3) translateY(60px);opacity:0}15%{transform:scale(1.08) translateY(0);opacity:1}25%{transform:scale(1)}75%{opacity:1}100%{transform:scale(1.12) translateY(-26px);opacity:0}}
@keyframes seFloat{0%{transform:translateY(30px) scale(.6);opacity:0}25%{opacity:1}80%{opacity:1}100%{transform:translateY(-70px) scale(1.1);opacity:0}}
.se-actors{display:flex;gap:6px;position:absolute;bottom:22%}
.se-actors span{font-size:46px;animation:seBob 1s ease-in-out infinite}
.se-actors span:nth-child(2){animation-delay:.15s}.se-actors span:nth-child(3){animation-delay:.3s}.se-actors span:nth-child(4){animation-delay:.45s}
@keyframes seBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.se-city{position:absolute;top:14%;font-size:40px;letter-spacing:14px;opacity:.85}

/* 电影黑边 */
.bar{position:absolute;left:0;right:0;height:9%;background:#000;z-index:6;pointer-events:none;transition:transform .35s cubic-bezier(.7,0,.2,1)}
.bar-top{top:0;transform:translateY(-101%)}
.bar-bot{bottom:0;transform:translateY(101%)}
.stage-wrap.cine .bar-top,.stage-wrap.cine .bar-bot{transform:translateY(0)}
.cine-sub{position:absolute;left:50%;bottom:11%;transform:translate(-50%,20px);z-index:7;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);
  color:#fff;padding:9px 20px;border-radius:999px;font-size:16px;font-weight:700;line-height:1.35;opacity:0;transition:opacity .3s,transform .3s;display:flex;gap:8px;align-items:center;max-width:92%;overflow:hidden}
.stage-wrap.cine .cine-sub{opacity:1;transform:translate(-50%,0)}
.cine-sub .cs-emoji{font-size:20px}
.cine-sub .cs-city{font-size:12px;color:#fdba74;font-weight:500}
.cine-progress{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.15);z-index:7;opacity:0;transition:opacity .3s}
.stage-wrap.cine .cine-progress{opacity:1}
.cine-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fb923c,#fbbf24);border-radius:0 4px 4px 0}
.cine-controls{position:absolute;z-index:8;top:10px;right:10px;display:flex;gap:8px;opacity:0;pointer-events:none;transition:opacity .3s}
.stage-wrap.cine .cine-controls{opacity:1;pointer-events:auto}
.cine-controls button{padding:7px 13px;border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px}
.cine-controls button.on{background:var(--orange)}
.cine-tag{position:absolute;z-index:7;top:10px;left:12px;color:rgba(255,255,255,.85);font-size:11px;font-weight:700;letter-spacing:2px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.flash{position:absolute;inset:0;background:#fff;z-index:9;pointer-events:none;opacity:0}
.flash.go{animation:flashGo .45s ease}
@keyframes flashGo{0%{opacity:0}12%{opacity:.95}100%{opacity:0}}

/* 游戏侧栏/底栏 */
.game-panel{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--cream)}
.hud{background:var(--card);box-shadow:var(--shadow-sm);padding:9px 12px 8px;position:relative;z-index:3}
.hud-row1{display:flex;align-items:center;gap:10px}
.hud-day{font-size:14px;font-weight:900;line-height:1.15}
.hud-day small{display:block;font-size:11px;color:var(--ink2);font-weight:500}
.hud-city{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;background:var(--orange-soft);color:var(--orange-deep);padding:4px 10px;border-radius:999px}
.hud-weather{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.hud-spacer{flex:1}
.hud-time{font-size:12px;font-weight:700;color:var(--teal-deep)}
.hud-menu{flex:0 0 auto;width:34px;height:34px;border-radius:11px;border:2px solid #e2e8f0;background:#fff;color:var(--ink);font-size:17px;font-weight:900;line-height:1;padding:0;cursor:pointer;box-shadow:0 2px 6px rgba(15,23,42,.08);transition:transform .08s}
.hud-menu:active{transform:scale(.92)}
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.stat{position:relative}
.stat .st-label{display:flex;justify-content:space-between;font-size:10px;color:var(--ink2);font-weight:700;line-height:1.3}
.stat .st-val{font-variant-numeric:tabular-nums}
.st-track{height:7px;border-radius:999px;background:#eef2f7;margin-top:2px;overflow:hidden}
.st-track i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.3,.8,.3,1),background .3s}
.st-money .st-track{display:none}
.st-money .st-label{justify-content:center;font-size:11px}
.st-money .st-val{font-size:15px;color:var(--green);font-weight:900}
.st-money.neg .st-val{color:var(--red)}
#floatLayer{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.float-num{position:absolute;font-size:13px;font-weight:900;white-space:nowrap;text-shadow:0 1px 2px rgba(255,255,255,.9);animation:floatUp 1.5s ease-out forwards}
@keyframes floatUp{0%{transform:translateY(4px);opacity:0}15%{opacity:1;100%{transform:translateY(-34px);opacity:0}}}

/* 动作区 */
.action-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 12px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:900;margin:4px 2px 9px;color:var(--ink)}
.sec-title::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,#e2e8f0 0 6px,transparent 6px 12px)}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.act-card{position:relative;background:var(--card);border-radius:15px;padding:11px 11px 9px;box-shadow:var(--shadow-sm);text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .12s;overflow:hidden}
.act-card:active:not(:disabled){transform:scale(.97)}
.act-card:disabled{opacity=.5;filter:grayscale(.6)}
.act-card.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.act-head{display:flex;align-items:center;gap:7px}
.act-emoji{font-size:26px}
.act-name{font-size:14px;font-weight:900;line-height:1.25}
.act-desc{font-size:11px;color:var(--ink2);line-height:1.35;min-height:29px}
.act-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.act-chips .chip{font-size:10.5px;padding:1px 7px}
.hand{padding:6px 12px calc(8px + var(--safe-b));background:linear-gradient(180deg,rgba(255,248,239,0),#ffedd5 60%);border-top:1px dashed #fdba74}
.hand-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.hand-scroll::-webkit-scrollbar{display:none}
.hand-label{font-size:11px;font-weight:700;color:var(--orange-deep);margin-bottom:2px;display:flex;justify-content:space-between}
.card-item{flex:0 0 118px;background:linear-gradient(160deg,#fff,#fff7ed);border:2px solid #fdba74;border-radius:13px;padding:8px 9px;box-shadow:var(--shadow-sm);text-align:left;transition:transform .12s}
.card-item:active{transform:scale(.95)}
.card-item.used{opacity:.4;border-style:dashed}
.card-item .ci-emoji{font-size:20px}
.card-item .ci-name{font-size:12.5px;font-weight:900;margin-top:1px}
.card-item .ci-desc{font-size:10px;color:var(--ink2);line-height:1.3;margin-top:2px}
.card-item .ci-mode{font-size:9.5px;font-weight:900;color:var(--purple);margin-top:3px}
.card-item.passive .ci-mode{color:var(--teal-deep)}
.day-end-row{display:flex;gap:8px;margin-top:10px}
.day-end-row .btn{flex:1;padding:12px;font-size:14px}

/* ============ 弹窗 ============ */
#modalMask{position:fixed;inset:0;z-index:30;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;pointer-events:none;transition:opacity .25s}
#modalMask.show{opacity:1;pointer-events:auto}
#modalBox{background:var(--card);border-radius:22px;width:100%;max-width:440px;max-height:86vh;overflow-y:auto;
  padding:22px 20px calc(18px + var(--safe-b));box-shadow:var(--shadow);transform:scale(.85) translateY(20px);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
#modalMask.show #modalBox{transform:scale(1) translateY(0)}
.mb-emoji{font-size:46px;text-align:center}
.mb-title{font-size:21px;font-weight:900;text-align:center;margin-top:6px}
.mb-desc{font-size:14px;color:var(--ink2);line-height:1.65;margin-top:9px;text-align:center}
.mb-result{margin-top:12px;border-radius:14px;padding:11px 14px;font-size:13.5px;font-weight:700;text-align:center;background:#f8fafc}
.mb-opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.mb-opt{background:#fff;border:2px solid #e2e8f0;border-radius:14px;padding:13px 15px;text-align:left;transition:transform .12s,border-color .15s}
.mb-opt:active{transform:scale(.98)}
.mb-opt.sel{border-color:var(--orange);background:#fff7ed}
.mb-opt .mo-label{font-size:15px;font-weight:900;display:flex;align-items:center;gap:7px}
.mb-opt .mo-hint{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.4}
.mb-opt .mo-chips{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px}
.mb-btns{display:flex;gap:9px;margin-top:16px}
.mb-btns .btn{flex:1}
.mb-stat-row{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:10px}

/* 老板审批等待动画 */
.boss-emoji{font-size:62px;text-align:center;animation:bossSigh 1.6s ease-in-out infinite}
@keyframes bossSigh{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-4deg)}}
.boss-dots{text-align:center;font-size:30px;font-weight:900;letter-spacing:5px;color:var(--orange-deep);margin-top:4px}
.boss-dots span{display:inline-block;animation:dotBlink 1.2s infinite}
.boss-dots span:nth-child(2){animation-delay:.2s}
.boss-dots span:nth-child(3){animation-delay:.4s}
@keyframes dotBlink{0%,100%{opacity:.2}50%{opacity:1}}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(16% + var(--safe-b));transform:translate(-50%,20px);z-index:40;
  background:rgba(31,42,68,.92);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* 发牌弹窗 */
.deal-row{display:flex;gap:10px;margin-top:16px}
.deal-card{flex:1;background:#fff;border:2px solid #e2e8f0;border-radius:15px;padding:14px 10px;text-align:center;transition:transform .12s,border-color .15s}
.deal-card:active{transform:scale(.96)}
.deal-card.sel{border-color:var(--orange);background:#fff7ed}
.deal-card .dc-emoji{font-size:34px}

/* ============================================================
 * 3. 3D 引擎：单渲染器 / 单 rAF / deltaTime / 资源缓存 / 粒子池
 * ============================================================ */
const TD = (function(){
  const T = window.THREE;
  if(!T) return {available:false};
  const DPR = Math.min(window.devicePixelRatio || 1, 1.6);

  /* ---------- 几何体 / 材质缓存（全游戏共享，不随场景销毁） ---------- */
  const GEO = {
    box: new T.BoxGeometry(1,1,1),
    cyl: new T.CylinderGeometry(1,1,1,10),
    cyl8: new T.CylinderGeometry(1,1,1,8),
    cone: new T.ConeGeometry(1,1,10),
    sph: new T.SphereGeometry(1,12,9),
    plane: new T.PlaneGeometry(1,1),
    torus: new T.TorusGeometry(1,.18,8,18),
    ground: new T.CircleGeometry(15,30)
  };
  const lambert = {}, basic = {};
  function mL(hex){ return lambert[hex] || (lambert[hex] = new T.MeshLambertMaterial({color:hex})); }
  function mB(hex, opacity){
    const key = hex + "_" + (opacity===undefined?1:opacity);
    if(basic[key]) return basic[key];
    const m = new T.MeshBasicMaterial({color:hex, transparent:opacity!==undefined && opacity<1, opacity:opacity===undefined?1:opacity});
    return basic[key] = m;
  }
  function mk(geo, mat, x,y,z, sx,sy,sz, rx,ry,rz){
    const m = new T.Mesh(geo, mat);
    if(x!==undefined) m.position.set(x,y,z);
    if(sx!==undefined) m.scale.set(sx,sy,sz);
    if(rx||ry||rz) m.rotation.set(rx||0,ry||0,rz||0);
    return m;
  }
  const B = (hex,x,y,z,sx,sy,sz,rx,ry,rz)=>mk(GEO.box,mL(hex),x,y,z,sx,sy,sz,rx,ry,rz);
  const C = (hex,x,y,z,rxh,h,sz3)=>mk(GEO.cyl,mL(hex),x,y,z,rxh,h,sz3); // 圆柱：x,y,z,半径,高,zScale
  const CN = (hex,x,y,z,r,h,rz)=>mk(GEO.cone,mL(hex),x,y,z,r,h,1,0,0,rz);
  const S = (hex,x,y,z,r)=>mk(GEO.sph,mL(hex),x,y,z,r,r,r);
  const BB = (hex,x,y,z,sx,sy,sz,op)=>mk(GEO.box,mB(hex,op),x,y,z,sx,sy,sz); // 自发光小盒（灯/窗）

  /* ---------- emoji 贴图 / 精灵 ---------- */
  const texCache = {};
  function emojiTex(emoji){
    if(texCache[emoji]) return texCache[emoji];
    const cv = document.createElement("canvas"); cv.width = cv.height = 128;
    const x = cv.getContext("2d");
    x.font = "96px serif"; x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText(emoji, 64, 72);
    const tx = new T.CanvasTexture(cv); tx.encoding = T.sRGBEncoding;
    texCache[emoji] = tx; return tx;
  }
  function emojiMesh(emoji, s){
    const m = new T.Sprite(new T.SpriteMaterial({map:emojiTex(emoji),transparent:true,depthWrite:false}));
    m.scale.set(s,s,1); return m;
  }

  /* ---------- 渲染器 / 相机 ---------- */
  let renderer = null, surface = null, rafId = 0, last = 0, time = 0;
  let gameScene=null, cam=null, groundMat=null, cityGroup=null, actorsGroup=null, propsGroup=null, train=null, plane=null, clouds=[], actors=[];
  let homeScene=null, homeCam=null, homePlatform=null, homeTrain=null;
  const DAY_SKY = 0xa9d8f0, DUSK_SKY = 0x2a3a66, NIGHT_SKY = 0x141b33, SUNSET_SKY = 0xe87a4e;
  const camPos = new T.Vector3(0,2.1,6.4), camLook = new T.Vector3(0,1.1,0);
  const tV1 = new T.Vector3(), tV2 = new T.Vector3(), tCol = new T.Color();

  function ensureRenderer(){
    if(renderer) return;
    renderer = new T.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
    renderer.setPixelRatio(DPR);
    renderer.outputEncoding = T.sRGBEncoding;
    renderer.domElement.style.display = "block";
    document.addEventListener("visibilitychange", ()=>{ last = performance.now(); });
    last = performance.now();
    rafId = requestAnimationFrame(loop);
  }
  function resizeTo(el){
    if(!renderer || !el) return;
    const w = el.clientWidth || 360, h = el.clientHeight || 300;
    renderer.setSize(w, h, false);
    const a = w / h;
    if(cam){ cam.aspect = a; cam.updateProjectionMatrix(); }
    if(homeCam){ homeCam.aspect = a; homeCam.updateProjectionMatrix(); }
  }

  /* ---------- 粒子池（零分配热路径） ---------- */
  const BIT_N = 56, bitPool = [], bitGeo = new T.BoxGeometry(.12,.12,.12);
  const EMO_N = 18, emoPool = [];
  for(let i=0;i<BIT_N;i++){
    const m = new T.Mesh(bitGeo, mB(0xffffff)); m.visible = false;
    bitPool.push({m, vx:0,vy:0,vz:0,life:0,max:1,grav:5,rot:0,rs:0});
  }
  for(let i=0;i<EMO_N;i++){
    const m = new T.Sprite(new T.SpriteMaterial({map:emojiTex("✨"),transparent:true,depthWrite:false}));
    m.visible = false;
    emoPool.push({m,vx:0,vy:0,vz:0,life:0,max:1,grav:2});
  }
  function spawnBit(px,py,pz,hex,count,opt){
    opt = opt || {};
    let n = 0;
    for(let i=0;i<BIT_N && n<count;i++){
      const p = bitPool[i]; if(p.life>0) continue;
      p.m.material = mB(hex);
      p.m.visible = true; p.m.position.set(px,py,pz);
      const s = (opt.size||1)*(0.7+Math.random()*0.6);
      p.m.scale.setScalar(s);
      const sp = opt.spread||2.2;
      p.vx=(Math.random()-.5)*sp; p.vy=Math.random()*(opt.up||3)+.6; p.vz=(Math.random()-.5)*sp;
      p.max = p.life = (opt.life||1)*(0.7+Math.random()*.6);
      p.grav = opt.grav===undefined?5:opt.grav;
      p.rs = (Math.random()-.5)*6;
      n++;
    }
  }
  function spawnEmoji(px,py,pz,emo,count,opt){
    opt = opt || {};
    let n = 0;
    for(let i=0;i<EMO_N && n<count;i++){
      const p = emoPool[i]; if(p.life>0) continue;
      p.m.material.map = emojiTex(emo); p.m.material.needsUpdate = true;
      const s = opt.size||.5; p.m.scale.set(s,s,1);
      p.m.visible = true; p.m.position.set(px,py,pz);
      const sp = opt.spread||1.2;
      p.vx=(Math.random()-.5)*sp; p.vy=Math.random()*(opt.up||2)+.5; p.vz=(Math.random()-.5)*sp;

  function updateFx(dt){
    for(let i=0;i<BIT_N;i++){
      const p = bitPool[i]; if(p.life<=0) continue;
      p.life -= dt;
      if(p.life<=0){ p.m.visible=false; continue; }
      p.vy -= p.grav*dt;
      p.m.position.x += p.vx*dt; p.m.position.y += p.vy*dt; p.m.position.z += p.vz*dt;
      p.m.rotation.x += p.rs*dt; p.m.rotation.y += p.rs*.7*dt;
    }
    for(let i=0;i<EMO_N;i++){
      const p = emoPool[i]; if(p.life<=0) continue;
      p.life -= dt;
      if(p.life<=0){ p.m.visible=false; continue; }
      p.vy -= p.grav*dt;
      p.m.position.x += p.vx*dt; p.m.position.y += p.vy*dt; p.m.position.z += p.vz*dt;
    }
  }

  /* 年龄修饰器：在基础姿势之上叠加老人/小孩的动作特征 */

    };

  /* ---------- 场景挂载 ---------- */
  let resizeRO=null;
  function watchResize(el){
    if(resizeRO){ resizeRO.disconnect(); resizeRO=null; }
    if(typeof ResizeObserver==="undefined") return;
    // 容器尺寸变化（转屏、浏览器地址栏收缩、初始布局延迟）时自动重设缓冲，避免舞台底部留空

  /* ---------- 过场导演 ---------- */
  let cut = null;
  const ctx = {
    k:0,e:0,dt:0,t:0,state:null,
    actors:null, train:null, plane:null,
    T:T, B,C,CN,S,BB,mk,GEO,mL,mB,emoji:emojiMesh,
    V:new T.Vector3(),
    burst:spawnBit, eburst:spawnEmoji,
    flash(){ flashStage(); },
    sky:setSky, DAY_SKY,DUSK_SKY,NIGHT_SKY,SUNSET_SKY,
    lineUp:lineActors,
    cam(x,y,z,lx,ly,lz,j){ camPos.set(x,y,z); camLook.set(lx,ly,lz); handJ=j||0; },
    props:null, city:null,
    pose:Pose
  };
  let handJ = 0;
  const cineWrap = document.getElementById("stageWrap");
  const cineSub = document.getElementById("cineSub");
  const cineBar = document.getElementById("cineBar");
  let fast = false;
  function beginCine(def){
    cineWrap.classList.add("cine");
    cineSub.querySelector(".cs-emoji").textContent = def.emoji||"🎬";
    cineSub.querySelector(".cs-text").textContent = def.title||"";
    cineSub.querySelector(".cs-city").textContent = def.tag ? ("· "+def.tag) : "";
    cineBar.style.transition = "none"; cineBar.style.width = "0%";
    void cineBar.offsetWidth;
    cineBar.style.transition = "";
  }
  function endCine(){ cineWrap.classList.remove("cine"); }
  function flashStage(){
    const f = document.getElementById("stageFlash");
    f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  }
  function clearProps(){
    while(propsGroup.children.length){ const ch=propsGroup.children[0]; propsGroup.remove(ch); }
    train.visible=false; plane.visible=false;
  }
  function play(def){
    return new Promise(function(resolve){
      if(cut && cut.resolve){ try{cut.def.exit && cut.def.exit(ctx);}catch(e){} cut.resolve(); }
      actors.forEach(resetActor);
      lineActors(1.15,.62);
      setSky(DAY_SKY);
      clearProps();
      ctx.props = propsGroup; ctx.city = cityGroup; ctx.actors = actors; ctx.train = train; ctx.plane = plane;
      ctx.state = {}; ctx.t = 0; ctx.k = 0; ctx.e = 0;
      cut = {def:def, p:0, dur:(def.dur||3.4)/(fast?3.4:1), resolve:resolve};
      beginCine(def);
      try{ def.enter && def.enter(ctx); }catch(e){ console.warn("cut enter",e); }
    });
  }
  function skip(){
    if(!cut) return;
    const c = cut; cut = null;
    ctx.k = 1; ctx.e = 1;
    try{ c.def.update && c.def.update(ctx, 1/60); }catch(e){}
    try{ c.def.exit && c.def.exit(ctx); }catch(e){}
    clearProps(); actors.forEach(resetActor); lineActors(1.15,.62); setSky(DAY_SKY);
    cineBar.style.width="100%";
    setTimeout(function(){ endCine(); c.resolve(); }, 60);
  }
  function setFast(v){
    fast = v;
    if(cut) cut.dur = (cut.def.dur||3.4)/(fast?3.4:1);
  }
  function isPlaying(){ return !!cut; }

  /* ---------- 主循环 ---------- */
  function loop(now){
    rafId = requestAnimationFrame(loop);
    let dt = (now - last)/1000; last = now;
    if(dt<=0) dt = .016; if(dt>.05) dt = .05;
    time += dt;
    updateFx(dt);
    if(surface==="home" && homeScene){
      homePlatform.rotation.y += dt*.12;
      const a = time*.45;
      homeTrain.position.set(Math.sin(a)*3.35, .05, Math.cos(a)*3.35);
      homeTrain.rotation.y = -a + Math.PI/2;
      homeTrain.position.y = .05 + Math.sin(time*3)*.03;
      for(const cl of homeScene.children){ if(cl.children && cl.children.length===3 && cl.children[0].geometry===GEO.sph){ cl.position.x += dt*.35; if(cl.position.x>7)cl.position.x=-7; } }
      renderer.render(homeScene, homeCam);
    }else if(surface==="game" && gameScene){
      // 云漂移
      for(const cl of clouds){ cl.position.x += dt*.25; if(cl.position.x>6.5) cl.position.x=-6.5; }
      if(cut){
        const c = cut;
        c.p += dt / c.dur;
        if(c.p>=1){ c.p=1; }
        ctx.k = c.p;
        ctx.e = c.p<.5 ? 2*c.p*c.p : 1-Math.pow(-2*c.p+2,2)/2; // easeInOutQuad
        ctx.dt = dt; ctx.t = time;
        try{ c.def.update && c.def.update(ctx, dt); }catch(e){ console.warn("cut update",e); }
        cineBar.style.width = (c.p*100).toFixed(1)+"%";
        if(c.p>=1){
          cut = null;
          try{ c.def.exit && c.def.exit(ctx); }catch(e){}
          clearProps(); actors.forEach(resetActor); lineActors(1.15,.62); setSky(DAY_SKY);
          endCine(); c.resolve();
        }
      }else{
        for(let i=0;i<actors.length;i++) Pose.idle(actors[i], time + i*.7);
        const ang = .12 + Math.sin(time*.13)*.1;
        camPos.set(Math.sin(ang)*.9, 2.05+Math.sin(time*.3)*.06, 6.4);
        camLook.set(0,1.05,0);
      }
      // 手持微抖 + 应用相机
      cam.position.copy(camPos);
      if(handJ>0){ cam.position.x += (Math.random()-.5)*handJ; cam.position.y += (Math.random()-.5)*handJ; }
      cam.lookAt(camLook);
      renderer.render(gameScene, cam);
    }
  }

  window.addEventListener("resize", function(){
    if(surface==="home") resizeTo(document.getElementById("home3d"));
    if(surface==="game") resizeTo(document.getElementById("stage3d"));
  });

  return {
    available:true, attachHome, attachGame, setCity, setActors,
    play, skip, setFast, isPlaying, flash:flashStage,
    resetView(){ camPos.set(0,2.1,6.4); camLook.set(0,1.1,0); handJ=0; }
  };
})();

/* ============================================================
 * 4. 过场场景库：每个动作 / 交通 / 事件结果都有一段 3D 小电影
 * ============================================================ */
const seg = (k,a,b)=> k<=a?0 : k>=b?1 : (k-a)/(b-a);
const easeOut = t => 1-Math.pow(1-t,3);
const easeIn = t => t*t*t;
const STEAM_OPT = {up:.5,spread:.28,life:.9,grav:-.5,size:.45};

function tableProp(ctx, color, w, z){
  const p = ctx.props;
  p.add(ctx.B(color, 0,.5,z, w,.09,.85));
  p.add(ctx.B(0x6b4a2f, -w*.42,.24,z-.32,.07,.5,.07));
  p.add(ctx.B(0x6b4a2f,  w*.42,.24,z-.32,.07,.5,.07));
  p.add(ctx.B(0x6b4a2f, -w*.42,.24,z+.32,.07,.5,.07));
  p.add(ctx.B(0x6b4a2f,  w*.42,.24,z+.32,.07,.5,.07));
}
/* ===== 舞台走位原语（观众席视角：正面朝观众 + 左右侧台横向行进） =====
   关键：观众机位始终在舞台前方；横向行进时演员转成侧影、沿舞台前沿横走，
   全队等距排成一条平行于屏幕的线，任何人数都不会互相遮挡或近大远小。 */
const STAGE_GAP = .5;
/* 横向列队：队形中心在 (cx,z)，沿 X 等距排开 */
function sideLine(c, z, cx, gap){
  const n=c.actors.length, g=gap||STAGE_GAP;
  for(let i=0;i<n;i++){
    const a=c.actors[i];
    a.g.position.set(cx+(i-(n-1)/2)*g, 0, z);
  }
}
/* 横向行进：队形整体走到 (cx,z)，全员朝行进方向侧身，走姿 */
function walkX(c, cx, z, dir, speed, gap){
  const n=c.actors.length, g=gap||STAGE_GAP;
  for(let i=0;i<n;i++){
    const a=c.actors[i];
    a.g.position.x = cx+(i-(n-1)/2)*g;
    a.g.position.z = z; a.g.position.y = 0;
    // 3/4 侧身而非纯 90°：保留横向行进感，同时观众始终看得到脸
    a.g.rotation.y = dir>0 ? 1.1 : -1.1;
    c.pose.walk(a, c.t+i*.5, speed||3);
  }
}
/* 正面定位：队形居中、面向观众 */
function frontAt(c, z, gap){
  const n=c.actors.length, g=gap||STAGE_GAP;
  for(let i=0;i<n;i++){
    const a=c.actors[i];
    a.g.position.set((i-(n-1)/2)*g, 0, z);
    a.g.rotation.y = 0;
  }
}

/* ---------- 美食 ---------- */
function foodScene(emo, hot, special){
  return {
    dur: hot?4.0:3.4, emoji: hot?"🍲":"🍜", title:"干饭时间到！",
    fb:{main:emo, prop:"💨", y:"26%"},
    enter(c){
      tableProp(c, hot?0xa83232:(special==="fine"?0xe8e2d4:0x9c6b3f), hot?1.9:1.5, .25);
      const food = c.emoji(emo, hot?1.15:1.0); food.position.set(0,.72,.25); c.props.add(food); c.state.food=food;
      if(hot){
        c.props.add(c.C(0xc0392b,0,.6,.25,.42,.22,1));
      }
      if(special==="fine"){
        const k=c.emoji("🕯️",.3); k.position.set(.6,.78,.25); c.props.add(k);
        const k2=c.emoji("🕯️",.3); k2.position.set(-.6,.78,.25); c.props.add(k2);
      }
      sideLine(c,-.5,-3);
      c.state.sT=0;
    },
    update(c,dt){
      const k=c.k;
      if(k<.2){
        walkX(c, lerp(-3,0,easeOut(seg(k,0,.2))), -.5, 1, 3.2);
      }else if(k<.85){
        frontAt(c,-.5);
        for(let i=0;i<c.actors.length;i++){
          const ac=c.actors[i];
          if(special==="fine"){ ac.pv.rotation.x = .08; c.pose.eat(ac,c.t*0.7+i); }
          else c.pose.eat(ac,c.t+i*.6);
        }
        c.state.sT += dt;
        if(c.state.sT>.16){ c.state.sT=0;
          c.burst((Math.random()-.5)*1.1,.82,.25, hot?0xffd0a0:0xffffff,2,STEAM_OPT);
        }
        if(c.state.food) c.state.food.position.y = .72 + Math.sin(c.t*5)*.03;
      }else{
        for(let i=0;i<c.actors.length;i++) c.pose.cheer(c.actors[i],c.t+i*.4);
        if(!c.state.celeb){ c.state.celeb=1;
          c.burst(0,1.5,-.3,0xfbbf24,18,{up:4,spread:3,life:1.1});
          c.eburst(0,1.4,-.2,"😋",c.actors.length,{up:2.2,life:1.3,grav:1.5,size:.5});
        }
      }
      const t = seg(k,.2,.85);
      if(special==="fine"){
        c.cam(Math.sin(k*1.4)*.55,1.75,4.7, 0,1.0,-.3);
      }else{
        c.cam(0, lerp(2.0,1.72,t), lerp(5.6,4.5,t), 0,1.0,-.25);
      }
    }
  };
}

/* ---------- 景点 ---------- */
function spotGeneric(emo){
  return {
    dur:3.6, emoji:"⭐", title:"打卡名场面",
    fb:{main:emo,prop:"📸"},
    enter(c){
      // 从舞台左侧候场
      sideLine(c,.6,-3.2);
    },
    update(c){
      const k=c.k;
      if(k<.5){
        // 横向侧台：演员以侧影从左走到舞台中央，观众机位只做轻微平移
        const t=easeOut(seg(k,.05,.5));
        walkX(c, lerp(-3.2,.1,t), .6, 1, 3.4);
        c.cam(lerp(-.8,.8,t),1.8,4.5, 0,1.15,-.3);
      }else if(k<.62){
        // 小步走向地标，同时侧身回望（只转 3/4，不给背影）
        const t=easeOut(seg(k,.5,.62));
        for(let i=0;i<c.actors.length;i++){
          const ac=c.actors[i];
          ac.g.position.x = .1+(i-(c.actors.length-1)/2)*STAGE_GAP;
          ac.g.position.z = lerp(.6,-.1,t);
          ac.g.rotation.y = lerp(1.1,1.15,t);
          if(t<1) c.pose.walk(ac,c.t+i*.5,2);
        }
        c.cam(.8,1.7,4.2, 0,1.5,-1.2);
      }else if(k<.88){
        // 侧身仰望地标 + 闪光定格，观众仍看得到脸
        for(let i=0;i<c.actors.length;i++){
          const ac=c.actors[i];
          ac.g.position.x = .1+(i-(c.actors.length-1)/2)*STAGE_GAP;
          ac.g.position.z = -.1; ac.g.rotation.y = 1.15;
          c.pose.look(ac,c.t+i);
        }
        if(!c.state.fl){ c.state.fl=1; c.flash(); c.burst(0,1.7,-.6,0xffe08a,14,{up:3.4,spread:2.4,life:1}); }
        c.cam(.8,1.7,4.2, 0,1.5,-1.2);
      }else{
        // 转身面向观众，正面欢呼收尾
        frontAt(c,.7);
        for(let i=0;i<c.actors.length;i++) c.pose.cheer(c.actors[i],c.t+i*.4);
        if(!c.state.fl2){ c.state.fl2=1; c.flash(); c.burst(0,1.7,.5,0xffe08a,12,{up:3.2,spread:2.4,life:1}); }
        c.cam(0,1.7,4.7, 0,1.2,.4);
      }
    }
  };
}
function parkScene(){
  return {dur:3.4,emoji:"🌳",title:"慢下来，发个呆",fb:{main:"🌳",prop:"🍂"},
    enter(c){
      c.props.add(c.B(0x8a5a33,0,.32,.4,1.7,.1,.5));
      c.props.add(c.B(0x7a4f2c,-.75,.55,.4,.08,.55,.08)); c.props.add(c.B(0x7a4f2c,.75,.55,.4,.08,.55,.08));
      sideLine(c,.55,-3);
    },
    update(c,dt){
      const k=c.k;
      if(k<.25) walkX(c, lerp(-3,0,easeOut(seg(k,0,.25))), .55, 1, 2.4);
      else{

        if(!c.state.p){c.state.p=1;
          const pic=c.emoji(pro?"🖼️":"📷",.8);pic.position.set(0,1.3,.5);c.props.add(pic);c.state.pic=pic;
          c.burst(0,1.5,.3,0xffd700,10,{up:2.6,spread:2,life:1});
        }
        if(c.state.pic){c.state.pic.position.y=1.3+seg(k,.85,1)*.5;c.state.pic.rotation.z=Math.sin(c.t*2)*.08;}
      }
      c.cam(0,1.8,4.8,0,1.2,.3);

  };
}

/* ---------- 交通 ---------- */
function travelScene(tt, toKey, returning){
  const tag = returning ? "返程回家" : CITIES[toKey].name+" 我来了";
  const base = {
    train:{dur:4.2,emoji:"🚄",title:returning?"踏上归途":"高铁出发！",fb:{main:"🚄",prop:"🧳"}},
    plane:{dur:4.0,emoji:"✈️",title:returning?"航班回家":"冲上云霄",fb:{main:"✈️",prop:"☁️"}},
    car:{dur:3.8,emoji:"🚗",title:returning?"自驾回家":"出发，下一站",fb:{main:"🚗",prop:"🛣️"}},
    bus:{dur:3.8,emoji:"🚌",title:returning?"大巴回家":"晃晃悠悠出发",fb:{main:"🚌",prop:"🎒"}}
  }[tt];
  const def = Object.assign({}, base, {tag:tag});
  if(tt==="train"){
    def.enter=function(c){
      c.train.visible=true; c.train.position.set(8,.02,-.9);
      // 站在台前等车（收窄横排，避免竖屏出界），侧身朝右等车
      sideLine(c,.5,-.15,.36);
      for(const ac of c.actors) ac.g.rotation.y=1.1;
      c.state.swapped=false;
    };
    def.update=function(c){
      const k=c.k;
      if(!returning){
        if(k<.22){
          // 列车从右侧进站，全员侧身目送
          const t=easeOut(seg(k,0,.22)); c.train.position.x=lerp(8,-.5,t);
          for(let i=0;i<c.actors.length;i++){const ac=c.actors[i];ac.g.rotation.y=1.1;c.pose.idle(ac,c.t+i);}
        }else if(k<.42){
          // 横向登车：侧影朝右走到车门口依次消失
          const t=easeOut(seg(k,.22,.42));
          walkX(c, lerp(-.15,.45,t), .5, 1, 3, .36);
          for(let i=0;i<c.actors.length;i++){ if(k>.3+i*.025) c.actors[i].g.visible=false; }
        }else if(k<.5){
          c.train.position.x=-.5;
        }else if(k<.8){
          // 列车向左驶离，中途换城
          if(!c.state.swapped){c.state.swapped=1;Stage.setCity(toKey);}
          const t=easeIn(seg(k,.5,.8)); c.train.position.x=lerp(-.5,-8,t);
        }else if(k<.93){
          // 到站：从车旁侧影走回舞台中央
          c.train.visible=false;
          const t=easeOut(seg(k,.8,.93));
          walkX(c, lerp(.45,-.05,t), .9, -1, 2.6, .34);
          for(let i=0;i<c.actors.length;i++){ c.actors[i].g.visible = (k>.8+i*.02); }
        }else{
          // 转身面向观众欢呼
          frontAt(c,1.35,.4);
          for(let i=0;i<c.actors.length;i++){const ac=c.actors[i];ac.g.visible=true;c.pose.cheer(ac,c.t+i);}
          if(!c.state.w){c.state.w=1;c.burst(0,1.7,.8,0xffe08a,14,{up:3,spread:2.4,life:1.1});}
        }
        c.cam(.3,1.75,5.8,0,1,-.4,.012);
      }else{
        // 返程：列车靠站 → 侧身目送 → 横向登车 → 驶离 + 晚霞
        c.sky(cLerp(0xa9d8f0,0xe87a4e,seg(k,.3,.95)));
        if(k<.2){ const t=easeOut(seg(k,0,.2)); c.train.position.x=lerp(8,-.5,t);
          for(let i=0;i<c.actors.length;i++){const ac=c.actors[i];ac.g.rotation.y=1.1;c.pose.idle(ac,c.t+i);}
        }else if(k<.42){ const t=easeOut(seg(k,.2,.42));
          walkX(c, lerp(-.15,.45,t), .5, 1, 3, .36);
          for(let i=0;i<c.actors.length;i++){if(k>.3+i*.02)c.actors[i].g.visible=false;}
        }else if(k<.8){ c.train.position.x=lerp(-.5,-8,easeIn(seg(k,.42,.8)));
        }else{
          // 到家：列车消失，全员正面朝观众挥手
          c.train.visible=false;
          frontAt(c,1.35,.4);
          for(let i=0;i<c.actors.length;i++){const ac=c.actors[i];ac.g.visible=true;c.pose.wave(ac,c.t+i);}
        }
        if(!c.state.f&&k>.85){c.state.f=1;c.eburst(1,2.6,-1,"🎆",3,{up:2.4,life:1.6,grav:.4,size:.6});c.burst(1,2.4,-1,0xffd700,14,{up:3.4,spread:1.6,life:1.4});}
        c.cam(.3,1.75,5.8,0,1,-.4,.01);
      }
    };
  }else if(tt==="plane"){
    def.enter=function(c){
      c.plane.visible=true; c.plane.scale.setScalar(1.1);
      for(const ac of c.actors)ac.g.position.z=1.2;
      c.lineUp(1.2,.6);
      c.state.swapped=false;
    };
    def.update=function(c){
      const k=c.k;
      if(!returning){
        if(k<.82){
          const t=seg(k,.08,.82);
          c.plane.position.set(lerp(-6,6,t),1.5+Math.sin(t*Math.PI)*2.6,-1.2);
          c.plane.rotation.z=Math.cos(t*Math.PI)*.25;
          c.plane.scale.setScalar(lerp(1.1,.65,t));
          if(t>.5&&!c.state.swapped){c.state.swapped=1;Stage.setCity(toKey);}
          // 正面朝观众，只随飞机位置微微 3/4 侧身仰望，脸始终看得到
          for(let i=0;i<c.actors.length;i++){const ac=c.actors[i];ac.g.rotation.y=Math.max(-.4,Math.min(.4,c.plane.position.x/6*.4));c.pose.look(ac,c.t+i);}
          if(Math.random()<c.dt*3)c.burst(c.plane.position.x,2.6,-1.2,0xffffff,1,{up:0,spread:.4,life:1,grav:0,size:.4});
        }else{
          c.plane.visible=false;
          frontAt(c,1.2,.6);
          for(let i=0;i<c.actors.length;i++)c.pose.cheer(c.actors[i],c.t+i);
          if(!c.state.w){c.state.w=1;c.burst(0,1.6,.8,0x9ad8ff,14,{up:3,spread:2.4,life:1.1});}
        }
        c.cam(-1,2.1,5,0,1.6,-.6);
      }else{
        const t=seg(k,.1,.9);
        c.plane.position.set(lerp(6,-6,t),1.4+Math.sin(t*Math.PI)*2.4,-1.2);
        c.plane.scale.setScalar(lerp(.7,1.1,t));
        c.sky(cLerp(0xa9d8f0,0xe87a4e,seg(k,.3,1)));
        // 返程：正面朝观众挥手目送
        for(let i=0;i<c.actors.length;i++){const ac=c.actors[i];ac.g.rotation.y=0;c.pose.wave(ac,c.t+i);}
        c.cam(1,2.1,5,0,1.6,-.6);
      }
    };
  }else{
    const carColor = tt==="bus"?0xf2c03a:0xd94a3a;
    def.enter=function(c){
      const v=new c.T.Group();
      if(tt==="bus"){
        v.add(c.B(carColor,0,.55,0,2.1,1,.85)); v.add(c.B(0xbfe4ff,0,.85,.05,1.8,.35,.9));
      }else{
        v.add(c.B(carColor,0,.4,0,1.5,.5,.7)); v.add(c.B(0x9ad8ff,-.15,.72,0,.9,.4,.72));
      }
      v.add(c.C(0x222222,-.55,.15,.4,.16,.12,.16)); v.add(c.C(0x222222,.55,.15,.4,.16,.12,.16));
      v.add(c.C(0x222222,-.55,.15,-.4,.16,.12,.16)); v.add(c.C(0x222222,.55,.15,-.4,.16,.12,.16));
      v.position.set(returning?6:-6,0,0); c.props.add(v); c.state.veh=v;
      c.props.add(c.B(0x4a4a52,0,.01,0,12,.03,1.4));
      c.state.dashes=[];
      for(let i=0;i<4;i++){ const d=c.BB(0xffe08a,-4+i*2.2,.04,0,.8,.04,.08); c.props.add(d); c.state.dashes.push(d); }
      // 台前偏左列队，侧身朝右等车
      sideLine(c,.6,-1.2);
      for(const ac of c.actors) ac.g.rotation.y=1.1;
      c.state.swapped=false;
    };
    def.update=function(c,dt){
      const k=c.k, v=c.state.veh;
      if(!returning){
        if(k<.2){
          // 车从左侧驶入，全员侧身目送
          const t=easeOut(seg(k,0,.2)); v.position.x=lerp(-6,.85,t);
          for(let i=0;i<c.actors.length;i++){const ac=c.actors[i];ac.g.rotation.y=1.1;c.pose.idle(ac,c.t+i);}
        }else if(k<.38){
          // 横向登车：侧影朝右走到车门依次消失
          const t=easeOut(seg(k,.2,.38));
          walkX(c, lerp(-1.2,.65,t), .6, 1, 3);
          for(let i=0;i<c.actors.length;i++){if(k>.27+i*.02)c.actors[i].g.visible=false;}
        }else if(k<.8){
          // 沿横向公路向右驶离，路面虚线反向流动
          const t=seg(k,.38,.8); v.position.x=lerp(.85,6,t);
          v.position.y=Math.sin(c.t*10)*.02;
          for(const d of c.state.dashes){ d.position.x -= dt*6; if(d.position.x<-5)d.position.x=4.8; }
          if(!c.state.swapped&&t>.45){c.state.swapped=1;Stage.setCity(toKey);}
        }else{
          v.visible=false;
          frontAt(c,1.1);
          for(let i=0;i<c.actors.length;i++){const ac=c.actors[i];ac.g.visible=true;c.pose.cheer(ac,c.t+i);}
          if(!c.state.w){c.state.w=1;c.burst(0,1.5,.8,0xffe08a,12,{up:3,spread:2.2,life:1});}
        }
        c.cam(0,1.8,5.2,0,1.1,-.2, tt==="bus"?.03:.02);
      }else{
        // 返程：车从右侧来、向左驶离；演员正面朝观众挥手告别
        const t=seg(k,.1,.8); v.position.x=lerp(6,-6,easeInOut(t));
        v.position.y=Math.sin(c.t*9)*.02;
        for(const d of c.state.dashes){ d.position.x += dt*6; if(d.position.x>5)d.position.x=-4.8; }
        c.sky(cLerp(0xa9d8f0,0xe87a4e,seg(k,.3,1)));
        frontAt(c,1.1);
        for(const ac of c.actors) c.pose.wave(ac,c.t);
        c.cam(0,1.8,5.2,0,1.1,-.2,.02);
      }
    };
  }
  function easeInOut(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
  return def;
}

 * 5. 游戏逻辑层：状态 / 数值 / 事件 / 转城 / 手牌 / 结算

let G=null, busy=false;

/* ---------- 可存档 RNG（mulberry32，状态可序列化） ---------- */
function makeRng(seed){
  let a=seed>>>0;
  return {
    next(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; },
    state(){ return a>>>0; },
    set(v){ a=v>>>0; }
  };
}

/* ---------- 轻量音效（WebAudio 合成，零资源） ---------- */
const SFX=(function(){
  let acx=null; let on=(store.get(LS_SET,{}).sound!==false);
  function tone(f0,f1,d,vol,type){
    if(!on) return;
    try{
      acx=acx||new (window.AudioContext||window.webkitAudioContext)();
      if(acx.state==="suspended") acx.resume();
      const o=acx.createOscillator(), g=acx.createGain(), t=acx.currentTime;
      o.type=type||"sine"; o.frequency.setValueAtTime(f0,t);
      if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+d);
      g.gain.setValueAtTime(vol||.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g); g.connect(acx.destination); o.start(t); o.stop(t+d);
    }catch(e){}
  }
  return {
    tap(){ tone(440,540,.07,.035,"triangle"); },
    good(){ tone(523,784,.13,.06,"triangle"); },
    coin(){ tone(880,1320,.15,.055,"square"); },
    bad(){ tone(300,150,.18,.05,"sawtooth"); },
    get on(){ return on; },
    setOn(v){ on=v; }
  };
})();

/* ---------- 旅行背景音乐（WebAudio 合成：柔和垫乐 + 五声音阶风铃，循环播放，零资源） ---------- */
const BGM=(function(){
  let ctx=null, master=null, bus=null, timer=null, fadeTimer=null;
  let enabled=true, active=false, playing=false;
  let nextTime=0, chordIdx=0, beat=0;
  const voices=[];
  function track(oscs,stopAt){
    voices.push({oscs:oscs,stopAt:stopAt});
    if(voices.length>80) voices.splice(0,voices.length-80);
  }
  function prune(){
    const now=ctx?ctx.currentTime:0;
    for(let i=voices.length-1;i>=0;i--){ if(voices[i].stopAt<=now) voices.splice(i,1); }
  }
  function killVoices(){
    if(!ctx) return;
    const t=ctx.currentTime+.05;
    for(const v of voices){ v.oscs.forEach(function(o){ try{ o.stop(t); }catch(e){} }); }
    voices.length=0;
  }
  const BPM=64, BEAT=60/BPM, CHORD_BEATS=8, LOOK=0.35;
  // C - Am - F - G（经典温暖走向），MIDI 音高
  const CHORDS=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]];
  const BASS =[48,45,41,43];
  const PENTA=[60,62,64,67,69,72,74,76]; // C 大调五声音阶
  function mtof(m){ return 440*Math.pow(2,(m-69)/12); }
  function bell(midi,t,dur,vol){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.frequency.value=mtof(midi);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.03);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(bus);
    o.start(t); o.stop(t+dur+.05);
    track([o],t+dur+.1);
  }
  function bass(midi,t,dur){
    const o=ctx.createOscillator(), f=ctx.createBiquadFilter(), g=ctx.createGain();
    o.type="sine"; o.frequency.value=mtof(midi);
    f.type="lowpass"; f.frequency.value=500;
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.03,t+.4);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(f); f.connect(g); g.connect(bus);
    o.start(t); o.stop(t+dur+.05);
    track([o],t+dur+.1);
  }
  function pad(chord,t,dur){
    const oscs=[];
    chord.forEach(function(m){
      const g=ctx.createGain(), f=ctx.createBiquadFilter();
      f.type="lowpass"; f.frequency.value=1400; f.Q.value=.4;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.011,t+1.8);
      g.gain.setValueAtTime(.011,Math.max(t+.01,t+dur-1.8));
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      [-6,6].forEach(function(det,i){
        const o=ctx.createOscillator();
        o.type=i?"triangle":"sine";
        o.frequency.value=mtof(m); o.detune.value=det;
        o.connect(f); o.start(t); o.stop(t+dur+.1);
        oscs.push(o);
      });
      f.connect(g); g.connect(bus);
    });
    track(oscs,t+dur+.15);
  }
  function scheduleBeat(){
    const t=nextTime, dur=CHORD_BEATS*BEAT;
    if(beat===0){
      pad(CHORDS[chordIdx],t,dur);
      bass(BASS[chordIdx],t,dur*.92);
    }
    // 稀疏的五声音阶风铃：约一半的拍发声，弱拍偶尔休止，每小节末尾偶尔加高音点缀
    const r=Math.random();
    if(r<.55) bell(PENTA[Math.floor(Math.random()*PENTA.length)],t,1.6+Math.random()*1.2,.028+Math.random()*.012);
    else if(r<.63) bell(PENTA[PENTA.length-1-Math.floor(Math.random()*3)],t+BEAT*.5,1.4,.018);
    nextTime+=BEAT;
    beat++;
    if(beat>=CHORD_BEATS){ beat=0; chordIdx=(chordIdx+1)%CHORDS.length; }
  }
  function scheduler(){
    if(!ctx) return;
    prune();
    let guard=0;
    while(nextTime<ctx.currentTime+LOOK && guard++<64) scheduleBeat();
  }
  function start(){
    if(playing) return;
    try{
      if(!ctx){
        ctx=new (window.AudioContext||window.webkitAudioContext)();
        master=ctx.createGain(); master.gain.value=.6; master.connect(ctx.destination);
      }
      if(ctx.state==="suspended") ctx.resume();
      if(!bus){ bus=ctx.createGain(); bus.gain.value=.0001; bus.connect(master); }
      else { bus.gain.cancelScheduledValues(ctx.currentTime); }
      if(fadeTimer){ clearTimeout(fadeTimer); fadeTimer=null; }
      const t=ctx.currentTime;
      bus.gain.setValueAtTime(Math.max(.0001,bus.gain.value),t);
      bus.gain.exponentialRampToValueAtTime(1,t+2.4); // 淡入，避免突兀
      beat=0; chordIdx=0; nextTime=t+.08;
      playing=true;
      timer=setInterval(scheduler,40);
      scheduler();
    }catch(e){}
  }
  function stop(){
    if(!playing||!ctx) return;
    playing=false;
    clearInterval(timer); timer=null;
    const t=ctx.currentTime;
    bus.gain.cancelScheduledValues(t);
    bus.gain.setValueAtTime(Math.max(.0001,bus.gain.value),t);
    bus.gain.exponentialRampToValueAtTime(.0001,t+.9); // 淡出
    if(fadeTimer) clearTimeout(fadeTimer);
    fadeTimer=setTimeout(function(){ fadeTimer=null; killVoices(); },950);
  }
  function refresh(){
    if(enabled&&active) start(); else stop();
  }
  return {
    /* 进入旅行（开局/读档继续）：开始持续播放 */
    enter(){ active=true; refresh(); },
    /* 离开旅行（暂退首页/到达结算）：淡出停止 */
    leave(){ active=false; refresh(); },
    /* 跟随全局声音开关 */
    setEnabled(v){ enabled=(v!==false); refresh(); },
    /* 标签页重新可见时重同步（隐藏期间定时器被节流） */
    _resync(){ if(playing&&ctx&&nextTime<ctx.currentTime-.5){ nextTime=ctx.currentTime+.06; } },
    get playing(){ return playing; }
  };
})();

/* ---------- 开局状态 ---------- */
function newGame(modeIdx, compKey, seed){
  const mode=MODES[modeIdx], comp=COMPANIONS[compKey];
  seed = seed===undefined ? Math.floor(Math.random()*4294967296) : (seed>>>0);
  G={
    mode:mode.id, modeIdx, compKey, companion:compKey, seed, rng:makeRng(seed),
    day:1, totalDays:SHORT_DAYS, leaveAsked:false, bossApproved:false, hoursLeft:DAY_HOURS,
    money:mode.money+(comp.base-3000), startMoney:0,
    hp:comp.start.hp, energy:comp.start.en, stress:comp.start.st, memory:comp.start.me,
    city:null, visited:[],
    cards:[], uidSeq:1, flags:{}, globals:[],
    stats:{food:0,spot:0,rest:0,shop:0,fun:0,photo:0,moves:0,gambles:0,gambleWins:0,
      cardsGotten:0,transportSpent:0,actionsToday:0,maxStress:comp.start.st},
    eventIds:[], achs:[], finished:false, moveAsked:0, weather:"晴", tip7:false
  };
  G.startMoney=G.money;
}

/* ---------- 费用 / 数值 ---------- */
function costMul(){ return MODES[G.modeIdx].moneyMul * COMPANIONS[G.compKey].costMul; }
function actionCost(a){ return Math.round(a.cost*costMul()); }
function transportCost(t){ return Math.round(t.cost*costMul()); }
/* 最便宜的正规回家路费（绿皮站票兜底之外的安全线） */
function homeFare(){
  let m=Infinity;
  for(const t of TRANSPORTS){ const c=transportCost(t); if(c<m)m=c; }
  return m;
}
/* 路上耗时折算成"明天少玩的小时数"：飞机 0 / 高铁 1 / 大巴 2.5 / 自驾 3.5 */
function lateHours(t){ return Math.max(0, Math.round((t.time-1.5)*2)/2); }

/* 全局数值调参（按"每日多动作、单局 20-35 动作"重新校准） */
const TUNE = { me:0.28, hpNeg:0.6, stNeg:0.5, stPos:1.5 };
function applyEffects(eff){
  const comp=COMPANIONS[G.compKey], out={money:0,hp:0,en:0,st:0,me:0};
  const keys=["money","hp","en","st","me"];
  for(let i=0;i<keys.length;i++){
    const k=keys[i]; let v=eff[k]||0;
    if(k==="me" && v){
      v=Math.round(v*comp.meMul*(v>0?TUNE.me:1));                // 回忆增益按多动作压缩，衰减不变
    }
    if(k==="st" && v>0 && G.globals.includes("charm")) v=Math.max(0,v-5); // 平安符
    out[k]=v;
  }
  G.money+=out.money;
  G.hp=clamp(G.hp+out.hp,0,100);
  G.energy=clamp(G.energy+out.en,0,100);
  G.stress=clamp(G.stress+out.st,0,100);
  G.memory=clamp(G.memory+out.me,0,100);
  if(G.stress>G.stats.maxStress) G.stats.maxStress=G.stress;
  /* 余额预警：一旦买不起最便宜的回家车票，提醒一次（可忽略继续消费） */
  if(!G.finished){
    if(G.money<homeFare()){
      if(!G.flags.fareWarned){ G.flags.fareWarned=1; toast("⚠️ 余额已不够最便宜的回家路费（¥"+homeFare()+"），再花光就得提前打道回府"); }
    }else if(G.flags.fareWarned){ G.flags.fareWarned=0; }
  }
  return out;
}

/* ---------- 手牌 ---------- */
function findCard(flag){
  for(let i=0;i<G.cards.length;i++){ const d=CARD_MAP[G.cards[i].id]; if(d && d.flag===flag) return G.cards[i]; }
  return null;
}
function consumeCard(card){
  const i=G.cards.indexOf(card);
  if(i>=0){
    const d=CARD_MAP[card.id];
    G.cards.splice(i,1);
    if(d && d.flag){
      let still=false;
      for(const c of G.cards){ const dd=CARD_MAP[c.id]; if(dd && dd.flag===d.flag){ still=true; break; } }
      if(!still) delete G.flags[d.flag];
    }
  }
}
function consumeFlag(flag){ const c=findCard(flag); if(c) consumeCard(c); else delete G.flags[flag]; }

async function useCard(i){
  if(busy || !G || G.finished) return;
  const card=G.cards[i]; if(!card) return;
  const c=CARD_MAP[card.id];
  if(c.mode!=="active"){ toast("被动卡：满足条件时自动生效"); return; }
  busy=true;
  if(c.eff){ const out=applyEffects(c.eff); floatOut(out); }
  if(c.flag){
    if(c.flag==="earlyNext") G.flags.earlyNext=G.day+1;
    else G.flags[c.flag]=true;
  }
  G.cards.splice(i,1);
  renderHand(); renderHUD(); saveGame();
  toast("已使用："+c.name); SFX.good();
  await Stage.play(reactionScene("good"));
  busy=false; renderActions();
}

}

const TYPE_ORDER={food:0,spot:1,fun:2,shop:3,rest:4,photo:5};
function availActions(){

  list.sort((a,b)=> (TYPE_ORDER[a.type]-TYPE_ORDER[b.type]) || (a.cost-b.cost));
  return list;
}
/* 进入游戏屏前重置面板：清掉上一局残留的"返程回家"卡/手牌，避免开新局时先闪现旧卡 */

function renderActions(){

      '<div class="act-desc">'+a.desc+'</div><div class="act-chips">'+chips+'</div>';
    b.onclick=(function(card,c,nt,nm){ return async function(){
      if(busy) return;
      if(nt){
        b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
        SFX.bad(); toast("今天时间不够啦，明天再来");
        return;
      }
      if(nm){
        SFX.bad();
        const pick=await askNoMoney();
        if(pick==="home"){ busy=true; renderActions(); await goHomeByGreen(); return; }
        renderActions();   // 选择留下：刷新可选项
        return;
      }
      doAction(card);
    }; })(a,cost,noTime,noMoney);
    grid.appendChild(b);
  }
}

/* ---------- 动作执行：先播 3D 过场，再落数值 ---------- */
async function doAction(a){
  if(busy||G.finished) return;
  busy=true; renderActions();
  const cost=actionCost(a);
  const rawSt=a.st||0;
  const eff={money:-cost,
    hp:(a.hp||0)<0?Math.round(a.hp*TUNE.hpNeg):(a.hp||0),
    en:a.en||0,
    st:rawSt<0?Math.round(rawSt*TUNE.stNeg):Math.round(rawSt*TUNE.stPos),
    me:a.me||0};
  /* 全局被动 */
  if(a.type==="food" && G.globals.indexOf("foodie")>=0) eff.hp+=5;
  if(a.type==="photo" && G.globals.indexOf("film")>=0) eff.me+=8;
  if(a.type==="rest" && G.globals.indexOf("thermos")>=0) eff.en+=8;
  if(eff.en<0 && G.flags.earlyNext===G.day) eff.en=Math.round(eff.en/2);
  /* 单次被动 */
  if(a.type==="food"){
    const f=findCard("nextFoodFree");
    if(f){ eff.money=0; consumeCard(f); toast("团购达人券：这顿免单！"); }
  }
  if(a.type==="shop"){
    const gd=findCard("groupDeal");
    if(gd){ eff.money=-Math.round(cost*0.7); consumeCard(gd); toast("多人成团价：7 折！"); }
    const radar=findCard("nextShop");
    if(radar){ eff.me+=10; consumeCard(radar); toast("探店雷达：回忆+10"); }
  }
  if(a.type==="spot"){
    const vip=findCard("vipNext");
    if(vip){ eff.st-=20; eff.me+=10; consumeCard(vip); toast("绿色通道 VIP：丝滑入场"); }
  }
  if(a.type==="photo"){
    const flt=findCard("filterNext");
    if(flt){ eff.me+=15; consumeCard(flt); toast("神仙滤镜：回忆+15"); }
  }
  await Stage.play(actionScene(a));
  if(playAborted){ busy=false; return; }   // 过场中暂退：本次消费不落数值
  const out=applyEffects(eff);
  floatOut(out); SFX.good();
  G.stats[a.type]++;
  G.stats.actionsToday++;
  G.hoursLeft=Math.round((G.hoursLeft-a.time)*2)/2;
  if(G.stats.actionsToday>=5 && G.achs.indexOf("ironman")<0) G.achs.push("ironman");
  renderHUD(); saveGame();
  if(await checkBankrupt()){ await earlyReturn(); return; }
  await postAction();
  if(G.finished||playAborted) return;
  busy=false; renderActions();
}

/* ---------- 事件 ---------- */
function eventChance(){ return 0.30 + crowdOf(G.city,G.day)*0.02; }
/* 事件 when 按"假期段内第几天"判定：长假中秋段 1-3、请假段 4-6、国庆段换算回 1-7 */
function equivDay(day){
  if(G.totalDays===LONG_DAYS && day>6) return day-6;
  return day;
}
function rollEvent(){
  const pool=[];
  for(let i=0;i<EVENTS.length;i++){
    const e=EVENTS[i];
    if(G.eventIds.indexOf(e.id)>=0) continue;
    if(e.when && e.when.indexOf(equivDay(G.day))<0) continue;
    if(e.comp && e.comp.indexOf(G.companion)<0) continue;
    if(e.city && e.city.indexOf(G.city)<0) continue;
    pool.push(e);
  }
  if(!pool.length) return null;
  let total=0;
  for(let i=0;i<pool.length;i++) total+=pool[i].weight;
  let r=G.rng.next()*total;
  for(let i=0;i<pool.length;i++){ r-=pool[i].weight; if(r<=0) return pool[i]; }
  return pool[pool.length-1];
}
function isBadEff(e){ return e.money<0||e.hp<0||e.en<0||(e.st||0)>0; }
function neutralize(e){
  if(e.money<0)e.money=0; if(e.hp<0)e.hp=0; if(e.en<0)e.en=0; if(e.st>0)e.st=0;
}
function scoreOut(o){ return o.me + (o.money>0?6:0) + o.hp*.3 + o.en*.3 - o.st*.5; }
function chipsHtml(out){
  let h='<div class="mb-stat-row">';
  const names={money:"元",hp:"健康",en:"体力",st:"压力",me:"回忆"};
  const keys=["money","hp","en","st","me"];
  for(let i=0;i<keys.length;i++){
    const k=keys[i], v=out[k]; if(!v) continue;
    const good = k==="st" ? v<0 : v>0;
    h+='<span class="chip '+(good?"good":"bad")+'">'+FLOAT_EMO[k]+(v>0?"+":"")+v+" "+names[k]+"</span>";
  }
  return h+"</div>";
}
async function postAction(){
  const half=Math.round(G.totalDays/2);
  if(G.day===half && !G.tip7){ G.tip7=true; toast("假期过半，回血再战！"); }
  if(G.day>=G.totalDays){ finishGame(); return; }
  if(G.rng.next()<eventChance()){
    const ev=rollEvent();
    if(ev) await runEvent(ev);
  }
  if(playAborted) return;
  /* 事件把钱包掏空时，同样强制破产选择 */
  if(await checkBankrupt()){ await earlyReturn(); return; }
  /* 时间耗尽才自动过夜；否则交还玩家继续安排 */
  const canDoMore=availActions().some(function(a){ return a.time<=G.hoursLeft && actionCost(a)<=G.money; });
  if(!canDoMore){
    toast("今天的时间和盘缠都安排满啦，回酒店休息吧");
    await maybeMoveOrNext();
  }
}
function runEvent(ev){
  G.eventIds.push(ev.id);
  return new Promise(function(done){
    let opts="";
    for(let i=0;i<ev.options.length;i++){
      const op=ev.options[i];
      opts+='<button class="mb-opt" data-i="'+i+'"><div class="mo-label">'+op.label+'</div>'+
        (op.hint?'<div class="mo-hint">'+op.hint+'</div>':"")+
        (op.gamble?'<div class="mo-hint">🎲 赌一把运气</div>':"")+'</button>';
    }
    openModal('<div class="mb-emoji">'+ev.emoji+'</div><div class="mb-title">'+ev.title+'</div>'+
      '<div class="mb-desc">'+ev.desc+'</div><div class="mb-opts">'+opts+'</div>');
    const btns=$("modalBox").querySelectorAll(".mb-opt");
    for(let i=0;i<btns.length;i++){
      btns[i].onclick=function(){ resolveEventOption(ev, ev.options[i], done); };
    }
  });
}
async function resolveEventOption(ev, op, done){
  closeModal();
  let out, label, gambled=false, win=false, insuredNote="";
  if(op.gamble){
    G.stats.gambles++; gambled=true;
    let r=G.rng.next(), acc=0, pick=op.gamble[op.gamble.length-1];
    for(let i=0;i<op.gamble.length;i++){ acc+=op.gamble[i].chance; if(r<=acc){ pick=op.gamble[i]; break; } }
    const lucky=findCard("luckyNext");
    if(lucky){
      if(!pick.win){ const w=op.gamble.find(x=>x.win); if(w) pick=w; }
      consumeCard(lucky);
      toast("锦鲤附体，必中！");
    }
    win=!!pick.win; if(win) G.stats.gambleWins++;
    label=pick.label; out=applyEffects(pick.effects);
  }else{
    const eff={money:op.effects.money||0,hp:op.effects.hp||0,en:op.effects.en||0,st:op.effects.st||0,me:op.effects.me||0};
    const ins=findCard("insurance");
    if(ins && isBadEff(eff)){ neutralize(eff); consumeCard(ins); insuredNote="🛡️ 旅行意外险发动，本次损失已抵消！"; }
    label=op.label; out=applyEffects(eff);
  }
  renderHUD(); floatOut(out); renderHand(); saveGame();
  const kind = gambled ? "gamble" : (out.money>0 ? "money" : (scoreOut(out)>0 ? "good" : "bad"));
  if(kind==="bad") SFX.bad(); else if(kind==="money") SFX.coin(); else SFX.good();
  await Stage.play(reactionScene(kind, win));
  openModal('<div class="mb-emoji">'+ev.emoji+'</div><div class="mb-title">'+ev.title+'</div>'+
    '<div class="mb-result">'+label+'</div>'+(insuredNote?'<div class="mb-desc" style="color:#0f766e">'+insuredNote+'</div>':"")+
    chipsHtml(out)+'<div class="mb-btns"><button class="btn btn-primary" id="mbConfirm">继续</button></div>');
  $("mbConfirm").onclick=function(){ closeModal(); done(); };
}

/* ---------- 转城 / 交通 ---------- */
function moveDaysFor(){
  if(G.mode==="commando") return commandoMoveDays(G.totalDays);
  return daysOf(G.totalDays).moves;
}
async function maybeMoveOrNext(){
  const days=moveDaysFor();
  if(days.indexOf(G.day)>=0 && G.moveAsked!==G.day){
    G.moveAsked=G.day;
    const r=await askMove();
    if(r==="HOME_GREEN"||G.finished) return;
  }

  await endDay();
}
function askMove(){
  return new Promise(function(res){
    const keys=CITY_KEYS.filter(k=>k!==G.city);
    keys.sort((a,b)=>{
      const ua=G.visited.indexOf(a)<0?0:1, ub=G.visited.indexOf(b)<0?0:1;

    });

        '<div class="cc-tags"><span class="chip '+(seen?"":"good")+'">'+(seen?"故地重游":"新城市")+'</span></div></button>';

      '<div class="mb-desc">'+(G.mode==="commando"?"特种兵绝不回头，下一站必须冲！":"换城要花交通费和时间，但风景不重样")+'</div>'+
      '<div class="city-grid" style="margin-top:14px">'+cards+'</div>'+stay);

    for(let i=0;i<btns.length;i++){

        const r=await travelTo(k,false);
        res(r);
      };
    }
    if(stay) $("moveStay").onclick=function(){ closeModal(); toast("继续在这座城市慢享"); res(); };

}
function chooseTransport(returning){
  return new Promise(function(res){
    let rows="";
    const fallback = returning && TRANSPORTS.every(t=>transportCost(t)>G.money);
    const brokeStay = !returning && TRANSPORTS.every(t=>transportCost(t)>G.money);
    for(let i=0;i<TRANSPORTS.length;i++){
      const t=TRANSPORTS[i], cost=transportCost(t), no=cost>G.money;
      const speedTag = t.time<=1.5?'<span class="chip good">⚡ 最快</span>'
        : t.time<=2.5?'<span class="chip good">🚄 很快</span>'
        : t.time<=4?'<span class="chip">🐢 较慢</span>'
        : '<span class="chip">🐌 最慢</span>';
      const late=lateHours(t);
      const lateHint = returning ? "" : (late>0
        ? ' · 到达偏晚，明天少玩 '+late+'h'
        : ' · 当天抵达，明天满血开玩');
      rows+='<button class="mb-opt" data-i="'+i+'" '+(no?"disabled style='opacity:.45'":"")+'>'+
        '<div class="mo-label">'+t.emoji+" "+t.name+'<span class="chip money" style="margin-left:auto">¥'+cost+'</span></div>'+
        '<div class="mo-hint">'+t.desc+' · 耗时 '+t.time+'h '+speedTag+lateHint+(no?" · 余额不足":"")+'</div></button>';
    }
    if(fallback){
      rows+='<button class="mb-opt" data-i="99"><div class="mo-label">🎫 绿皮站票<span class="chip money" style="margin-left:auto">¥0</span></div>'+
        '<div class="mo-hint">挤也要挤回家，体力-20 压力+10</div></button>';
    }
    if(brokeStay){
      rows+='<button class="mb-opt" data-i="-1"><div class="mo-label">😅 盘缠不够，先留在'+CITIES[G.city].name+'</div>'+
        '<div class="mo-hint">这趟不换城了，省下路费继续玩</div></button>';
      rows+='<button class="mb-opt" data-i="-2"><div class="mo-label">🎫 坐绿皮火车，马上打道回府<span class="chip money" style="margin-left:auto">¥0</span></div>'+
        '<div class="mo-hint">余额不足提前结束旅行，体力 -20 压力 +10，直接生成人格卡片</div></button>';
    }
    openModal('<div class="mb-emoji">🎫</div><div class="mb-title">'+(returning?"选个方式回家":"选择出发方式")+'</div><div class="mb-opts">'+rows+'</div>');
    const btns=$("modalBox").querySelectorAll(".mb-opt");
    for(let i=0;i<btns.length;i++){
      btns[i].onclick=function(){
        if(this.disabled) return;
        const idx=+this.dataset.i;
        closeModal();
        if(idx===99) res({id:"bus",emoji:"🎫",name:"站票",cost:0,time:4,en:-20,st:10});
        else if(idx===-1) res(null);
        else if(idx===-2) res("GO_HOME_GREEN");
        else res(TRANSPORTS[idx]);
      };
    }
  });
}
async function travelTo(toKey, returning){
  let t=null, cost=0;
  const free=findCard("freeMove");
  if(free && !returning){ consumeCard(free); t=TRANSPORTS[0]; toast("本地熟人接应，免票出发！"); }
  else t=await chooseTransport(!!returning);
  if(t==="GO_HOME_GREEN"){ await goHomeByGreen(); return "HOME_GREEN"; }
  if(!t) return false;
  cost=transportCost(t);
  const half=findCard("nextTransport");
  if(half && cost>0){ cost=Math.round(cost/2); consumeCard(half); toast("高铁联名卡：交通费半价！"); }
  const en=t.en||0, st=t.st||0;
  const eff={money:-cost, en:en, st:st};
  if(G.globals.indexOf("walkman")>=0) eff.st-=10;
  const lp=findCard("lightPack");
  if(lp){ eff.en+=10; eff.st-=15; consumeCard(lp); toast("轻装上阵：换城也轻松"); }
  if(!returning && !G.city) Stage.setCity(toKey);
  await Stage.play(travelScene(t.id, toKey, returning));
  if(playAborted) return false;   // 过场中暂退首页：本次交通不落数值
  const out=applyEffects(eff);
  floatOut(out);
  G.stats.transportSpent+=cost;
  if(!returning){
    G.stats.moves++;
    if(G.visited.indexOf(toKey)<0) G.visited.push(toKey);
    G.city=toKey;
    G.weather=weatherOf(toKey,G.day,G.rng.next);
    /* 慢交通晚到：占用第二天的游玩时间（飞机 0 / 高铁 1h / 大巴 2.5h / 自驾 3.5h） */
    const late=lateHours(t);
    if(late>0) G.nextDayLate=Math.max(G.nextDayLate||0, late);
  }else{
    G.retName=t.name;   // 记录回家方式，写进鉴定报告
  }
  renderHUD(); renderHand(); saveGame();
  return true;
}

/* ---------- 一天结束 / 发牌 ---------- */
async function endDay(){
  await Stage.play(sleepScene());
  if(playAborted) return;   // 睡眠过场中暂退：不推进天数
  const eff={en:14, st:1, hp:0, me:-2};
  if(G.energy<20){ eff.hp-=7; eff.st+=7; toast("累到虚脱，健康受损……"); }
  if(G.stress>75) eff.hp-=5;
  const nf=findCard("nightFree");
  if(nf){ eff.en+=15; consumeCard(nf); toast("酒店免费升房，睡得超香！"); }
  const out=applyEffects(eff);
  floatOut(out);
  G.day++;
  if(G.day===2 && G.achs.indexOf("go")<0) G.achs.push("go");
  G.hoursLeft=DAY_HOURS; G.stats.actionsToday=0;
  if(G.flags.earlyNext && G.flags.earlyNext<G.day) consumeFlag("earlyNext");
  renderHUD(); saveGame();
  if(G.day>G.totalDays){ finishGame(); return; }
  if(G.day===G.totalDays){ renderReturn(); return; }
  if(daysOf(G.totalDays).cards.indexOf(G.day)>=0){
    await grantCardDeal();
    if(G.finished||playAborted) return;
  }
  beginDay();
}
async function onEndDayClick(){
  if(busy||G.finished) return;
  busy=true;
  const days=moveDaysFor();
  if(days.indexOf(G.day)>=0 && G.moveAsked!==G.day){
    G.moveAsked=G.day;
    const r=await askMove();
    if(r==="HOME_GREEN"||G.finished){ busy=false; return; }
  }
  await endDay();
  busy=false; renderActions();
}
function beginDay(){
  G.weather=weatherOf(G.city,G.day,G.rng.next);
  $("endDayBtn").classList.remove("hidden");
  /* 慢交通晚到：次日少玩若干小时（保底 4h） */
  const late=G.nextDayLate||0; G.nextDayLate=0;
  if(late>0){ G.hoursLeft=Math.max(4, G.hoursLeft-late); toast("🛬 路上耗时 "+(late+1.5)+"h，今天少玩 "+late+" 小时"); }
  $("actSecTitle").textContent="第 "+G.day+" 天 · 在"+CITIES[G.city].name+"安排点什么？";
  renderHUD(); renderHand(); renderActions(); saveGame();
}
function renderReturn(){
  G.weather=weatherOf(G.city,G.day,G.rng.next);
