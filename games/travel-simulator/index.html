  toast("钱包空空，提前踏上归途……");
  const ok=await travelTo(null,true);
  if(ok) finishGame();
  else busy=false;
}
function grantCardDeal(){
  return new Promise(function(res){
    const arr=CARDS.slice();
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(G.rng.next()*(i+1));
      const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
    }
    const picks=[];
    for(let i=0;i<arr.length && picks.length<3;i++){
      const c=arr[i];
      if(c.global && G.globals.indexOf(c.global)>=0) continue;
      picks.push(c);
    }
    let html='<div class="mb-emoji">🎴</div><div class="mb-title">旅途收获</div><div class="mb-desc">三选一，挑一张手牌带走</div><div class="deal-row">';
    for(let i=0;i<picks.length;i++){
      const c=picks[i];
      html+='<button class="deal-card" data-i="'+i+'"><div class="dc-emoji">'+c.emoji+'</div><div class="dc-name">'+c.name+'</div>'+
        '<div class="dc-desc">'+c.desc+'</div><div class="dc-mode">'+(c.mode==="active"?"主动使用":"被动")+'</div></button>';
    }
    openModal(html+'</div>');
    const btns=$("modalBox").querySelectorAll(".deal-card");
    for(let i=0;i<btns.length;i++){
      btns[i].onclick=function(){ resolveCardPick(picks[+this.dataset.i], res); };
    }
  });
}
async function resolveCardPick(c, done){
  closeModal();
  G.stats.cardsGotten++;
  markCodex("cards",c.id);
  if(c.global){
    G.globals.push(c.global);
    toast("获得被动神技："+c.name);
  }else if(c.onDraw==="scratch"){
    const amt=50+Math.floor(G.rng.next()*251);
    const out=applyEffects({money:amt});
    toast("三连刮刮乐：+"+amt+" 元！");
    floatOut(out); renderHUD(); SFX.coin();
    await Stage.play(reactionScene("money"));
  }else{
    G.cards.push({id:c.id, uid:G.uidSeq++});
    toast("入手手牌："+c.name);
  }
  renderHand(); renderHUD(); saveGame();
  done();
}

/* ---------- 存档 ---------- */
function saveGame(){
  if(!G || G.finished) return;
  G.rngState=G.rng.state();
  const d=Object.assign({},G); delete d.rng;
  store.set(LS_SAVE,d);
}
function loadGame(){
  const d=store.get(LS_SAVE,null);
  if(!d) return false;
  G=d;
  /* 旧版本存档兼容：补齐请假/天数字段 */
  if(!G.totalDays) G.totalDays=LONG_DAYS;
  if(G.leaveAsked===undefined) G.leaveAsked=true;
  if(G.bossApproved===undefined) G.bossApproved=true;
  G.rng=makeRng(d.rngState!==undefined?d.rngState:d.seed);
  return true;
}
function hasSave(){ return !!store.get(LS_SAVE,null); }
function setSettings(p){ const s=store.get(LS_SET,{}); Object.assign(s,p); store.set(LS_SET,s); }

/* ---------- 图鉴 ---------- */
function getCodex(){ return store.get(LS_CODEX,{endings:{},achs:{},cards:{}}); }
function markCodex(kind,id){
  const c=getCodex();
  if(!c[kind]) c[kind]={};
  c[kind][id]=true;
  store.set(LS_CODEX,c);
}
function openCodex(){
  const c=getCodex();
  let eh="";
  for(const e of ENDINGS){
    const got=c.endings[e.id];
    eh+='<div class="codex-item'+(got?"":" locked")+'"><div class="ci2-emoji">'+(got?e.emoji:"❔")+'</div><div class="ci2-name">'+(got?e.name:"未解锁结局")+'</div>'+
      '<div class="ci2-desc">'+(got?e.desc:"用不同的玩法触发它吧")+'</div></div>';
  }
  let ah="";
  for(const a of ACHIEVEMENTS){
    const got=c.achs[a.id];
    ah+='<div class="codex-item'+(got?"":" locked")+'"><div class="ci2-emoji">'+(got?a.emoji:"🔒")+'</div><div class="ci2-name">'+(got?a.name:"???")+'</div>'+
      '<div class="ci2-desc">'+a.desc+'</div></div>';
  }
  let ch="";
  for(const card of CARDS){
    const got=c.cards[card.id];
    ch+='<div class="codex-item'+(got?"":" locked")+'"><div class="ci2-emoji">'+(got?card.emoji:"🎴")+'</div><div class="ci2-name">'+(got?card.name:"未收录")+'</div>'+
      '<div class="ci2-desc">'+(got?card.desc:"旅途中有机会获得")+'</div></div>';
  }
  openModal('<div class="mb-title">🏅 国庆图鉴</div>'+
    '<div class="sec-title" style="margin-top:14px">结局 '+Object.keys(c.endings).length+' / '+ENDINGS.length+'</div><div class="codex-grid">'+eh+'</div>'+
    '<div class="sec-title" style="margin-top:14px">成就 '+Object.keys(c.achs).length+' / '+ACHIEVEMENTS.length+'</div><div class="codex-grid">'+ah+'</div>'+
    '<div class="sec-title" style="margin-top:14px">手牌 '+Object.keys(c.cards).length+' / '+CARDS.length+'</div><div class="codex-grid">'+ch+'</div>'+
    '<div class="mb-btns"><button class="btn btn-primary" id="codexClose">收下图鉴</button></div>');
  $("codexClose").onclick=closeModal;
}

/* ---------- 结算 ---------- */
function finishGame(){
  if(G.finished) return;
  G.finished=true;
  const endId=matchEnding(G);
  const end=ENDINGS.find(e=>e.id===endId)||ENDINGS[ENDINGS.length-1];
  const addA=id=>{ if(G.achs.indexOf(id)<0) G.achs.push(id); };
  if(G.visited.length>=5) addA("cities5");
  if(G.stats.food>=10) addA("foodie");
  if(G.stats.gambleWins>=2) addA("gambler");
  if(G.stats.gambleWins>=3) addA("lucky");
  if(G.stats.cardsGotten>=4) addA("cards");
  if(G.stats.maxStress<=60) addA("calm");
  if(G.visited.length>=3) addA("commando");
  if(G.stress<=20) addA("zenend");
  if(endId==="perfect") addA("perfect");
  if(!G.earlyEnd) addA("finish");
  for(const id of G.achs) markCodex("achs",id);
  markCodex("endings",endId);
  store.set(LS_LAST,{seed:G.seed,modeIdx:G.modeIdx,compKey:G.compKey});
  renderFinal(end);
  store.del(LS_SAVE);
  showScreen("final");
  SFX.good();
}
function renderFinal(end){
  BGM.leave();
  $("finalEmoji").textContent=end.emoji;
  $("finalTitle").textContent=end.name;
  const st=G.stats;
  $("finalDesc").textContent=end.desc+(G.earlyEnd?"（钱包告急，第 "+G.day+" 天乘"+(G.retName||"车")+"提前返程）":"");
  const items=[["🗺️ 打卡城市",G.visited.length+" 座"],["📅 实际旅程",G.day+" / "+G.totalDays+" 天"],["🚄 交通花费","¥"+Math.round(st.transportSpent)],
    ["🍜 干饭",st.food+" 顿"],["🎉 娱乐",st.fun+" 次"],["📸 拍照",st.photo+" 次"],
    ["🃏 手牌",st.cardsGotten+" 张"],["🚄 换城",st.moves+" 次"],["💰 剩余",Math.round(G.money)+" 元"]];
  $("finalStats").innerHTML=items.map(it=>'<div class="fs-item"><b>'+it[1]+'</b><span>'+it[0]+'</span></div>').join("");
  $("finalAchs").innerHTML=G.achs.map(id=>{
    const a=ACHIEVEMENTS.find(x=>x.id===id);
    return a?'<span class="ach-pill">'+a.emoji+" "+a.name+'</span>':"";
  }).join("");
  drawShare(end);
}

/* ---------- 分享卡（Canvas 2D） ---------- */
function rrPath(x,a,b,w,h,r){
  x.beginPath();
  x.moveTo(a+r,b);
  x.arcTo(a+w,b,a+w,b+h,r);
  x.arcTo(a+w,b+h,a,b+h,r);
  x.arcTo(a,b+h,a,b,r);
  x.arcTo(a,b,a+w,b,r);
  x.closePath();
}
function wrapLines(x,text,maxW){
  const out=[]; let cur="";
  for(const ch of text){
    if(x.measureText(cur+ch).width>maxW && cur){ out.push(cur); cur=ch; }
    else cur+=ch;
  }
  if(cur) out.push(cur);
  return out;
}
function drawShare(end){
  const cv=$("shareCanvas"), x=cv.getContext("2d"), W=900;
  const g=x.createLinearGradient(0,0,0,900);
  g.addColorStop(0,"#1f2a44"); g.addColorStop(.62,"#312e81"); g.addColorStop(1,"#7c2d12");
  x.fillStyle=g; x.fillRect(0,0,900,900);
  // 顶部胶囊
  rrPath(x,270,60,360,52,26); x.fillStyle="rgba(253,186,117,.18)"; x.fill();
  x.strokeStyle="rgba(253,186,117,.55)"; x.lineWidth=2; x.stroke();
  x.fillStyle="#fde68a"; x.font="700 24px 'Noto Sans SC',sans-serif"; x.textAlign="center"; x.textBaseline="middle";
  x.fillText("🎒 国庆旅行人格卡片",450,87);
  // 结局 emoji
  x.font="130px serif"; x.fillText(end.emoji,450,235);
  // 结局名
  x.fillStyle="#ffffff"; x.font='900 62px "ZCOOL KuaiLe","Noto Sans SC",sans-serif';
  x.fillText(end.name,450,350);
  // 描述
  x.fillStyle="#e2e8f0"; x.font="400 25px 'Noto Sans SC',sans-serif";
  const lines=wrapLines(x,end.desc,720);
  let y=418;
  for(let i=0;i<Math.min(lines.length,G.earlyEnd?3:4);i++){ x.fillText(lines[i],450,y); y+=40; }
  // 提前返程标记
  if(G.earlyEnd){
    rrPath(x,160,y+6,580,44,22); x.fillStyle="rgba(251,146,60,.92)"; x.fill();
    x.fillStyle="#ffffff"; x.font="800 22px 'Noto Sans SC',sans-serif";
    x.fillText("🪦 第 "+G.day+" 天钱包告急 · 乘"+(G.retName||"车")+"提前回家",450,y+29);
  }
  // 数据 3×2
  const st=G.stats;
  const boxes=[["🗺️ 城市",G.visited.length+"座"],["📅 旅程",G.day+"/"+G.totalDays+"天"],["🍜 干饭",st.food+"顿"],
    ["📸 拍照",st.photo+"次"],["🚄 交通","¥"+Math.round(st.transportSpent)],["💰 余额",Math.round(G.money)+"元"]];
  x.font="800 34px 'Noto Sans SC',sans-serif";
  for(let i=0;i<boxes.length;i++){
    const bx=90+(i%3)*240, by=610+Math.floor(i/3)*106;
    rrPath(x,bx,by,220,92,16); x.fillStyle="rgba(255,255,255,.1)"; x.fill();
    x.fillStyle="#ffffff"; x.fillText(boxes[i][1],bx+110,by+38);
    x.fillStyle="#cbd5e1"; x.font="700 20px 'Noto Sans SC',sans-serif";
    x.fillText(boxes[i][0],bx+110,by+70);
    x.font="800 34px 'Noto Sans SC',sans-serif";
  }
  // 挑战码
  const code=seedToCode(G.seed,G.modeIdx,COMP_KEYS.indexOf(G.compKey));
  rrPath(x,300,836,300,48,24); x.fillStyle="rgba(251,146,60,.92)"; x.fill();
  x.fillStyle="#ffffff"; x.font="900 26px 'Noto Sans SC',sans-serif";
  x.fillText("🔢 同码再战 "+code,450,861);
}

/* ============================================================
 * 6. BOOT：屏幕切换 / 首页 / 选择屏 / 全局绑定
 * ============================================================ */
function showScreen(id){
  const ss=document.querySelectorAll(".screen");
  for(let i=0;i<ss.length;i++) ss[i].classList.remove("active");
  $(id).classList.add("active");
}
function applyFast(){
  const fast=!!store.get(LS_SET,{}).fast;
  Stage.setFast(fast);
  $("fastBtn").classList.toggle("on",fast);
}
function renderHomeModes(){
  $("homeModes").innerHTML=MODES.map((m,i)=>
    '<button class="mode-card'+(i===modeSel?' sel':'')+'" data-i="'+i+'">'+
    '<div class="mc-top"><span class="mc-emoji">'+m.emoji+'</span>'+m.name+'</div>'+
    '<div class="mc-desc">'+m.desc+'</div><div class="mc-money">💰 起始预算 ¥'+m.money+' · 花费×'+m.moneyMul+'</div></button>'
  ).join("");
  $("homeModes").querySelectorAll(".mode-card").forEach(b=>{
    b.onclick=function(){ modeSel=+this.dataset.i; renderHomeModes(); SFX.tap(); };
  });
  $("continueBtn").disabled=!hasSave();
}
function renderCompanions(){
  $("companionList").innerHTML=COMP_KEYS.map(k=>{
    const c=COMPANIONS[k];
    return '<button class="pick-card" data-k="'+k+'"><div class="pc-emoji">'+c.emoji+'</div>'+
      '<div class="pc-main"><div class="pc-name">'+c.name+'</div><div class="pc-desc">'+c.desc+'</div>'+
      '<div class="pc-tags"><span class="chip money">花费×'+c.costMul+'</span><span class="chip good">回忆×'+c.meMul+'</span>'+
      '<span class="chip">'+c.count+' 人成行</span></div></div><div class="pc-go">→</div></button>';
  }).join("");
  $("companionList").querySelectorAll(".pick-card").forEach(b=>{
    b.onclick=function(){
      pendingComp=this.dataset.k; SFX.tap();
      renderCityPick(); showScreen("destination");
    };
  });
}
function renderCityPick(){
  citySel=null; $("confirmCityBtn").disabled=true;
  $("cityGrid").innerHTML=CITY_KEYS.map(k=>{
    const c=CITIES[k], crowd=crowdOf(k,1);
    const lvl=crowd>=9?"人从众":crowd>=7?"人挤人":"还行";
    return '<button class="city-card" data-k="'+k+'"><span class="cc-crowd">'+lvl+" "+crowd+'/10</span>'+
      '<div class="cc-emoji">'+c.emoji+'</div><div class="cc-name">'+c.name+'</div>'+
      '<div class="cc-tags">'+c.tags.map(t=>'<span class="chip">'+t+'</span>').join("")+'</div></button>';
  }).join("");
  $("cityGrid").querySelectorAll(".city-card").forEach(b=>{
    b.onclick=function(){
      citySel=this.dataset.k; SFX.tap();
      $("cityGrid").querySelectorAll(".city-card").forEach(x=>x.classList.remove("sel"));
      this.classList.add("sel");
      $("confirmCityBtn").disabled=false;
    };
  });
}
async function startRun(cityKey){
  newGame(pendingMode, pendingComp, pendingSeed);
  playAborted=false; bankruptLock=false;
  /* 出发前先定假期：问请假 → 老板审批 → 决定 13 天 / 7 天 */
  await askLeave();
  if(playAborted) return;
  resetGamePanel();
  showScreen("game");
  BGM.enter();
  Stage.attachGame($("stage3d"));
  Stage.setActors(COMPANIONS[G.compKey].count, COMP_ROLES[G.compKey]);
  Stage.setCity(cityKey);
  applyFast();
  renderHUD();
  busy=true;
  await travelTo(cityKey,false);
  if(playAborted) return;
  busy=false;
  beginDay();
}
function continueRun(){
  if(!loadGame()){ toast("没有找到存档"); return; }
  if(G.finished){ store.del(LS_SAVE); $("continueBtn").disabled=true; toast("上局已结束，开新档吧"); return; }
  playAborted=false; bankruptLock=false;
  resetGamePanel();
  showScreen("game");
  BGM.enter();
  Stage.attachGame($("stage3d"));
  Stage.setActors(COMPANIONS[G.compKey].count, COMP_ROLES[G.compKey]);
  Stage.setCity(G.city);
  applyFast();
  busy=false;
  if(G.day>=G.totalDays) renderReturn(); else beginDay();
  renderHand();
}
function openChallenge(){
  openModal('<div class="mb-emoji">🔢</div><div class="mb-title">输入挑战码</div>'+
    '<div class="mb-desc">同样的码 = 同样的随机事件，试试别人分享的命运</div>'+
    '<input id="codeInput" maxlength="7" placeholder="例如 A8K2P9X" style="width:100%;margin-top:14px;font-size:22px;font-weight:900;text-align:center;letter-spacing:6px;padding:14px;border:2px solid #fdba74;border-radius:14px;text-transform:uppercase">'+
    '<div class="mb-btns"><button class="btn btn-ghost" id="codeCancel">取消</button><button class="btn btn-primary" id="codeGo">开启命运</button></div>');
  const input=$("codeInput");
  setTimeout(()=>input.focus(),120);
  $("codeCancel").onclick=closeModal;
  $("codeGo").onclick=function(){
    const r=codeToSeed(input.value);
    if(!r || r.modeIdx>=MODES.length || r.compIdx>=COMP_KEYS.length){ toast("挑战码无效"); SFX.bad(); return; }
    pendingSeed=r.seed; pendingMode=r.modeIdx; pendingComp=COMP_KEYS[r.compIdx];
    closeModal(); SFX.good();
    renderCityPick(); showScreen("destination");
  };
}

let modeSel=0;
function init(){
  renderHomeModes();
  Stage.attachHome($("home3d"));
  applyFast();

  const settings=store.get(LS_SET,{});
  SFX.setOn(settings.sound!==false);
  BGM.setEnabled(settings.sound!==false);
  $("soundBtn").textContent = settings.sound===false ? "🔇" : "🔊";

  $("soundBtn").onclick=function(){ applySoundSetting(!SFX.on); };
  $("startBtn").onclick=function(){
    pendingSeed=Math.floor(Math.random()*4294967296);
    pendingMode=modeSel; pendingComp=null;
    renderCompanions(); showScreen("companion");
  };
  $("continueBtn").onclick=continueRun;
  $("challengeBtn").onclick=openChallenge;
  $("codexBtn").onclick=openCodex;
  $("codexBtn2").onclick=openCodex;
  $("confirmCityBtn").onclick=function(){ if(citySel) startRun(citySel); };

  $("endDayBtn").onclick=onEndDayClick;
  $("skipBtn").onclick=function(){ Stage.skip(); };
  $("menuBtn").onclick=openGameMenu;
  $("fastBtn").onclick=function(){
    const next=!store.get(LS_SET,{}).fast;
    setSettings({fast:next}); Stage.setFast(next);
    this.classList.toggle("on",next);
    toast(next?"⏩ 极速模式：过场加速":"恢复正常速度");
  };

  $("saveShareBtn").onclick=function(){
    try{
      const a=document.createElement("a");
      a.download="国庆旅行人格卡片.png";
      a.href=$("shareCanvas").toDataURL("image/png");
      document.body.appendChild(a); a.click(); a.remove();
      toast("海报已保存到下载；手机上也可长按图片存相册");
    }catch(e){ toast("长按/右键战果图即可保存到相册"); }
  };
  $("backHomeBtn").onclick=function(){
    showScreen("home"); Stage.attachHome($("home3d")); renderHomeModes();
  };
  $("replaySameBtn").onclick=function(){
    const last=store.get(LS_LAST,null);
    if(!last){ toast("没有可再战的记录"); return; }
    pendingSeed=last.seed; pendingMode=last.modeIdx; pendingComp=last.compKey;
    renderCityPick(); showScreen("destination");
  };

  document.addEventListener("pointerdown",function(e){
    if(e.target.closest("button,.act-card,.card-item,.mode-card,.pick-card,.city-card,.deal-card")) SFX.tap();
  },{passive:true});
}
init();
</script>
